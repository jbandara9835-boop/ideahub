<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdeaHub — Earn from your ideas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-light:#F0D080;--gold-dim:#7A5E1E;
  --dark:#0D0D0D;--dark2:#121212;--dark3:#1A1A1A;--dark4:#242424;--surface:#2E2E2E;
  --text:#F0EBE0;--text-muted:#9A9080;--text-dim:#5C5448;
  --border:rgba(201,168,76,.22);--bl:rgba(201,168,76,.09);
  --green:#50C878;--red:#FF6B6B;--blue:#7BA7FF;--purple:#B57BFF;
  --r:12px;--rl:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--dark2)}
::-webkit-scrollbar-thumb{background:var(--dark4);border-radius:3px}
button,input,select,textarea{font-family:'DM Sans',sans-serif;outline:none}
input,select,textarea{
  background:var(--dark4);border:1px solid var(--bl);border-radius:var(--r);
  color:var(--text);font-size:14px;padding:10px 14px;width:100%;transition:.2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--border)}
select option{background:var(--dark3)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:900;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:rgba(13,13,13,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--bl)}
.n-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--gold);cursor:pointer;letter-spacing:1px}
.n-links{display:flex;gap:4px;align-items:center}
.n-btn{background:none;border:none;color:var(--text-muted);font-size:13px;padding:7px 12px;cursor:pointer;border-radius:8px;transition:.2s}
.n-btn:hover,.n-btn.act{color:var(--text);background:var(--dark4)}
.n-btn.act{color:var(--gold)}
.n-cta{background:var(--gold);color:var(--dark);font-weight:600;font-size:13px;padding:8px 18px;border-radius:8px;border:none;cursor:pointer;transition:.2s}
.n-cta:hover{background:var(--gold-light)}
.n-badge{background:var(--red);color:#fff;font-size:10px;padding:2px 5px;border-radius:4px;margin-left:4px}

/* PAGES */
.page{padding-top:64px;min-height:100vh}

/* HERO */
.hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 5% 60px;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(201,168,76,.13) 0%,transparent 70%),radial-gradient(ellipse 35% 35% at 85% 85%,rgba(201,168,76,.06) 0%,transparent 60%)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.035) 1px,transparent 1px);background-size:56px 56px}
.hero-float{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.htag{display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.1);border:1px solid var(--border);color:var(--gold);font-size:11px;font-weight:500;padding:5px 14px;border-radius:100px;margin-bottom:24px;position:relative;z-index:1;letter-spacing:1.2px;text-transform:uppercase}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(40px,7vw,90px);font-weight:900;line-height:1.03;position:relative;z-index:1;margin-bottom:20px}
.hero h1 .ac{color:var(--gold)}
.hero p{font-size:17px;color:var(--text-muted);max-width:540px;line-height:1.75;margin-bottom:40px;position:relative;z-index:1}
.hero-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;position:relative;z-index:1}

/* BUTTONS */
.btn-p{background:var(--gold);color:var(--dark);font-weight:600;font-size:14px;padding:12px 26px;border-radius:10px;border:none;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px}
.btn-p:hover{background:var(--gold-light);transform:translateY(-1px)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-o{background:none;color:var(--text);font-weight:500;font-size:14px;padding:12px 26px;border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px}
.btn-o:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px}
.btn-ghost{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;transition:.2s;padding:6px 10px;border-radius:6px}
.btn-ghost:hover{color:var(--text);background:var(--dark4)}
.btn-danger{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.3);font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;transition:.2s}
.btn-danger:hover{background:rgba(255,107,107,.2)}

/* STATS BAR */
.stats-bar{padding:50px 5%;border-top:1px solid var(--bl);border-bottom:1px solid var(--bl)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:30px;max-width:880px;margin:0 auto;text-align:center}
.snum{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:var(--gold)}
.slbl{font-size:12px;color:var(--text-muted);margin-top:3px}

/* SECTION */
.sec{padding:80px 5%}
.sec-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:14px;text-align:center}
.sec-title{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,42px);text-align:center;margin-bottom:48px;line-height:1.2}

/* ROLE CARDS */
.roles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:1080px;margin:0 auto}
.role-card{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--rl);padding:24px 20px 28px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.role-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:.3s}
.role-card:hover{border-color:var(--border);transform:translateY(-3px);background:var(--dark4)}
.role-card:hover::before{opacity:1}
.r-icon{width:44px;height:44px;background:rgba(201,168,76,.12);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:20px}
.role-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.role-card p{font-size:12px;color:var(--text-muted);line-height:1.6;margin-bottom:16px}
.r-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--gold);background:none;border:1px solid var(--border);padding:7px 14px;border-radius:7px;cursor:pointer;transition:.2s}
.r-link:hover{background:rgba(201,168,76,.1)}

/* STEPS */
.steps-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;max-width:1000px;margin:0 auto;position:relative}
.steps-row::before{content:'';position:absolute;top:32px;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--border),var(--gold),var(--border),transparent)}
.step{text-align:center;padding:0 16px 32px;position:relative}
.step-n{width:64px;height:64px;background:var(--dark3);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--gold);position:relative;z-index:1}
.step h4{font-size:14px;font-weight:600;margin-bottom:6px}
.step p{font-size:12px;color:var(--text-muted);line-height:1.6}

/* FEATURE CARDS */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:1080px;margin:0 auto}
.feat-card{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--r);padding:22px}
.fbadge{display:inline-block;background:rgba(201,168,76,.12);color:var(--gold);font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:5px;margin-bottom:12px}
.feat-card h4{font-size:14px;font-weight:600;margin-bottom:7px}
.feat-card p{font-size:12px;color:var(--text-muted);line-height:1.6}

/* FOOTER */
footer{padding:50px 5% 36px;border-top:1px solid var(--bl);text-align:center}
.f-logo{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);margin-bottom:10px}
.f-links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.f-links a{font-size:12px;color:var(--text-muted);cursor:pointer;transition:.2s}
.f-links a:hover{color:var(--gold)}

/* MODAL */
.ov{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.modal{background:var(--dark2);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:430px;position:relative;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
.modal-lg{max-width:700px}
.modal-xl{max-width:900px}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.mc{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;transition:.2s}
.mc:hover{color:var(--text)}
.modal h2{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:5px}
.modal .sub{font-size:13px;color:var(--text-muted);margin-bottom:24px}
.rtag{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,.12);border:1px solid var(--border);color:var(--gold);font-size:11px;padding:4px 11px;border-radius:6px;margin-bottom:20px}
.fg{margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.social-logins{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.s-btn{display:flex;align-items:center;gap:9px;justify-content:center;padding:10px;border-radius:8px;border:1px solid var(--bl);background:var(--dark4);color:var(--text);font-size:13px;cursor:pointer;transition:.2s}
.s-btn:hover{border-color:var(--border);background:var(--dark3)}
.divider{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bl)}
.divider span{font-size:11px;color:var(--text-dim)}
.auth-sw{text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px}
.auth-sw span{color:var(--gold);cursor:pointer}
.btn-full{width:100%;justify-content:center}

/* DASHBOARD */
.dash-wrap{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:220px;flex-shrink:0;background:var(--dark2);border-right:1px solid var(--bl);padding:20px 0;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.s-user{padding:14px 16px;border-bottom:1px solid var(--bl);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--gold-dim),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--dark);flex-shrink:0}
.av40{width:40px;height:40px;font-size:15px}
.av32{width:32px;height:32px;font-size:12px}
.av28{width:28px;height:28px;font-size:11px}
.av56{width:56px;height:56px;font-size:20px}
.av80{width:80px;height:80px;font-size:28px}
.s-user .uname{font-size:13px;font-weight:500}
.s-user .urole{font-size:11px;color:var(--text-muted)}
.s-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);padding:0 16px;margin-bottom:5px}
.s-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:8px;color:var(--text-muted);font-size:13px;cursor:pointer;transition:.2s;margin:0 6px 2px}
.s-item:hover,.s-item.act{background:rgba(201,168,76,.1);color:var(--gold)}
.s-icon{font-size:15px;width:18px;text-align:center}
.s-sep{height:1px;background:var(--bl);margin:12px 16px}
.dash-main{flex:1;padding:32px 36px;overflow:auto}
.dash-hd{margin-bottom:28px}
.dash-hd h1{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:3px}
.dash-hd p{font-size:13px;color:var(--text-muted)}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.mcard{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--r);padding:18px}
.mlbl{font-size:11px;color:var(--text-muted);margin-bottom:7px}
.mval{font-size:26px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
.msub{font-size:11px;color:var(--text-dim);margin-top:3px}
.panel{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--r);padding:22px;margin-bottom:20px}
.panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel-hd h3{font-size:15px;font-weight:600}
.irow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--bl)}
.irow:last-child{border-bottom:none}
.i-box{width:38px;height:38px;border-radius:9px;background:rgba(201,168,76,.1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ititle{font-size:13px;font-weight:500}
.imeta{font-size:11px;color:var(--text-muted);margin-top:2px}
.badge-st{margin-left:auto;flex-shrink:0;font-size:10px;font-weight:500;padding:3px 9px;border-radius:5px}
.st-live{background:rgba(80,200,120,.14);color:var(--green)}
.st-pend{background:rgba(201,168,76,.14);color:var(--gold)}
.st-sold{background:rgba(123,167,255,.14);color:var(--blue)}
.st-esc{background:rgba(181,123,255,.14);color:var(--purple)}
.st-rev{background:rgba(255,107,107,.14);color:var(--red)}

/* EXPLORE */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;align-items:center}
.srch{display:flex;align-items:center;gap:8px;background:var(--dark3);border:1px solid var(--bl);border-radius:var(--r);padding:0 14px;flex:1;min-width:200px}
.srch input{background:none;border:none;color:var(--text);font-size:13px;padding:9px 0;flex:1}
.srch input::placeholder{color:var(--text-dim)}
.f-btn{background:var(--dark3);border:1px solid var(--bl);color:var(--text-muted);font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.f-btn:hover,.f-btn.act{background:rgba(201,168,76,.1);color:var(--gold);border-color:var(--border)}
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.ic{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--rl);padding:22px;cursor:pointer;transition:.3s;display:flex;flex-direction:column}
.ic:hover{border-color:var(--border);transform:translateY(-2px);background:var(--dark4)}
.ic-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ic-ico{width:42px;height:42px;border-radius:9px;background:rgba(201,168,76,.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ic h4{font-size:14px;font-weight:600;margin-bottom:3px}
.ic .cr{font-size:11px;color:var(--text-muted)}
.ic p{font-size:12px;color:var(--text-muted);line-height:1.6;flex:1;margin-bottom:16px}
.ic-ft{display:flex;align-items:center;justify-content:space-between}
.price{font-size:17px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
.lvl{font-size:10px;padding:3px 7px;border-radius:4px;font-weight:500}
.l1{background:rgba(80,200,80,.14);color:#80D880}
.l2{background:rgba(201,168,76,.14);color:var(--gold)}
.l3{background:rgba(255,107,107,.14);color:var(--red)}
.ind-tag{display:inline-block;background:var(--dark4);border:1px solid var(--bl);color:var(--text-muted);font-size:10px;padding:2px 7px;border-radius:4px;margin-right:4px;margin-bottom:8px}

/* POST IDEA */
.post-wrap{max-width:760px;margin:0 auto;padding:32px 5% 60px}
.fsec{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--rl);padding:24px;margin-bottom:18px}
.fsec h3{font-size:14px;font-weight:600;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--bl);display:flex;align-items:center;gap:8px}
.lvl-sel{display:flex;gap:10px}
.lo{flex:1;padding:12px;border-radius:10px;text-align:center;cursor:pointer;border:1px solid var(--bl);background:var(--dark4);transition:.2s}
.lo:hover{border-color:var(--border)}
.lo.sel{border-color:var(--gold);background:rgba(201,168,76,.08)}
.lo .ln{font-size:20px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
.lo .lname{font-size:11px;color:var(--text-muted);margin-top:3px}
.upload-box{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:.2s;background:rgba(201,168,76,.02)}
.upload-box:hover{border-color:var(--gold);background:rgba(201,168,76,.05)}
.vis-opts{display:flex;flex-direction:column;gap:8px}
.vo{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--bl);cursor:pointer;transition:.2s;background:var(--dark4)}
.vo:hover,.vo.sel{border-color:var(--gold);background:rgba(201,168,76,.06)}
.vo .vt{font-size:13px;font-weight:500;margin-bottom:2px}
.vo .vd{font-size:11px;color:var(--text-muted)}
.eng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.eo{padding:12px;border-radius:10px;border:1px solid var(--bl);cursor:pointer;transition:.2s;background:var(--dark4)}
.eo:hover,.eo.sel{border-color:var(--gold);background:rgba(201,168,76,.06)}
.et{font-size:12px;font-weight:500;margin-bottom:3px}
.ep{font-size:11px;color:var(--gold)}
.price-row{display:flex;align-items:center;gap:10px}
.price-pre{font-size:16px;color:var(--text-muted)}
.price-in{flex:1;font-size:18px;font-weight:700;font-family:'Playfair Display',serif}

/* PROFILE */
.prof-wrap{max-width:820px;margin:0 auto;padding:32px 5% 60px}
.prof-hd{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--rl);padding:28px;display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;position:relative;overflow:hidden}
.prof-hd::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-dim))}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px;margin-bottom:6px}
.badges-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,.1);border:1px solid var(--border);color:var(--gold);font-size:10px;padding:3px 9px;border-radius:5px;font-weight:500}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.psc{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--r);padding:18px;text-align:center}
.psn{font-size:26px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
.psl{font-size:11px;color:var(--text-muted);margin-top:3px}

/* PATENT CHECKER */
.patent-wrap{max-width:700px;margin:0 auto;padding:32px 5% 60px}
.pat-result{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--rl);padding:24px;margin-top:20px}
.pat-status{display:flex;align-items:center;gap:10px;padding:14px;border-radius:10px;margin-bottom:16px;font-size:14px;font-weight:500}
.pat-clear{background:rgba(80,200,120,.1);border:1px solid rgba(80,200,120,.3);color:var(--green)}
.pat-found{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:var(--red)}
.pat-warn{background:rgba(201,168,76,.1);border:1px solid var(--border);color:var(--gold)}
.pat-item{padding:10px 0;border-bottom:1px solid var(--bl)}
.pat-item:last-child{border-bottom:none}
.pat-item h4{font-size:13px;font-weight:600;margin-bottom:3px}
.pat-item p{font-size:12px;color:var(--text-muted)}
.pat-num{font-size:11px;color:var(--blue);background:rgba(123,167,255,.1);border:1px solid rgba(123,167,255,.2);padding:2px 8px;border-radius:4px;display:inline-block;margin-top:4px}
.typing-dot{display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;animation:td 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.vid-stage{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--dark);height:320px}
.vid-tile{background:var(--dark3);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.vid-tile.main{background:linear-gradient(135deg,#1A2A1A,#0D1A0D)}
.vid-tile.self{background:linear-gradient(135deg,#1A1A2A,#0D0D1A)}
.cam-off{display:flex;flex-direction:column;align-items:center;gap:8px}
.cam-off p{font-size:11px;color:var(--text-muted)}
.vid-name{position:absolute;bottom:8px;left:8px;font-size:11px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:4px}
.vid-controls{background:var(--dark3);padding:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.vc-btn{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:.2s}
.vc-btn:hover{transform:scale(1.05)}
.vc-mic{background:rgba(80,200,120,.15);color:var(--green)}
.vc-mic.off{background:rgba(255,107,107,.15);color:var(--red)}
.vc-cam{background:rgba(123,167,255,.15);color:var(--blue)}
.vc-cam.off{background:rgba(255,107,107,.15);color:var(--red)}
.vc-end{background:rgba(255,107,107,.15);color:var(--red);width:48px;height:48px}
.vc-chat{background:rgba(201,168,76,.1);color:var(--gold)}
.chat-box{height:200px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--dark4)}
.chat-msg{max-width:70%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5}
.chat-msg.me{background:rgba(201,168,76,.15);align-self:flex-end;border-bottom-right-radius:3px}
.chat-msg.them{background:var(--dark3);align-self:flex-start;border-bottom-left-radius:3px}
.chat-name{font-size:10px;color:var(--text-muted);margin-bottom:2px}
.chat-in{display:flex;gap:8px;padding:10px;background:var(--dark3);border-top:1px solid var(--bl)}
.chat-in input{background:var(--dark4);border:1px solid var(--bl);flex:1;font-size:12px;padding:7px 12px;border-radius:7px}

/* ESCROW */
.escrow-steps{display:flex;flex-direction:column;gap:0}
.es-step{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--bl)}
.es-step:last-child{border-bottom:none}
.es-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;margin-top:2px}
.es-active{background:rgba(201,168,76,.2);border:1px solid var(--border);color:var(--gold)}
.es-done{background:rgba(80,200,120,.2);border:1px solid rgba(80,200,120,.3);color:var(--green)}
.es-wait{background:var(--dark4);border:1px solid var(--bl);color:var(--text-dim)}
.es-info h4{font-size:13px;font-weight:600;margin-bottom:3px}
.es-info p{font-size:12px;color:var(--text-muted)}
.escrow-amount{font-family:'Playfair Display',serif;font-size:36px;color:var(--gold);text-align:center;margin:20px 0}
.escrow-note{font-size:12px;color:var(--text-muted);text-align:center;line-height:1.6}

/* NOTIFICATIONS */
.notif-list{display:flex;flex-direction:column;gap:0}
.notif{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--bl);cursor:pointer;transition:.2s}
.notif:hover{opacity:.8}
.notif:last-child{border-bottom:none}
.n-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.n-text{font-size:13px;line-height:1.5}
.n-time{font-size:10px;color:var(--text-dim);margin-top:2px}
.n-dot{width:7px;height:7px;background:var(--gold);border-radius:50%;flex-shrink:0;margin-top:6px}

/* MESSAGES */
.msg-wrap{display:grid;grid-template-columns:240px 1fr;gap:0;height:calc(100vh - 64px - 64px);min-height:400px}
.msg-list{border-right:1px solid var(--bl);overflow-y:auto}
.msg-item{display:flex;gap:10px;padding:12px 14px;cursor:pointer;transition:.2s;border-bottom:1px solid var(--bl)}
.msg-item:hover,.msg-item.act{background:rgba(201,168,76,.06)}
.msg-name{font-size:13px;font-weight:500;margin-bottom:2px}
.msg-prev{font-size:11px;color:var(--text-muted)}
.msg-time{font-size:10px;color:var(--text-dim);margin-left:auto;flex-shrink:0}
.msg-chat{display:flex;flex-direction:column}

.msg-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.15)}
.bubble{max-width:65%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.55}
.b-me{background:rgba(201,168,76,.15);align-self:flex-end;border-bottom-right-radius:3px}
.b-them{background:var(--dark3);align-self:flex-start;border-bottom-left-radius:3px}

.about-wrap{max-width:860px;margin:0 auto;padding:40px 5% 80px}

/* PAYMENT */
.pay-wrap{max-width:560px;margin:0 auto;padding:32px 5% 60px}

.card-num{display:flex;gap:8px}
.card-num input{flex:1;letter-spacing:2px;font-size:15px}
.pay-method{display:flex;gap:8px;margin-bottom:16px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--dark3);border:1px solid var(--border);padding:12px 18px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideUp .25s ease;min-width:240px;max-width:340px}
.toast-s{border-color:rgba(80,200,120,.5);color:var(--green)}
.toast-e{border-color:rgba(255,107,107,.5);color:var(--red)}
.toast-i{border-color:var(--border);color:var(--gold)}

/* PROGRESS */
.prog-bar{height:4px;background:var(--dark4);border-radius:2px;margin-bottom:24px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:2px;transition:width .4s ease}

/* IDEA DETAIL */
.idea-detail{max-width:820px;margin:0 auto;padding:32px 5% 60px}
.id-hd{background:var(--dark3);border:1px solid var(--bl);border-radius:var(--rl);padding:28px;margin-bottom:20px}
.id-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.id-ico{width:56px;height:56px;border-radius:12px;background:rgba(201,168,76,.1);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.id-tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.id-desc{font-size:14px;color:var(--text-muted);line-height:1.8}
.id-creator{display:flex;align-items:center;gap:12px;padding:16px;background:var(--dark4);border-radius:10px;border:1px solid var(--bl)}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--text-muted);font-size:13px}
.spin{width:28px;height:28px;border:2px solid var(--bl);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{display:none}
  .dash-main{padding:20px}
  .frow{grid-template-columns:1fr}
  .msg-wrap{grid-template-columns:1fr}
  .msg-list{display:none}
  .vid-stage{grid-template-columns:1fr}
  .mission-grid{grid-template-columns:1fr}
  .ab-block{flex-direction:column;gap:12px}
  .steps-row::before{display:none}
  .eng-grid{grid-template-columns:1fr 1fr}
}

/* AI TYPING */
.ai-typing{display:inline-flex;gap:4px;align-items:center;padding:4px 0}

/* STARS RATING */
.star-select{display:flex;gap:4px;font-size:22px;cursor:pointer}
.star-select span{color:var(--text-dim);transition:.15s}
.star-select span.lit{color:var(--gold)}

const { useState, useEffect, useRef, useCallback } = React;

// ─── BACKEND SIMULATION (in-memory store) ───────────────────────────────────
// ─── API LAYER — talks to your backend at localhost:3000 ─────────────────────
const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://ideahub-production-1b18.up.railway.app';

const api = {
  // get stored token
  token: () => localStorage.getItem('ih_token'),

  // base fetch wrapper
  async req(method, path, body) {
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json' },
    };
    if (api.token()) opts.headers['Authorization'] = 'Bearer ' + api.token();
    if (body) opts.body = JSON.stringify(body);
    try {
      const res = await fetch(API_URL + path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    } catch (e) {
      // if backend is offline, fall back to local DB silently
      console.warn('API offline, using local data:', e.message);
      return null;
    }
  },

  get:    (path)        => api.req('GET',    path),
  post:   (path, body)  => api.req('POST',   path, body),
  put:    (path, body)  => api.req('PUT',    path, body),
  delete: (path)        => api.req('DELETE', path),

  // AUTH
  async signup(form) {
    const data = await api.post('/api/auth/signup', form);
    if (data?.token) localStorage.setItem('ih_token', data.token);
    return data;
  },
  async login(email, password) {
    const data = await api.post('/api/auth/login', { email, password });
    if (data?.token) localStorage.setItem('ih_token', data.token);
    return data;
  },
  logout() { localStorage.removeItem('ih_token'); },
  getMe()  { return api.get('/api/auth/me'); },
  updateMe(form) { return api.put('/api/auth/me', form); },

  // IDEAS
  getIdeas(params = {}) {
    const q = new URLSearchParams(params).toString();
    return api.get('/api/ideas' + (q ? '?' + q : ''));
  },
  getIdea(id)    { return api.get('/api/ideas/' + id); },
  postIdea(form) { return api.post('/api/ideas', form); },
  myIdeas()      { return api.get('/api/my-ideas'); },

  // TRANSACTIONS
  createTransaction(ideaId, paymentMethod) { return api.post('/api/transactions', { ideaId, paymentMethod }); },
  confirmDelivery(txId) { return api.put('/api/transactions/' + txId + '/confirm'); },
  myTransactions() { return api.get('/api/transactions'); },

  // MESSAGES
  getMessages()          { return api.get('/api/messages'); },
  sendMessage(toId, text, ideaId) { return api.post('/api/messages', { toId, text, ideaId }); },

  // PATENTS
  applyPatent(form) { return api.post('/api/patents', form); },
  myPatents()       { return api.get('/api/patents'); },

  // DASHBOARD
  dashboard() { return api.get('/api/dashboard'); },
};

const DB = {
  users: [
    { id:1, firstName:'John', lastName:'Doe', email:'john@demo.com', password:'demo', role:'idea_creator', initials:'JD', country:'Sri Lanka', city:'Colombo', bio:'Passionate innovator with 8+ years in tech and sustainable agriculture.', specializations:['Technology & Engineering','Healthcare & wellness'], qual:'Master\'s Degree', stars:4, ideas:[], earnings:3400, verified:true, patentHolder:true }
  ],
  ideas: [
    { id:1, title:'AI-Powered Crop Disease Scanner', creator:'Priya M.', creatorId:99, industry:'Technology & Engineering', ideaType:'New Technology', summary:'A mobile app using computer vision to detect plant diseases in real-time.', desc:'Using transfer learning on a dataset of 58,000 plant images, this app identifies 38 classes of diseases with 96% accuracy — even offline, using a compressed on-device model.', price:4500, level:2, icon:'🌾', status:'live', views:1240, inquiries:8, visibility:2 },
    { id:2, title:'Micro-Lending via Blockchain', creator:'Carlos R.', creatorId:98, industry:'Business & Finance', ideaType:'New Business Idea', summary:'Blockchain-based micro-lending connecting SMEs in emerging markets with global investors.', desc:'A permissioned blockchain (Hyperledger Fabric) tracks all loan agreements, repayments, and investor returns in real-time. Smart contracts automatically enforce terms and release funds.', price:12000, level:3, icon:'💳', status:'live', views:3400, inquiries:21, visibility:2 },

    { id:4, title:'Hyper-Local Freelance App', creator:'Jake T.', creatorId:96, industry:'Social media, Internet and Digital Services', ideaType:'New Business Idea', summary:'Neighborhood-based platform connecting residents with local service providers.', desc:'Unlike global freelance platforms, this app uses geofencing to limit listings to a 5km radius, enabling same-day services and cash payments. Includes community ratings and background checks.', price:2800, level:1, icon:'📱', status:'live', views:870, inquiries:5, visibility:1 },
    { id:5, title:'AI Nutritionist for Budget Meals', creator:'Nina L.', creatorId:95, industry:'Healthcare & wellness', ideaType:'New Technology', summary:'App generating nutritious meal plans within a budget.', desc:'Integrates with local grocery store APIs to provide real-time pricing and availability. Uses a GAN-trained model to suggest culturally relevant meals within a user-defined weekly budget.', price:3300, level:2, icon:'🥗', status:'live', views:1560, inquiries:9, visibility:2 },
    { id:6, title:'Restaurant Food-Waste Exchange', creator:'Tom H.', creatorId:94, industry:'Food & Culinary', ideaType:'New Business Idea', summary:'B2B platform for restaurants to sell surplus ingredients before closing.', desc:'A 2-hour-window marketplace where restaurants list surplus ingredients at 70% discount. Uses AI to predict what will be surplus by 8pm each night based on booking data.', price:5100, level:2, icon:'🍽️', status:'live', views:1980, inquiries:12, visibility:2 },

    { id:'IH-2024-0041', title:'Vertical Farm IoT Monitoring System', status:'Under Examination', filed:'2024-03-12', number:'PCT/LK2024/000041' },

// ─── GLOBAL STATE / CONTEXT ──────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = useState('home');
  const [user, setUser] = useState(null);
  const [modal, setModal] = useState(null); // {type, data}
  const [toasts, setToasts] = useState([]);
  const [ideas, setIdeas] = useState(DB.ideas);
  const [selectedIdea, setSelectedIdea] = useState(null);
  const [notifOpen, setNotifOpen] = useState(false);

  const nav = (p) => { setPage(p); setNotifOpen(false); window.scrollTo(0,0); };

  const toast = (msg, type='i') => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  };

  const login = (u) => {
    setUser(u);
    setModal(null);
    toast('Welcome back, ' + u.firstName + '! 👋', 's');
    setTimeout(() => nav('dashboard'), 400);
  };

  const logout = () => {
    setUser(null);
    nav('home');
    toast('Logged out successfully.', 'i');
  };

  const openIdea = (idea) => {
    setSelectedIdea(idea);
    nav('idea-detail');
  };

  const unreadCount = DB.notifications.filter(n => !n.read).length;

  return (
    <div>
      {/* NAV */}
      <nav>
        <div className="n-logo" onClick={() => nav('home')}>IdeaHub</div>

        </div>
      </nav>

      {/* NOTIFICATIONS DROPDOWN */}
      {notifOpen && (
        <div style={{position:'fixed',top:64,right:16,z:950,background:'var(--dark2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'0 0 8px',width:340,maxHeight:420,overflowY:'auto',zIndex:950,boxShadow:'0 8px 32px rgba(0,0,0,.5)'}}>
          <div style={{padding:'14px 16px',borderBottom:'1px solid var(--bl)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:14,fontWeight:600}}>Notifications</span>
            <button className="btn-ghost" style={{fontSize:11}} onClick={() => {DB.notifications.forEach(n=>n.read=true);setNotifOpen(false);}}>Mark all read</button>
          </div>
          <div className="notif-list" style={{padding:'0 8px'}}>
            {DB.notifications.map(n => (
              <div key={n.id} className="notif" style={{padding:'12px 8px'}}>
                <div className="n-ico" style={{background:n.read?'var(--dark4)':'rgba(201,168,76,.1)'}}>{n.icon}</div>
                <div style={{flex:1}}>
                  <div className="n-text" style={{color:n.read?'var(--text-muted)':'var(--text)'}}>{n.text}</div>
                  <div className="n-time">{n.time}</div>
                </div>
                {!n.read && <div className="n-dot"></div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* PAGE ROUTER */}
      {page === 'home' && <HomePage nav={nav} user={user} setModal={setModal} toast={toast} ideas={ideas} openIdea={openIdea} />}
      {page === 'explore' && <ExplorePage ideas={ideas} nav={nav} openIdea={openIdea} />}
      {page === 'idea-detail' && selectedIdea && <IdeaDetailPage idea={selectedIdea} user={user} nav={nav} setModal={setModal} toast={toast} />}
      {page === 'dashboard' && user && <DashboardPage user={user} nav={nav} ideas={ideas} toast={toast} setModal={setModal} />}
      {page === 'post' && user && <PostIdeaPage user={user} nav={nav} toast={toast} ideas={ideas} setIdeas={setIdeas} />}
      {page === 'profile' && user && <ProfilePage user={user} setUser={setUser} nav={nav} toast={toast} />}
      {page === 'patent' && <PatentPage user={user} nav={nav} toast={toast} setModal={setModal} />}
      {page === 'messages' && user && <MessagesPage user={user} nav={nav} />}
      {page === 'about' && <AboutPage nav={nav} setModal={setModal} />}
      {page === 'payment' && <PaymentPage user={user} nav={nav} toast={toast} selectedIdea={selectedIdea} />}
      {page === 'video' && <VideoConfPage nav={nav} selectedIdea={selectedIdea} />}

      {/* MODALS */}
      {modal && (
        <div className="ov open" onClick={e => e.target.classList.contains('ov') && setModal(null)}>
          <div className={`modal ${modal.type==='video-setup'?'modal-lg':''}`}>
            <button className="mc" onClick={() => setModal(null)}>✕</button>
            {modal.type === 'login' && <AuthModal type="login" login={login} setModal={setModal} toast={toast} />}
            {modal.type === 'signup' && <AuthModal type="signup" login={login} setModal={setModal} toast={toast} role={modal.role} />}
            {modal.type === 'escrow' && <EscrowModal idea={modal.idea} user={user} nav={nav} setModal={setModal} toast={toast} />}
            {modal.type === 'patent-apply' && <PatentApplyModal idea={modal.idea} setModal={setModal} toast={toast} />}
          </div>
        </div>
      )}

      {/* TOASTS */}
      <div style={{position:'fixed',bottom:24,right:24,zIndex:9999,display:'flex',flexDirection:'column',gap:8}}>
        {toasts.map(t => (
          <div key={t.id} className={`toast toast-${t.type}`}>
            <span>{t.type==='s'?'✓':t.type==='e'?'✕':'◆'}</span>
            {t.msg}
          </div>
        ))}
      </div>
    </div>
  );
};

const AuthModal = ({ type, login, setModal, toast, role }) => {
  const [mode, setMode] = useState(type);

  const [form, setForm] = useState({ firstName:'', lastName:'', email:'', password:'', role: role||'idea_creator' });
  const roleLabels = { idea_creator:'💡 Idea Creator', investor:'💼 Investor', virtual_manager:'🤝 Virtual Manager', patent_attorney:'⚖️ Patent Attorney', patent_seller:'📜 Patent Seller', corporate_service:'🏢 Corporate Services' };
  const roles = Object.entries(roleLabels);

  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  const doLogin = async () => {
    setLoading(true);
    const data = await api.login(form.email, form.password);
    if (data && data.user) {
      const u = { ...data.user, initials: ((data.user.firstName||'?')[0] + (data.user.lastName||'?')[0]).toUpperCase() };
      login(u);
    } else {
      const u = DB.users.find(u => u.email === form.email);
      if (u) { login({...u, initials:(u.firstName[0]+(u.lastName||'')[0]||'X').toUpperCase()}); }
      else { toast('Invalid email or password', 'e'); setLoading(false); }
    }
  };

  const doSignup = async () => {
    if (!form.firstName || !form.email || !form.password) { toast('Please fill in all required fields', 'e'); return; }
    setLoading(true);
    const data = await api.signup(form);
    if (data && data.user) {
      const u = { ...data.user, initials: ((data.user.firstName||'?')[0] + (data.user.lastName||'?')[0]).toUpperCase() };
      login(u);
      toast('Account created! Welcome to IdeaHub!', 's');
    } else {
      const u = { id: Date.now(), firstName: form.firstName, lastName: form.lastName, email: form.email, role: form.role, initials: (form.firstName[0]+(form.lastName||'')[0]||'X').toUpperCase(), country:'', city:'', bio:'', specializations:[], earnings:0, verified:false };
      login(u);
      toast('Account created! Welcome to IdeaHub!', 's');
    }
  };

    setLoading(true);
    const fakeForm = { firstName:'Alex', lastName:'Johnson', email:'alex.' + provider.toLowerCase() + '.' + Date.now() + '@demo.com', password:'social123', role: form.role||'idea_creator' };
    const data = await api.signup(fakeForm);
    const u = (data && data.user)
      ? { ...data.user, initials:'AJ' }
      : { id: Date.now(), firstName:'Alex', lastName:'Johnson', email: fakeForm.email, role: fakeForm.role, initials:'AJ', country:'', city:'', bio:'', verified:true };
    login(u);
  };

              Continue with Google
            </button>
            <button className="s-btn" onClick={() => doSocial('Facebook')}>
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>

const PostIdeaPage = ({ user, nav, toast, ideas, setIdeas }) => {
  const [step, setStep] = useState(1);
  const totalSteps = 5;
  const [form, setForm] = useState({ title:'', newThing:'', desc:'', industry:'', ideaType:'New Business Idea', visibility:1, level:1, engLevel:0, price:'', hasPatent:false, patentNumber:'' });
  const [loading, setLoading] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const industries = ['Business & Finance','Technology & Engineering','Creative & Design','Writing & Content','Marketing & Sales','Music & Art','Education and Training','Personal & Lifestyle','Food & Culinary','Healthcare & wellness','Personal Service','Skilled Trades and Technical','Automobile & Transport','Groceries & Essentials','Home, Real Estate & Construction','Travel & Hospitality','Printing & Publications','E-commerce, Retail & Trade','Pets and Animal Care','Social media, Internet and Digital Services','Logistics, Shipping and Supply Chain','Scientists and Researching','NGO & Social Work','Consultation','Other Services'];
  const ideaTypes = ['New Business Idea','New Technology','Improvement of Existing Product','New Technique / Process','Life Hack'];
  const engLevels = [['Describe in Video Call','Lowest pay grade'],['Physical Meeting','Low-mid pay grade'],['Prototype Sale','Mid pay grade'],['Manufacture & Supply','High pay grade'],['Support Until Product Launch','Very high pay grade'],['Full Partnership','Partnership / Equity']];
  const visOpts = [['Level 1 — Title & Summary only','Protects highly sensitive ideas. Investors see concept and industry only.'],['Level 2 — Partial Description','Reveal enough to attract genuine interest without exposing the core innovation.'],['Level 3 — Full Disclosure','Ideal for life hacks, open-concept ideas, or fully patented work.']];

  const submit = async () => {
    if (!form.title || !form.industry || !form.price) { toast('Please fill in all required fields', 'e'); return; }
    setLoading(true);
    const payload = { title: form.title, summary: form.newThing, desc: form.desc, industry: form.industry, ideaType: form.ideaType, price: parseFloat(form.price)||0, level: form.level, visibility: form.visibility, engLevel: form.engLevel, hasPatent: form.hasPatent, patentNumber: form.patentNumber };
    const data = await api.postIdea(payload);
    if (data && data.id) {
      setIdeas(prev => [data, ...prev]);
      toast('Idea posted successfully!', 's');
    } else {
      toast('Idea submitted!', 's');
    }
    setLoading(false);
    setTimeout(() => nav('dashboard'), 800);
  };

  return (
    <div className="page">
      <div className="post-wrap">
        <button className="btn-ghost" style={{marginBottom:16,fontSize:12}} onClick={() => nav('dashboard')}>← Back to Dashboard</button>
        <div className="sec-lbl">New Listing</div>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:'clamp(26px,4vw,36px)',marginBottom:6}}>Post Your Idea</h1>
        <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:24}}>Fill in the details to list your idea on the marketplace.</p>

        <div className="prog-bar"><div className="prog-fill" style={{width:`${(step/totalSteps)*100}%`}}></div></div>
        <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:20}}>Step {step} of {totalSteps}</div>

        {/* STEP 1: BASICS */}
        {step === 1 && (
          <div className="fsec">
            <h3>💡 Idea Basics</h3>
            <div className="fg"><label>Idea Title *</label><input placeholder="Give your idea a clear, catchy title" value={form.title} onChange={e=>set('title',e.target.value)} /></div>
            <div className="fg"><label>What's new about it? *</label><textarea placeholder="In 1–2 paragraphs, describe what makes this idea unique or novel…" value={form.newThing} onChange={e=>set('newThing',e.target.value)} /></div>
            <div className="fg"><label>Full Description *</label><textarea style={{minHeight:120}} placeholder="Detailed explanation: how it works, the problem it solves, market opportunity…" value={form.desc} onChange={e=>set('desc',e.target.value)} /></div>
            <div className="frow">
              <div className="fg"><label>Industry *</label><select value={form.industry} onChange={e=>set('industry',e.target.value)}><option value="">Select Industry</option>{industries.map(i=><option key={i}>{i}</option>)}</select></div>
              <div className="fg"><label>Idea Type</label><select value={form.ideaType} onChange={e=>set('ideaType',e.target.value)}>{ideaTypes.map(t=><option key={t}>{t}</option>)}</select></div>
            </div>
          </div>
        )}

        {/* STEP 2: VISIBILITY & RANK */}
        {step === 2 && (
          <>
            <div className="fsec">
              <h3>🔒 Confidentiality Level</h3>
              <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:14}}>How much of your idea should non-buyers see?</p>
              <div className="vis-opts">
                {visOpts.map(([t,d],i) => (
                  <div key={i} className={'vo'+(form.visibility===i+1?' sel':'')} onClick={() => set('visibility',i+1)}>
                    <input type="radio" readOnly checked={form.visibility===i+1} style={{accentColor:'var(--gold)',marginTop:2}} />
                    <div><div className="vt">{t}</div><div className="vd">{d}</div></div>
                  </div>
                ))}
              </div>
            </div>
            <div className="fsec">
              <h3>⭐ Idea Rank</h3>
              <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:14}}>Rank 3 is the highest complexity and impact. Higher ranks attract more serious investors.</p>
              <div className="lvl-sel">
                {[['1','Concept Stage'],['2','Developed Idea'],['3','Critical Innovation']].map(([n,nm]) => (
                  <div key={n} className={'lo'+(form.level===parseInt(n)?' sel':'')} onClick={() => set('level',parseInt(n))}>
                    <div className="ln">{n}</div><div className="lname">{nm}</div>
                  </div>
                ))}
              </div>
            </div>
          </>
        )}

        {/* STEP 3: MEDIA */}
        {step === 3 && (
          <div className="fsec">
            <h3>📁 Supporting Material</h3>
            <div className="upload-box" onClick={() => toast('File upload ready — connect storage backend to enable','i')}>
              <div style={{fontSize:32,marginBottom:10}}>📎</div>
              <p style={{fontSize:13,color:'var(--text-muted)'}}>Drag & drop files or click to upload</p>
              <span style={{fontSize:11,color:'var(--text-dim)'}}>Photos, prototypes, documents, videos (max 50MB each)</span>
            </div>
            <div style={{marginTop:16}}>
              <div className="fg"><label>Prototype or Product URL (optional)</label><input placeholder="https://..." /></div>
              <div className="fg"><label>Demo Video URL (optional)</label><input placeholder="https://youtube.com/..." /></div>
            </div>
            <div className="fsec" style={{marginTop:16,background:'var(--dark4)'}}>
              <h3>📜 Patent Status</h3>
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px',borderRadius:10,border:'1px solid var(--bl)',cursor:'pointer',background:'var(--dark3)'}} onClick={() => set('hasPatent',!form.hasPatent)}>
                <input type="checkbox" readOnly checked={form.hasPatent} style={{accentColor:'var(--gold)',width:16,height:16}} />
                <label style={{cursor:'pointer',margin:0,color:'var(--text)',fontSize:13}}>I have a patent license to sell with this idea</label>
              </div>
              {form.hasPatent && (
                <div style={{marginTop:12}}>
                  <div className="fg"><label>Patent Number</label><input placeholder="e.g. US10,234,567 B2" value={form.patentNumber} onChange={e=>set('patentNumber',e.target.value)} /></div>
                  <div style={{fontSize:11,color:'var(--gold)',background:'rgba(201,168,76,.06)',border:'1px solid var(--border)',borderRadius:8,padding:10,marginTop:6}}>📋 Patent ownership will be verified manually. Upload proof of ownership documents.</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* STEP 4: ENGAGEMENT */}
        {step === 4 && (
          <div className="fsec">
            <h3>🤝 Engagement Level</h3>
            <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:14}}>How involved are you willing to be post-sale? Higher levels command higher prices.</p>
            <div className="eng-grid">
              {engLevels.map(([t,p],i) => (
                <div key={i} className={'eo'+(form.engLevel===i?' sel':'')} onClick={() => set('engLevel',i)}>
                  <div className="et">{t}</div><div className="ep">{p}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* STEP 5: PRICING */}
        {step === 5 && (
          <div className="fsec">
            <h3>💰 Asking Price</h3>
            <div className="price-row">
              <span className="price-pre">$</span>
              <input className="price-in" type="number" placeholder="0.00" min="0" value={form.price} onChange={e=>set('price',e.target.value)} style={{fontSize:22,fontFamily:"'Playfair Display',serif",fontWeight:700}} />
            </div>
            <p style={{fontSize:11,color:'var(--text-dim)',marginTop:10}}>Platform fee: 8% of sale price. Funds held in escrow until delivery confirmed.</p>
            <div style={{marginTop:24,background:'var(--dark4)',borderRadius:'var(--r)',padding:16}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>📋 Review Summary</div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {[['Title', form.title||'(not set)'],['Industry', form.industry||'(not set)'],['Type', form.ideaType],['Rank', 'Level '+form.level],['Confidentiality', 'Level '+form.visibility],['Engagement', engLevels[form.engLevel]?.[0]||'(not set)'],['Patent', form.hasPatent?'Yes — '+form.patentNumber:'No']].map(([k,v]) => (
                  <div key={k} style={{display:'flex',gap:8,fontSize:12}}><span style={{color:'var(--text-muted)',minWidth:110}}>{k}</span><span>{v}</span></div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* NAV BUTTONS */}
        <div style={{display:'flex',gap:10,marginTop:4}}>
          {step > 1 && <button className="btn-o" onClick={() => setStep(s=>s-1)}>← Back</button>}
          {step < totalSteps ? (
            <button className="btn-p" onClick={() => setStep(s=>s+1)}>Continue →</button>
          ) : (
            <button className="btn-p" onClick={submit} disabled={loading}>{loading?'Submitting…':'Submit Idea for Review →'}</button>
          )}
        </div>
      </div>
    </div>
  );
};

// ─── AI PATENT CHECKER ────────────────────────────────────────────────────────
const PatentPage = ({ user, nav, toast, setModal }) => {
  const [query, setQuery] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [applyIdea, setApplyIdea] = useState('');

  const checkPatent = async () => {
    if (!query.trim()) { toast('Please enter your idea to check','e'); return; }
    setLoading(true);
    setResult(null);
    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: `You are a patent research assistant for IdeaHub, a marketplace platform. A user wants to check if their idea is novel and patentable.

Idea submitted: "${query}"

Respond ONLY with a JSON object (no markdown, no explanation outside JSON) in this exact format:
{
  "status": "clear" | "similar_found" | "likely_patented",
  "summary": "2-3 sentence plain-English verdict",
  "noveltyScore": 0-100,
  "similarPatents": [
    { "number": "US patent number", "title": "patent title", "year": "year", "similarity": "low|medium|high", "note": "brief note" }
  ],
  "recommendation": "one clear recommendation for the inventor",
  "canApply": true | false
}`
          }]
        })
      });
      const data = await response.json();
      const text = data.content?.[0]?.text || '{}';
      const clean = text.replace(/```json|```/g,'').trim();
      setResult(JSON.parse(clean));
    } catch(e) {
      // fallback mock
      setResult({
        status: query.length > 20 ? 'similar_found' : 'clear',
        summary: query.length > 20
          ? 'Your idea has some similarities to existing patents in this space, but the specific combination of elements you describe may still be patentable with the right claims strategy.'
          : 'Your idea appears to be novel based on our initial search. No directly conflicting patents were found in the major patent databases.',
        noveltyScore: query.length > 20 ? 62 : 88,
        similarPatents: query.length > 20 ? [
          { number:'US10,234,567', title:'Method for automated agricultural monitoring using machine learning', year:'2021', similarity:'medium', note:'Covers ML-based crop monitoring but not real-time disease detection via mobile.' },
          { number:'EP3456789', title:'System for plant pathology detection using neural networks', year:'2022', similarity:'low', note:'European patent covering laboratory-grade detection, not field-deployable mobile apps.' }
        ] : [],
        recommendation: query.length > 20
          ? 'Consider filing a provisional patent application to establish a priority date while you refine your claims.'
          : 'Your idea appears patentable. We recommend filing a provisional application immediately to establish a priority date.',
        canApply: true
      });
    }
    setLoading(false);
  };

  const statusStyle = { clear:'pat-clear', similar_found:'pat-warn', likely_patented:'pat-found' };
  const statusIcon = { clear:'✅', similar_found:'⚠️', likely_patented:'❌' };
  const statusText = { clear:'Likely Novel — No direct conflicts found', similar_found:'Similar Patents Exist — Review recommended', likely_patented:'Likely Already Patented' };

  return (
    <div className="page">
      <div className="patent-wrap">
        <div className="sec-lbl">Intellectual Property</div>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:'clamp(26px,4vw,38px)',marginBottom:8}}>AI Patent Checker</h1>
        <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:28,lineHeight:1.7}}>Describe your idea and our AI will cross-reference global patent databases to check novelty before you list on IdeaHub.</p>

        <div className="panel">
          <h3 style={{marginBottom:14}}>Describe Your Idea</h3>
          <div className="fg">
            <label>What is your idea? (Be as specific as possible)</label>
            <textarea style={{minHeight:120}} placeholder="E.g.: A mobile application that uses computer vision to detect plant diseases in real-time by analyzing photos taken by farmers using their smartphone cameras, providing instant diagnosis and treatment recommendations even without internet connectivity…" value={query} onChange={e=>setQuery(e.target.value)} />
          </div>
          <button className="btn-p" onClick={checkPatent} disabled={loading}>
            {loading ? <><span className="spin" style={{width:16,height:16,marginRight:6}}></span>Checking patents…</> : '🔍 Check Patent Novelty →'}
          </button>
        </div>

        {result && (
          <div className="pat-result">
            <div className={`pat-status ${statusStyle[result.status]}`}>
              <span style={{fontSize:20}}>{statusIcon[result.status]}</span>
              <span>{statusText[result.status]}</span>
            </div>

            <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:18}}>
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:4}}>Novelty Score</div>
                <div style={{background:'var(--dark4)',borderRadius:4,height:8,overflow:'hidden'}}>
                  <div style={{height:'100%',background:result.noveltyScore>70?'var(--green)':result.noveltyScore>45?'var(--gold)':'var(--red)',width:result.noveltyScore+'%',transition:'width .6s ease'}}></div>
                </div>

              <div style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:700,color:result.noveltyScore>70?'var(--green)':result.noveltyScore>45?'var(--gold)':'var(--red)'}}>{result.noveltyScore}/100</div>
            </div>

            <p style={{fontSize:13,color:'var(--text-muted)',lineHeight:1.7,marginBottom:16}}>{result.summary}</p>

                {result.similarPatents.map((p,i) => (
                  <div key={i} className="pat-item">
                    <h4>{p.title}</h4>
                    <p>{p.note}</p>
                    <span className="pat-num">{p.number} ({p.year})</span>

        {/* MY PATENTS */}

          <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:16}}>Total to pay: <strong style={{color:'var(--gold)'}}>${total.toLocaleString()}</strong></div>
          <div className="pay-method">
            {[['card','💳 Card'],['paypal','🅿 PayPal'],['crypto','₿ Crypto']].map(([m,l]) => (
              <div key={m} className={'pm'+(payMethod===m?' sel':'')} onClick={() => setPayMethod(m)}>{l}</div>
            ))}
          </div>
          {payMethod === 'card' && (
            <>
              <div className="fg"><label>Card Number</label><input placeholder="1234 5678 9012 3456" maxLength={19} /></div>
              <div className="frow">
                <div className="fg"><label>Expiry</label><input placeholder="MM / YY" /></div>
                <div className="fg"><label>CVV</label><input placeholder="•••" type="password" maxLength={4} /></div>
              </div>
              <div className="fg"><label>Name on Card</label><input placeholder="John Doe" /></div>
            </>
          )}
          {payMethod === 'paypal' && <div style={{textAlign:'center',padding:24,color:'var(--text-muted)',fontSize:13}}>You will be redirected to PayPal to complete the payment.</div>}
          {payMethod === 'crypto' && (
            <div style={{background:'var(--dark4)',borderRadius:'var(--r)',padding:14,fontSize:12,color:'var(--text-muted)'}}>
              <div style={{fontWeight:600,color:'var(--text)',marginBottom:4}}>Send exactly ${total.toLocaleString()} USDT to:</div>
              <div style={{fontFamily:'monospace',fontSize:11,color:'var(--blue)',wordBreak:'break-all'}}>0x742d35Cc6634C0532925a3b8D4C9B5Ef6aB4c1234</div>
            </div>
          )}
          <div style={{display:'flex',gap:10,marginTop:16}}>
            <button className="btn-o btn-sm" onClick={() => setStep(1)}>← Back</button>
            <button className="btn-p btn-full" onClick={confirm}>Pay ${total.toLocaleString()} & Lock in Escrow →</button>
          </div>
        </>
      )}

      {step === 3 && (
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <div style={{fontSize:48,marginBottom:16}}>⏳</div>
          <h3 style={{marginBottom:8}}>Processing payment…</h3>
          <p style={{fontSize:13,color:'var(--text-muted)'}}>Locking ${total.toLocaleString()} in escrow. This takes just a moment.</p>
          <div style={{marginTop:20}}><span className="spin" style={{display:'inline-block'}}></span></div>
        </div>
      )}
    </>
  );
};

// ─── PATENT APPLY MODAL ───────────────────────────────────────────────────────
const PatentApplyModal = ({ idea, setModal, toast }) => {
  const [submitted, setSubmitted] = useState(false);
  const submit = () => {
    setSubmitted(true);
    DB.patents.push({ id:'IH-'+Date.now(), title: idea?.title||'Your Idea', status:'Application Received', filed: new Date().toISOString().slice(0,10), number:'Pending' });
    setTimeout(() => { toast('Patent application submitted! A patent attorney will contact you within 48 hours.', 's'); setModal(null); }, 1500);
  };
  return (
    <>
      <h2>Apply for Patent</h2>
      <div className="sub">Via IdeaHub's patent attorney network</div>
      {!submitted ? (
        <>
          {idea && <div className="rtag">💡 {idea.title}</div>}
          <div className="fg"><label>Type of Application</label><select><option>Provisional Patent (12-month protection, from $299)</option><option>Utility Patent (20 years, from $1,200)</option><option>Design Patent (15 years, from $800)</option></select></div>
          <div className="fg"><label>Country / Jurisdiction</label><select><option>United States (USPTO)</option><option>European Patent Office</option><option>WIPO — International PCT</option><option>Sri Lanka (NIPO)</option></select></div>
          <div className="fg"><label>Brief Inventor Statement</label><textarea placeholder="Describe the invention in your own words. This helps the attorney draft the claims…" style={{minHeight:80}} /></div>
          <div style={{background:'rgba(201,168,76,.06)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12,marginBottom:16,fontSize:12,color:'var(--text-muted)'}}>
            📋 By submitting, you acknowledge that a partner attorney will review your application. You will be contacted within 48 hours. No payment until you approve the attorney's quote.
          </div>
          <button className="btn-p btn-full" onClick={submit}>Submit Patent Application →</button>
        </>
      ) : (
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <div style={{fontSize:40,marginBottom:12}}>📜</div>
          <h3>Submitting your application…</h3>
          <div style={{marginTop:16}}><span className="spin" style={{display:'inline-block'}}></span></div>
        </div>
      )}
    </>
  );
};

// ─── PAYMENT PAGE (standalone) ────────────────────────────────────────────────
const PaymentPage = ({ user, nav, toast, selectedIdea }) => {
  const [method, setMethod] = useState('card');
  const [done, setDone] = useState(false);
  const price = selectedIdea?.price || 0;
  const fee = Math.round(price * 0.08);

  const pay = () => {
    setDone(true);
    setTimeout(() => { toast('Payment successful! Funds in escrow.', 's'); nav('dashboard'); }, 1800);
  };

  if (!selectedIdea) return <div className="page sec"><p style={{color:'var(--text-muted)'}}>No idea selected for payment.</p></div>;

  return (
    <div className="page">
      <div className="pay-wrap">
        <button className="btn-ghost" style={{marginBottom:16,fontSize:12}} onClick={() => nav('explore')}>← Back</button>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:28,marginBottom:6}}>Secure Checkout</h1>
        <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:24}}>Your payment is protected by IdeaHub Escrow.</p>
        <div className="pay-card">
          <div style={{fontSize:13,marginBottom:16,color:'var(--text-muted)'}}>Purchasing: <strong style={{color:'var(--text)'}}>{selectedIdea.icon} {selectedIdea.title}</strong></div>
          <div className="pay-method">
            {[['card','💳 Card'],['paypal','🅿 PayPal'],['crypto','₿ Crypto']].map(([m,l]) => (
              <div key={m} className={'pm'+(method===m?' sel':'')} onClick={() => setMethod(m)}>{l}</div>
            ))}
          </div>
          {method === 'card' && (
            <>
              <div className="fg"><label>Card Number</label><input placeholder="1234 5678 9012 3456" /></div>
              <div className="frow">
                <div className="fg"><label>Expiry</label><input placeholder="MM / YY" /></div>
                <div className="fg"><label>CVV</label><input placeholder="•••" type="password" /></div>
              </div>
              <div className="fg"><label>Name on Card</label><input defaultValue={user?.firstName+' '+(user?.lastName||'')} /></div>
            </>
          )}
        </div>
        <div className="pay-card">
          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>Order Summary</div>
          {[['Idea price','$'+price.toLocaleString()],['Platform fee (8%)','$'+fee.toLocaleString()],['Escrow service','Free']].map(([k,v]) => (
            <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:5}}><span style={{color:'var(--text-muted)'}}>{k}</span><span>{v}</span></div>
          ))}
          <div style={{height:1,background:'var(--bl)',margin:'10px 0'}}></div>
          <div style={{display:'flex',justifyContent:'space-between',fontWeight:600,fontSize:15}}><span>Total</span><span style={{color:'var(--gold)'}}>${'{'+(price+fee).toLocaleString()+'}'}</span></div>
        </div>
        <button className="btn-p btn-full" onClick={pay} disabled={done}>{done?'Processing…':'Pay & Lock in Escrow →'}</button>
        <p className="escrow-note" style={{marginTop:12}}>🔒 Funds are held by IdeaHub until you confirm delivery. If the seller doesn't deliver, you receive a full refund.</p>
      </div>
    </div>
  );
};
