<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketplace — IdeaHub</title>
  <meta name="description" content="Browse thousands of ideas across technology, health, finance, and more. Filter by industry, stage, and price, and connect directly with creators on IdeaHub." />
  <link rel="canonical" href="https://ideahub.it.com/browse" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ideahub.it.com/browse" />
  <meta property="og:title" content="Marketplace — IdeaHub" />
  <meta property="og:description" content="Browse thousands of ideas across technology, health, finance, and more. Connect directly with creators on IdeaHub." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Marketplace — IdeaHub" />
  <meta name="twitter:description" content="Browse thousands of ideas across technology, health, finance, and more. Connect directly with creators on IdeaHub." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface2: #1c1c1c;
      --border: #2a2a2a; --gold: #f5c518; --gold-dim: #c49a10;
      --text: #f0f0f0; --muted: #888; --radius: 12px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    .topnav { position:sticky; top:0; z-index:100; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 32px; height:60px; display:flex; align-items:center; gap:24px; }
    .nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-size:1.15rem; font-weight:700; flex-shrink:0; }
    .nav-logo .logo-icon { width:32px; height:32px; background:var(--gold); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .nav-links { display:flex; align-items:center; gap:8px; }
    .nav-links a { color:var(--muted); text-decoration:none; font-size:0.875rem; padding:6px 14px; border-radius:6px; transition:color 0.2s; }
    .nav-links a:hover { color:var(--text); }
    .btn-join { background:var(--gold) !important; color:#000 !important; font-weight:600 !important; }
    .nav-user { display:none; align-items:center; gap:8px; }
    .nav-user.visible { display:flex; }
    .nav-avatar { width:34px; height:34px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; color:#000; overflow:hidden; cursor:pointer; text-decoration:none; }
    .nav-avatar img { width:100%; height:100%; object-fit:cover; }
    .nav-dashboard-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:6px 14px; border-radius:6px; font-size:0.875rem; text-decoration:none; transition:border-color 0.2s; }
    .nav-dashboard-btn:hover { border-color:var(--gold); }
    .btn-back-dash { background:rgba(245,197,24,0.1); border:1px solid rgba(245,197,24,0.3); color:var(--gold); padding:6px 14px; border-radius:6px; font-size:0.875rem; text-decoration:none; display:none; align-items:center; gap:6px; transition:all 0.2s; }
    .btn-back-dash:hover { background:rgba(245,197,24,0.2); }
    .btn-back-dash.visible { display:inline-flex; }

    .hero { background:linear-gradient(135deg,#0a0a0a 0%,#141008 50%,#0a0a0a 100%); border-bottom:1px solid var(--border); padding:48px 32px 32px; text-align:center; }
    .hero h1 { font-size:2.2rem; font-weight:800; margin-bottom:8px; }
    .hero h1 span { color:var(--gold); }
    .hero p { color:var(--muted); font-size:1rem; margin-bottom:24px; }
    .hero-search { max-width:600px; margin:0 auto 20px; display:flex; gap:8px; }
    .hero-search input { flex:1; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:13px 20px; color:var(--text); font-size:1rem; outline:none; transition:border-color 0.2s; }
    .hero-search input:focus { border-color:var(--gold); }
    .hero-search button { background:var(--gold); color:#000; border:none; border-radius:10px; padding:13px 24px; font-size:0.95rem; font-weight:600; cursor:pointer; }
    .hero-search button:hover { background:var(--gold-dim); }

    .cat-chips { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .chip { flex-shrink:0; background:var(--surface2); border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:6px 16px; font-size:0.85rem; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
    .chip:hover { border-color:var(--gold); color:var(--text); }
    .chip.active { background:var(--gold) !important; border-color:var(--gold) !important; color:#000 !important; font-weight:600 !important; }

    .hero-stats { display:flex; justify-content:center; gap:32px; }
    .hero-stat { color:var(--muted); font-size:0.875rem; }
    .hero-stat strong { color:var(--text); }

    .filter-bar { position:sticky; top:60px; z-index:90; background:rgba(10,10,10,0.97); border-bottom:1px solid var(--border); padding:0 32px; }
    .filter-inner { display:flex; align-items:center; gap:8px; overflow-x:auto; padding:12px 0; scrollbar-width:none; }
    .filter-inner::-webkit-scrollbar { display:none; }
    .sort-select { margin-left:auto; flex-shrink:0; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 12px; font-size:0.85rem; cursor:pointer; outline:none; }

    .main { max-width:1400px; margin:0 auto; padding:28px 32px; }
    .results-count { color:var(--muted); font-size:0.9rem; margin-bottom:20px; }
    .results-count strong { color:var(--text); }

    .ideas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
    .idea-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
    .idea-card:hover { transform:translateY(-3px); border-color:var(--gold); box-shadow:0 8px 32px rgba(245,197,24,0.08); }
    .card-banner { height:130px; width:100%; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; }
.card-banner-icon { font-size:30px; opacity:0.55; }
.card-top { padding:14px 20px 0; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .card-emoji { display:none; }
    .card-badge { font-size:0.72rem; font-weight:600; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; }
    .badge-prototype { background:rgba(139,92,246,0.15); color:#a78bfa; }
    .badge-market_ready { background:rgba(34,197,94,0.15); color:#4ade80; }
    .badge-concept { background:rgba(59,130,246,0.15); color:#60a5fa; }
    .card-body { padding:14px 20px; flex:1; }
    .card-title { font-size:1rem; font-weight:700; margin-bottom:6px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-desc { font-size:0.82rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-tags { padding:0 20px 12px; display:flex; flex-wrap:wrap; gap:6px; }
    .card-tag { background:var(--surface2); border:1px solid var(--border); color:var(--muted); font-size:0.75rem; padding:3px 10px; border-radius:20px; }
    .card-creator { padding:12px 20px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .creator-avatar { width:30px; height:30px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; color:#000; overflow:hidden; flex-shrink:0; }
    .creator-avatar img { width:100%; height:100%; object-fit:cover; }
    .creator-info { flex:1; min-width:0; }
    .creator-name { font-size:0.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .creator-tagline { font-size:0.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .creator-stars { color:var(--gold); font-size:0.7rem; }
    .card-footer { padding:12px 20px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); }
    .card-price { font-size:1.15rem; font-weight:800; color:var(--gold); }
    .card-meta { color:var(--muted); font-size:0.78rem; }
    .btn-view { background:var(--gold); color:#000; border:none; border-radius:6px; padding:7px 16px; font-size:0.82rem; font-weight:600; cursor:pointer; text-decoration:none; }
    .btn-view:hover { background:var(--gold-dim); }

    .loading { text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1; }
    .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .empty { text-align:center; padding:80px 20px; color:var(--muted); grid-column:1/-1; }
    .empty h3 { font-size:1.1rem; margin-bottom:8px; color:var(--text); }

    .pagination { display:flex; justify-content:center; gap:8px; margin-top:40px; }
    .page-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 14px; font-size:0.875rem; cursor:pointer; transition:all 0.15s; }
    .page-btn:hover, .page-btn.active { background:var(--gold); border-color:var(--gold); color:#000; font-weight:600; }
    .page-btn:disabled { opacity:0.4; cursor:not-allowed; }

    .footer { border-top:1px solid var(--border); padding:24px 32px; text-align:center; color:var(--muted); font-size:0.82rem; margin-top:40px; }
    .footer a { color:var(--gold); text-decoration:none; }

    @media (max-width:768px) {
      .topnav { padding:0 12px; gap:8px; }
      .nav-logo span { display:none; }
      .nav-links { gap:4px; }
      .nav-links a { padding:6px 10px; font-size:0.8rem; }
      .btn-back-dash { padding:6px 10px; font-size:0.8rem; }

      .hero { padding:24px 16px 20px; }
      .hero h1 { font-size:1.5rem; }
      .hero p { font-size:0.875rem; }
      .hero-search { flex-direction:column; gap:8px; }
      .hero-search input { font-size:0.95rem; padding:11px 16px; }
      .hero-search button { width:100%; padding:11px; }
      .hero-stats { gap:12px; flex-wrap:wrap; justify-content:center; }
      .hero-stat { font-size:0.8rem; }

      .cat-chips { gap:6px; justify-content:flex-start; flex-wrap:nowrap; overflow-x:auto; padding:0 16px 4px; scrollbar-width:none; }
      .cat-chips::-webkit-scrollbar { display:none; }

      .filter-bar { padding:0 12px; }
      .filter-inner { gap:6px; }

      .main { padding:16px 12px; }
      .ideas-grid { grid-template-columns:1fr; gap:14px; }

      .card-top { padding:16px 16px 0; }
      .card-body { padding:12px 16px; }
      .card-tags { padding:0 16px 10px; }
      .card-creator { padding:10px 16px; }
      .card-footer { padding:10px 16px; }
      .card-price { font-size:1.05rem; }

      .pagination { flex-wrap:wrap; gap:6px; margin-top:24px; }
      .footer { padding:20px 16px; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a href="/" class="nav-logo">
    <div class="logo-icon">💡</div>
    <span>IdeaHub</span>
  </a>
  <div class="nav-links" id="guestNav">
    <a href="/login">Sign in</a>
    <a href="/signup" class="btn-join">Join free</a>
  </div>
  <div class="nav-user" id="userNav" style="margin-left:auto;">
    <a href="#" class="btn-back-dash" id="backToDashBtn">← Dashboard</a>
    <a href="/profile" class="nav-avatar" id="navAvatar"></a>
  </div>
</nav>

<section class="hero">
  <h1>Discover <span>Ideas</span> that change everything</h1>
  <p>Browse thousands of ideas from creators around the world</p>
  <div class="hero-search">
    <input type="text" id="searchInput" placeholder="Search by title, keyword, or category…" />
    <button onclick="applyFilters()">Search</button>
  </div>
  <div class="cat-chips" id="catChips">
    <button class="chip active" data-cat="all">All</button>
    <button class="chip" data-cat="Technology">💻 Technology</button>
    <button class="chip" data-cat="Health">🏥 Health</button>
    <button class="chip" data-cat="Education">📚 Education</button>
    <button class="chip" data-cat="Finance">💰 Finance</button>
    <button class="chip" data-cat="Food">🍔 Food</button>
    <button class="chip" data-cat="E-commerce">🛒 E-commerce</button>
    <button class="chip" data-cat="Environment">🌿 Environment</button>
    <button class="chip" data-cat="Entertainment">🎮 Entertainment</button>
  </div>
  <div class="hero-stats">
    <div class="hero-stat"><strong id="statIdeas">—</strong> ideas listed</div>
    <div class="hero-stat"><strong id="statCreators">—</strong> creators</div>
    <div class="hero-stat"><strong id="statSold">—</strong> ideas sold</div>
  </div>
</section>

<div class="filter-bar">
  <div class="filter-inner">
    <button class="chip" data-level="Market Ready">Market Ready</button>
    <button class="chip" data-level="Prototype">Prototype</button>
    <button class="chip" data-level="Concept">Concept</button>
    <select class="sort-select" id="sortSelect" onchange="applyFilters()">
      <option value="newest">Newest first</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="popular">Most Viewed</option>
    </select>
  </div>
</div>

<main class="main">
  <div class="results-count" id="resultsCount">Loading ideas…</div>
  <div class="ideas-grid" id="ideasGrid">
    <div class="loading"><div class="spinner"></div><p>Loading ideas…</p></div>
  </div>
  <div class="pagination" id="pagination"></div>
</main>

<footer class="footer">
  © 2025 <a href="https://picela.co" target="_blank">Picela</a>. All rights reserved. IdeaHub is a product by <a href="https://picela.co" target="_blank">Picela</a>.
</footer>

<script>
  const API_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://ideahub.it.com';

  let allIdeas = [], filteredIdeas = [], currentPage = 1;
  const PER_PAGE = 12;
  let activeCategory = 'all', activeLevel = null;

  function initNav() {
    // Support BOTH token key formats (ih_token from sidebar pages, token from public pages)
    const token = localStorage.getItem('token') || localStorage.getItem('ih_token');
    const userRaw = localStorage.getItem('user') || localStorage.getItem('ih_user');
    const user = JSON.parse(userRaw || 'null');
    if (!token || !user) return;

    document.getElementById('guestNav').style.display = 'none';
    document.getElementById('userNav').classList.add('visible');

    const roleLinks = {
      idea_creator:'/dashboard', patent_seller:'/dashboard',
      investor:'/buyer-dashboard', corporate_services:'/buyer-dashboard',
      virtual_manager:'/support-dashboard', patent_attorney:'/support-dashboard',
      business_owner:'/business-dashboard', admin:'/admin'
    };
    const dashUrl = roleLinks[user.role] || '/dashboard';

    // ← Dashboard button (back to their specific dashboard)
    const backBtn = document.getElementById('backToDashBtn');
    backBtn.href = dashUrl;
    backBtn.classList.add('visible');

    // Avatar
    const avatarEl = document.getElementById('navAvatar');
    const avatarUrl = user.avatar_url || user.avatarUrl;
    if (avatarUrl) avatarEl.innerHTML = `<img src="${avatarUrl}" alt="">`;
    else avatarEl.textContent = (user.first_name || user.name || user.email || 'U')[0].toUpperCase();
  }

  async function loadIdeas() {
    try {
      const res = await fetch(`${API_URL}/api/ideas?status=live&limit=200`);
      const data = await res.json();
      allIdeas = data.ideas || data || [];
      document.getElementById('statIdeas').textContent = allIdeas.length;
      document.getElementById('statCreators').textContent = new Set(allIdeas.map(i => i.creator_id)).size;
      document.getElementById('statSold').textContent = allIdeas.filter(i => i.sold).length;
      applyFilters();
    } catch(e) {
      document.getElementById('ideasGrid').innerHTML = '<div class="empty"><h3>Failed to load ideas</h3><p>Please refresh the page</p></div>';
    }
  }

  function applyFilters() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    const sort = document.getElementById('sortSelect').value;
    const levelMap = { 'Concept':1, 'Prototype':2, 'Market Ready':3 };

    filteredIdeas = allIdeas.filter(idea => {
      const matchCat = activeCategory === 'all' || idea.category === activeCategory || idea.industry === activeCategory;
      const matchLevel = !activeLevel || idea.level === levelMap[activeLevel];
      const matchQ = !q ||
        (idea.title||'').toLowerCase().includes(q) ||
        (idea.description||'').toLowerCase().includes(q) ||
        (idea.summary||'').toLowerCase().includes(q) ||
        (idea.category||'').toLowerCase().includes(q) ||
        (idea.industry||'').toLowerCase().includes(q);
      return matchCat && matchLevel && matchQ;
    });

    if (sort === 'price_asc') filteredIdeas.sort((a,b) => (a.price||0)-(b.price||0));
    else if (sort === 'price_desc') filteredIdeas.sort((a,b) => (b.price||0)-(a.price||0));
    else if (sort === 'popular') filteredIdeas.sort((a,b) => (b.views||0)-(a.views||0));
    else filteredIdeas.sort((a,b) => new Date(b.created_at)-new Date(a.created_at));

    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const start = (currentPage-1)*PER_PAGE;
    const page = filteredIdeas.slice(start, start+PER_PAGE);
    const total = filteredIdeas.length;

    document.getElementById('resultsCount').innerHTML = total
      ? `Showing <strong>${start+1}–${Math.min(start+PER_PAGE,total)}</strong> of <strong>${total}</strong> ideas`
      : 'No ideas found';

    document.getElementById('ideasGrid').innerHTML = page.length
      ? page.map(cardHTML).join('')
      : '<div class="empty"><h3>No ideas found</h3><p>Try a different search or filter</p></div>';

    renderPagination(total);
  }

  const levelLabel = { 1:'Concept', 2:'Prototype', 3:'Market Ready' };
  const emojiMap = { Technology:'💻', Health:'🏥', Education:'📚', Finance:'💰', Food:'🍔', 'E-commerce':'🛒', Environment:'🌿', Entertainment:'🎮', 'Health & Wellness':'💊', Transport:'🚗', Agriculture:'🌾' };

  function formatPrice(p) {
    if (!p) return 'Make Offer';
    return p >= 1000 ? '$'+(p/1000).toFixed(p%1000===0?0:1)+'k' : '$'+p;
  }
  function starsHTML(r) {
    if (!r || r <= 0) return '☆☆☆☆☆ <span style="color:var(--muted);">(No ratings)</span>';
    const n = Math.max(1, Math.min(5, Math.round(r)));
    return '★'.repeat(n)+'☆'.repeat(5-n);
  }
  function stageClass(s) {
    return 'badge-'+(s||'concept').toLowerCase().replace(/ /g,'_');
  }

  const bannerGradients = [
    'linear-gradient(135deg,#1a2a4a,#2d3f6b)',
    'linear-gradient(135deg,#2a1a3a,#4a2d6b)',
    'linear-gradient(135deg,#1a3a2e,#2d6b4f)',
    'linear-gradient(135deg,#3a2a1a,#6b4f2d)',
    'linear-gradient(135deg,#3a1a2a,#6b2d4f)'
  ];
  function gradientFor(str) {
    let hash = 0;
    for (let i = 0; i < (str||'').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return bannerGradients[Math.abs(hash) % bannerGradients.length];
  }

  function cardHTML(idea) {
    const stage = levelLabel[idea.level] || idea.idea_type || 'Concept';
    const industry = idea.industry || idea.category || '';
    const avatarUrl = idea.creator_avatar || idea.avatar_url;
    const avatarHTML = avatarUrl ? `<img src="${avatarUrl}" alt="">` : (idea.creator_name||'U')[0].toUpperCase();
    const hasImage = idea.images && idea.images.length > 0;
    const bannerHTML = hasImage
      ? `<div class="card-banner" style="background-image:url('${idea.images[0]}');"></div>`
      : `<div class="card-banner" style="background:${gradientFor(idea.title || industry)};"><span class="card-banner-icon">${emojiMap[industry]||'💡'}</span></div>`;
    return `
      <a class="idea-card" href="/idea?id=${idea.id}">
        ${bannerHTML}
        <div class="card-top">
          <span class="card-badge ${stageClass(stage)}">${stage}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${idea.title||'Untitled Idea'}</div>
          <div class="card-desc">${idea.summary||idea.description||''}</div>
        </div>
        <div class="card-tags">
          ${industry ? `<span class="card-tag">${industry}</span>` : ''}
          ${idea.patent_verified ? `<span class="card-tag">✅ Verified Patent</span>` : ''}
        </div>
        <div class="card-creator">
          <div class="creator-avatar">${avatarHTML}</div>
          <div class="creator-info">
            <div class="creator-name">${idea.creator_name||'Creator'}</div>
            <div class="creator-tagline">${idea.creator?.tagline ? `"${idea.creator.tagline}"` : '&nbsp;'}</div>
          </div>
          <div class="creator-stars">${starsHTML(idea.creator?.profile_stars)}</div>
        </div>
        <div class="card-footer">
          <div class="card-price">${formatPrice(idea.price)}</div>
          <div class="card-meta">👁 ${idea.views||0}</div>
          <span class="btn-view">View →</span>
        </div>
      </a>`;
  }

  function renderPagination(total) {
    const pages = Math.ceil(total/PER_PAGE);
    if (pages <= 1) { document.getElementById('pagination').innerHTML=''; return; }
    let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
    for (let i=1; i<=pages; i++) {
      if (i===1||i===pages||Math.abs(i-currentPage)<=2)
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      else if (Math.abs(i-currentPage)===3)
        html += `<span style="color:var(--muted);padding:0 4px">…</span>`;
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Next ›</button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  function goPage(p) { currentPage=p; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }

  document.getElementById('catChips').addEventListener('click', e => {
    const btn = e.target.closest('.chip[data-cat]');
    if (!btn) return;
    document.querySelectorAll('#catChips .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    applyFilters();
  });

  document.querySelectorAll('.chip[data-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (activeLevel === btn.dataset.level) {
        btn.classList.remove('active');
        activeLevel = null;
      } else {
        document.querySelectorAll('.chip[data-level]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeLevel = btn.dataset.level;
      }
      applyFilters();
    });
  });

  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') applyFilters();
  });

  initNav();
  loadIdeas();
</script>
</body>
</html>
