<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketplace — IdeaHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: #2a2a2a;
      --gold: #f5c518;
      --gold-dim: #c49a10;
      --text: #f0f0f0;
      --muted: #888;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── TOP NAV ── */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .nav-logo .logo-icon {
      width: 32px; height: 32px;
      background: var(--gold);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    .nav-search {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .nav-search input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px 8px 38px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .nav-search input:focus { border-color: var(--gold); }
    .nav-search .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.85rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 6px 14px;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .btn-join {
      background: var(--gold) !important;
      color: #000 !important;
      font-weight: 600 !important;
    }
    .btn-join:hover { background: var(--gold-dim) !important; }

    /* User avatar in nav when logged in */
    .nav-user {
      display: none;
      align-items: center;
      gap: 10px;
    }
    .nav-user.visible { display: flex; }
    .nav-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #000;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
    }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nav-dashboard-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .nav-dashboard-btn:hover { border-color: var(--gold); }

    /* ── HERO SEARCH SECTION ── */
    .hero {
      background: linear-gradient(135deg, #0a0a0a 0%, #141008 50%, #0a0a0a 100%);
      border-bottom: 1px solid var(--border);
      padding: 48px 32px 36px;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .hero h1 span { color: var(--gold); }
    .hero p {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .hero-search {
      max-width: 600px;
      margin: 0 auto 20px;
      display: flex;
      gap: 8px;
    }
    .hero-search input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px 20px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .hero-search input:focus { border-color: var(--gold); }
    .hero-search button {
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 13px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .hero-search button:hover { background: var(--gold-dim); }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
    }
    .hero-stat { color: var(--muted); font-size: 0.875rem; }
    .hero-stat strong { color: var(--text); }

    /* ── FILTER BAR ── */
    .filter-bar {
      position: sticky;
      top: 60px;
      z-index: 90;
      background: rgba(10,10,10,0.97);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
    }
    .filter-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0;
      scrollbar-width: none;
    }
    .filter-inner::-webkit-scrollbar { display: none; }

    .filter-chip {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--gold); color: var(--text); }
    .filter-chip.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
      font-weight: 600;
    }

    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 4px;
    }

    .sort-select {
      margin-left: auto;
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    /* ── MAIN CONTENT ── */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 32px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .results-count {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .results-count strong { color: var(--text); }

    /* ── IDEA GRID ── */
    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .idea-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .idea-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: 0 8px 32px rgba(245,197,24,0.08);
    }

    .card-top {
      padding: 20px 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-emoji {
      width: 48px; height: 48px;
      background: var(--surface2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .card-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-prototype { background: rgba(139,92,246,0.15); color: #a78bfa; }
    .badge-market_ready { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-concept { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-patented { background: rgba(245,197,24,0.15); color: var(--gold); }

    .card-body { padding: 14px 20px; flex: 1; }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      padding: 0 20px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .card-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .card-creator {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .creator-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #000;
      overflow: hidden;
      flex-shrink: 0;
    }
    .creator-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .creator-info { flex: 1; min-width: 0; }
    .creator-name {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .creator-tagline {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .creator-stars { color: var(--gold); font-size: 0.7rem; }

    .card-footer {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
    }
    .card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold);
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .card-meta span { display: flex; align-items: center; gap: 4px; }

    .btn-view {
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-view:hover { background: var(--gold-dim); }

    /* ── EMPTY / LOADING ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }

    /* ── PAGINATION ── */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 40px;
    }
    .page-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .page-btn:hover, .page-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
      font-weight: 600;
    }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── FOOTER ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 24px 32px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 40px;
    }
    .footer a { color: var(--gold); text-decoration: none; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .topnav { padding: 0 16px; }
      .nav-search { display: none; }
      .hero { padding: 32px 16px 24px; }
      .hero h1 { font-size: 1.6rem; }
      .hero-search { flex-direction: column; }
      .hero-stats { gap: 16px; }
      .filter-bar { padding: 0 16px; }
      .main { padding: 20px 16px; }
      .ideas-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ── TOP NAV ── -->
<nav class="topnav">
  <a href="/" class="nav-logo">
    <div class="logo-icon">💡</div>
    <span>IdeaHub</span>
  </a>

  <div class="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="navSearchInput" placeholder="Search ideas…" />
  </div>

  <!-- Guest buttons -->
  <div class="nav-links" id="guestNav">
    <a href="/login">Sign in</a>
    <a href="/signup" class="btn-join">Join free</a>
  </div>

  <!-- Logged-in user -->
  <div class="nav-user" id="userNav">
    <a href="/dashboard" class="nav-dashboard-btn" id="dashboardLink">My Dashboard</a>
    <a href="/profile" class="nav-avatar" id="navAvatar"></a>
  </div>
</nav>

<!-- ── HERO ── -->
<section class="hero">
  <h1>Discover <span>Ideas</span> that change everything</h1>
  <p>Browse thousands of ideas from creators around the world</p>
  <div class="hero-search">
    <input type="text" id="heroSearchInput" placeholder="Search by title, keyword, or category…" />
    <button onclick="doSearch()">Search</button>
  </div>
  <div class="hero-stats">
    <div class="hero-stat"><strong id="statIdeas">—</strong> ideas listed</div>
    <div class="hero-stat"><strong id="statCreators">—</strong> creators</div>
    <div class="hero-stat"><strong id="statSold">—</strong> ideas sold</div>
  </div>
</section>

<!-- ── FILTER BAR ── -->
<div class="filter-bar">
  <div class="filter-inner">
    <button class="filter-chip active" data-cat="all">All</button>
    <button class="filter-chip" data-cat="Technology">💻 Technology</button>
    <button class="filter-chip" data-cat="Health">🏥 Health</button>
    <button class="filter-chip" data-cat="Education">📚 Education</button>
    <button class="filter-chip" data-cat="Finance">💰 Finance</button>
    <button class="filter-chip" data-cat="Food">🍔 Food</button>
    <button class="filter-chip" data-cat="E-commerce">🛒 E-commerce</button>
    <button class="filter-chip" data-cat="Environment">🌿 Environment</button>
    <button class="filter-chip" data-cat="Entertainment">🎮 Entertainment</button>
    <div class="filter-divider"></div>
    <button class="filter-chip" data-level="Market Ready">Market Ready</button>
    <button class="filter-chip" data-level="Prototype">Prototype</button>
    <button class="filter-chip" data-level="Concept">Concept</button>
    <select class="sort-select" id="sortSelect" onchange="applyFilters()">
      <option value="newest">Newest first</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="popular">Most Viewed</option>
    </select>
  </div>
</div>

<!-- ── MAIN CONTENT ── -->
<main class="main">
  <div class="results-header">
    <div class="results-count" id="resultsCount">Loading ideas…</div>
  </div>

  <div class="ideas-grid" id="ideasGrid">
    <div class="loading" style="grid-column:1/-1">
      <div class="spinner"></div>
      <p>Loading ideas…</p>
    </div>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<!-- ── FOOTER ── -->
<footer class="footer">
  © 2025 <a href="https://picela.co" target="_blank">Picela</a>. All rights reserved. IdeaHub is a product by <a href="https://picela.co" target="_blank">Picela</a>.
</footer>

<script>
  const API_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://ideahub-production-1b18.up.railway.app';

  let allIdeas = [];
  let filteredIdeas = [];
  let currentPage = 1;
  const PER_PAGE = 12;
  let activeCategory = 'all';
  let activeLevel = null;

  // ── AUTH: show/hide nav based on login state ──
  function initNav() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
      document.getElementById('guestNav').style.display = 'none';
      const userNav = document.getElementById('userNav');
      userNav.classList.add('visible');

      // Set dashboard link based on role
      const roleLinks = {
        idea_creator: '/dashboard', patent_seller: '/dashboard',
        investor: '/buyer-dashboard', corporate_services: '/buyer-dashboard',
        virtual_manager: '/support-dashboard', patent_attorney: '/support-dashboard',
        business_owner: '/business-dashboard', admin: '/admin'
      };
      document.getElementById('dashboardLink').href = roleLinks[user.role] || '/dashboard';

      // Avatar
      const avatarEl = document.getElementById('navAvatar');
      const avatarUrl = user.avatar_url || user.avatarUrl;
      if (avatarUrl) {
        avatarEl.innerHTML = `<img src="${avatarUrl}" alt="avatar">`;
      } else {
        avatarEl.textContent = (user.name || user.email || 'U')[0].toUpperCase();
      }
    }
  }

  // ── LOAD IDEAS ──
  async function loadIdeas() {
    try {
      const res = await fetch(`${API_URL}/api/ideas?status=live&limit=200`);
      const data = await res.json();
      allIdeas = data.ideas || data || [];
      updateStats();
      applyFilters();
    } catch (e) {
      document.getElementById('ideasGrid').innerHTML =
        `<div class="empty" style="grid-column:1/-1"><h3>Failed to load ideas</h3><p>Please refresh the page</p></div>`;
    }
  }

  function updateStats() {
    document.getElementById('statIdeas').textContent = allIdeas.length;
    const creators = new Set(allIdeas.map(i => i.creator_id)).size;
    document.getElementById('statCreators').textContent = creators;
    const sold = allIdeas.filter(i => i.sold).length;
    document.getElementById('statSold').textContent = sold;
  }

  // ── FILTERS ──
  function applyFilters() {
    const searchTerm = (document.getElementById('heroSearchInput').value ||
                        document.getElementById('navSearchInput').value).toLowerCase();
    const sort = document.getElementById('sortSelect').value;

    filteredIdeas = allIdeas.filter(idea => {
      const matchCat = activeCategory === 'all' || idea.category === activeCategory;
      const matchLevel = !activeLevel || idea.development_stage === activeLevel || idea.idea_type === activeLevel;
      const matchSearch = !searchTerm ||
        (idea.title || '').toLowerCase().includes(searchTerm) ||
        (idea.description || '').toLowerCase().includes(searchTerm) ||
        (idea.category || '').toLowerCase().includes(searchTerm);
      return matchCat && matchLevel && matchSearch;
    });

    // Sort
    if (sort === 'price_asc') filteredIdeas.sort((a,b) => (a.price||0) - (b.price||0));
    else if (sort === 'price_desc') filteredIdeas.sort((a,b) => (b.price||0) - (a.price||0));
    else if (sort === 'popular') filteredIdeas.sort((a,b) => (b.views||0) - (a.views||0));
    else filteredIdeas.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    currentPage = 1;
    renderPage();
  }

  function doSearch() { applyFilters(); }

  // ── RENDER CARDS ──
  function renderPage() {
    const start = (currentPage - 1) * PER_PAGE;
    const page = filteredIdeas.slice(start, start + PER_PAGE);
    const total = filteredIdeas.length;

    document.getElementById('resultsCount').innerHTML =
      `Showing <strong>${Math.min(start+1, total)}–${Math.min(start+PER_PAGE, total)}</strong> of <strong>${total}</strong> ideas`;

    if (!page.length) {
      document.getElementById('ideasGrid').innerHTML =
        `<div class="empty" style="grid-column:1/-1">
          <h3>No ideas found</h3>
          <p>Try a different search or filter</p>
        </div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    document.getElementById('ideasGrid').innerHTML = page.map(idea => cardHTML(idea)).join('');
    renderPagination(total);
  }

  function formatPrice(p) {
    if (!p) return 'Make Offer';
    if (p >= 1000) return '$' + (p/1000).toFixed(p%1000===0?0:1) + 'k';
    return '$' + p;
  }

  function stageClass(stage) {
    if (!stage) return '';
    return 'badge-' + stage.toLowerCase().replace(/ /g,'_');
  }

  function starsHTML(rating) {
    const r = Math.round(rating || 1);
    return '★'.repeat(r) + '☆'.repeat(5-r);
  }

  function categoryEmoji(cat) {
    const map = {
      Technology:'💻', Health:'🏥', Education:'📚', Finance:'💰',
      Food:'🍔', 'E-commerce':'🛒', Environment:'🌿', Entertainment:'🎮',
      'Health & Wellness':'💊', Transport:'🚗', Agriculture:'🌾'
    };
    return map[cat] || '💡';
  }

  function cardHTML(idea) {
    const stage = idea.development_stage || idea.idea_type || 'Concept';
    const avatarUrl = idea.creator_avatar || idea.avatar_url;
    const avatarHTML = avatarUrl
      ? `<img src="${avatarUrl}" alt="">`
      : (idea.creator_name || 'U')[0].toUpperCase();

    return `
      <a class="idea-card" href="/idea?id=${idea.id}">
        <div class="card-top">
          <div class="card-emoji">${categoryEmoji(idea.category)}</div>
          <span class="card-badge ${stageClass(stage)}">${stage}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${idea.title || 'Untitled Idea'}</div>
          <div class="card-desc">${idea.description || ''}</div>
        </div>
        <div class="card-tags">
          ${idea.category ? `<span class="card-tag">${idea.category}</span>` : ''}
          ${idea.patent_verified ? `<span class="card-tag">✅ Verified Patent</span>` : ''}
        </div>
        <div class="card-creator">
          <div class="creator-avatar">${avatarHTML}</div>
          <div class="creator-info">
            <div class="creator-name">${idea.creator_name || 'Creator'}</div>
            <div class="creator-tagline">${idea.creator_tagline ? `"${idea.creator_tagline}"` : ''}</div>
          </div>
          <div class="creator-stars">${starsHTML(idea.creator_rating)}</div>
        </div>
        <div class="card-footer">
          <div class="card-price">${formatPrice(idea.price)}</div>
          <div class="card-meta">
            <span>👁 ${idea.views || 0}</span>
          </div>
          <span class="btn-view">View →</span>
        </div>
      </a>`;
  }

  // ── PAGINATION ──
  function renderPagination(total) {
    const pages = Math.ceil(total / PER_PAGE);
    if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - currentPage) <= 2) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 3) {
        html += `<span style="color:var(--muted);padding:0 4px">…</span>`;
      }
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Next ›</button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  function goPage(p) {
    currentPage = p;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── EVENT LISTENERS ──
  document.querySelectorAll('.filter-chip[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip[data-cat]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      applyFilters();
    });
  });

  document.querySelectorAll('.filter-chip[data-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (activeLevel === btn.dataset.level) {
        btn.classList.remove('active');
        activeLevel = null;
      } else {
        document.querySelectorAll('.filter-chip[data-level]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeLevel = btn.dataset.level;
      }
      applyFilters();
    });
  });

  document.getElementById('heroSearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
  document.getElementById('navSearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
  document.getElementById('navSearchInput').addEventListener('input', () => {
    document.getElementById('heroSearchInput').value = document.getElementById('navSearchInput').value;
    applyFilters();
  });

  // ── INIT ──
  initNav();
  loadIdeas();
</script>
</body>
</html>
