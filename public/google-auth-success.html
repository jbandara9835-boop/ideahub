<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /><link rel="icon" href="/favicon.svg" type="image/svg+xml" /><title>Signing in…</title><link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site.css" />
</head>
<body style="background:#0d0d0f;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;color:#f0ede8;">
<div style="text-align:center;">
  <div style="font-size:32px;margin-bottom:1rem;"></div>
  <div style="font-size:18px;">Signing you in...</div>
</div>
<script>
  // The sign-in arrives after # (never sent to servers or other sites); older links used ?token=
  const params = new URLSearchParams(location.hash.slice(1) || location.search);
  const token = params.get('token');
  let user = null; try { user = JSON.parse(params.get('user') || 'null'); } catch (e) {}
  history.replaceState(null, '', '/auth/google/success');
  const dashMap = { idea_creator:'/dashboard', investor:'/buyer-dashboard', business_owner:'/business-dashboard', virtual_manager:'/support-dashboard', chartered_accountant:'/support-dashboard', patent_attorney:'/support-dashboard', corporate_services:'/support-dashboard', patent_seller:'/dashboard', admin:'/admin' };
  if (token && user) {
    localStorage.setItem('ih_token', token);
    localStorage.setItem('ih_user', JSON.stringify(user));
    // Swap in the full profile, then go to the dashboard
    fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.ok ? r.json() : null).then(me => { if (me && me.id) localStorage.setItem('ih_user', JSON.stringify(me)); })
      .catch(() => {}).finally(() => { location.href = dashMap[user.role] || '/dashboard'; });
  } else {
    location.href = '/login?error=google';
  }
</script>
</body>
</html>
