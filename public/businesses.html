  <!DOCTYPE html>
  <html lang="en">
  <head>

<link rel="stylesheet" href="/site.css" />
<style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #080809; --surface: #141414; --surface2: #1c1c1c;
        --border: #2a2a2a; --gold: #f5c842; --gold-dim: #c49a10;
        --text: #f0f0f0; --muted: #888; --radius: 12px; --accent: #f5c842; --accent-dim: rgba(245,200,66,0.12);
      }
      body { background: var(--bg); color: var(--text); font-family:'DM Sans',system-ui,sans-serif; min-height: 100vh; }

      /* NAV */
      .topnav { position:sticky; top:0; z-index:100; background:rgba(8,8,9,0.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 32px; height:60px; display:flex; align-items:center; gap:24px; }
      .nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-size:1.15rem; font-weight:700; flex-shrink:0; }
      .nav-logo .logo-icon { width:32px; height:32px; background:var(--gold); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
      .nav-links { display:flex; align-items:center; gap:8px; margin-left:auto; }
      .nav-links a { color:var(--muted); text-decoration:none; font-size:0.875rem; padding:6px 14px; border-radius:6px; transition:color 0.2s; }
      .nav-links a:hover { color:var(--text); }
      .btn-join { background:var(--gold) !important; color:#000 !important; font-weight:600 !important; }
      .nav-user { display:none; align-items:center; gap:10px; }
      .nav-user.visible { display:flex; }
      .nav-avatar { width:34px; height:34px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; color:#000; overflow:hidden; cursor:pointer; text-decoration:none; }
      .nav-avatar img { width:100%; height:100%; object-fit:cover; }
      .nav-dashboard-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:6px 14px; border-radius:6px; font-size:0.875rem; text-decoration:none; }
      .nav-dashboard-btn:hover { border-color:var(--gold); }
      .nav-list-btn { background:var(--gold); color:#000; padding:6px 14px; border-radius:6px; font-size:0.875rem; text-decoration:none; font-weight:600; display:none; }
      .nav-list-btn.visible { display:inline-flex; align-items:center; gap:6px; }

      /* HERO */
      .hero { background:linear-gradient(135deg,#080809 0%,#0d1008 50%,#080809 100%); border-bottom:1px solid var(--border); padding:28px 32px 20px; text-align:center; }
      .hero h1 { font-size:2.2rem; font-weight:800; margin-bottom:8px; }
      .hero h1 span { color:var(--gold); }
      .hero p { color:var(--muted); font-size:1rem; margin-bottom:24px; }

      /* SEARCH ROW */
      .search-row { max-width:720px; margin:0 auto 16px; display:flex; gap:8px; }
      .search-row input { flex:1; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:13px 20px; color:var(--text); font-size:1rem; outline:none; transition:border-color 0.2s; }
      .search-row input:focus { border-color:var(--gold); }
      .country-select { background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:13px 16px; color:var(--text); font-size:0.9rem; outline:none; cursor:pointer; min-width:160px; transition:border-color 0.2s; }
      .country-select:focus { border-color:var(--gold); }
      .search-row button { background:var(--gold); color:#000; border:none; border-radius:10px; padding:13px 24px; font-size:0.95rem; font-weight:600; cursor:pointer; white-space:nowrap; }
      .search-row button:hover { background:var(--gold-dim); }

      /* ADVANCED FILTERS TOGGLE */
      .adv-toggle-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:20px; }
      .adv-toggle-btn {
        display:inline-flex; align-items:center; gap:8px;
        background:var(--surface2); border:1px solid var(--border);
        color:var(--muted); border-radius:20px; padding:7px 18px;
        font-size:0.85rem; cursor:pointer; transition:all 0.2s;
      }
      .adv-toggle-btn:hover { border-color:var(--gold); color:var(--text); }
      .adv-toggle-btn.open { border-color:var(--gold); color:var(--gold); background:rgba(245,197,24,0.08); }
      .adv-toggle-btn .arrow { transition:transform 0.25s; display:inline-block; font-style:normal; }
      .adv-toggle-btn.open .arrow { transform:rotate(180deg); }
      .active-filters-count { background:var(--gold); color:#000; border-radius:20px; padding:2px 8px; font-size:0.75rem; font-weight:700; display:none; }
      .active-filters-count.visible { display:inline; }

      /* ADVANCED FILTER PANEL */
      .adv-panel {
        max-width:720px; margin:0 auto 20px;
        background:var(--surface); border:1px solid var(--border);
        border-radius:12px; overflow:hidden;
        max-height:0; transition:max-height 0.35s ease, opacity 0.25s ease;
        opacity:0; pointer-events:none;
      }
      .adv-panel.open { max-height:400px; opacity:1; pointer-events:all; }
      .adv-panel-inner { padding:20px; display:flex; flex-direction:column; gap:18px; }
      .filter-group-label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; }
      .chips-wrap { display:flex; flex-wrap:wrap; gap:8px; }
      .chip { background:var(--surface2); border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:6px 14px; font-size:0.82rem; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
      .chip:hover { border-color:var(--gold); color:var(--text); }
      .chip.active { background:var(--gold) !important; border-color:var(--gold) !important; color:#000 !important; font-weight:600 !important; }
      .adv-panel-footer { display:flex; justify-content:flex-end; gap:8px; padding-top:4px; border-top:1px solid var(--border); }
      .btn-clear { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:7px 16px; font-size:0.82rem; cursor:pointer; }
      .btn-clear:hover { border-color:var(--gold); color:var(--text); }
      .btn-apply { background:var(--gold); color:#000; border:none; border-radius:8px; padding:7px 18px; font-size:0.82rem; font-weight:600; cursor:pointer; }
      .btn-apply:hover { background:var(--gold-dim); }

      .route-bar { max-width:1240px; margin:1.1rem auto 0; padding:0 2rem; }
    .dir-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .dt { background:none; border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
    .dt.on { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
    .route-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .rt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.7rem .8rem; text-align:left; cursor:pointer; color:var(--text); font-family:inherit; }
    .rt b { display:block; font-size:13px; } .rt small { display:block; font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.4; }
    .rt.on { border-color:var(--accent); background:var(--accent-dim); }
    .conf-badge { color:#c4b5fd; border-color:rgba(167,139,250,0.35) !important; background:rgba(167,139,250,0.08) !important; }
    .dir-label { font-size:11.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; }
    @media (max-width:900px) { .route-row { grid-template-columns:repeat(2,minmax(0,1fr)); } .route-bar { padding:0 1rem; } }
    .hero-stats { display:flex; justify-content:center; gap:32px; margin-top:14px; }
      .hero-stat { color:var(--muted); font-size:0.875rem; }
      .hero-stat strong { color:var(--text); }

      /* STICKY BAR — shows active filters summary */
      .active-bar { position:sticky; top:60px; z-index:90; background:rgba(10,10,10,0.97); border-bottom:1px solid var(--border); padding:10px 32px; display:none; align-items:center; gap:8px; flex-wrap:wrap; }
      .active-bar.visible { display:flex; }
      .active-tag { display:inline-flex; align-items:center; gap:6px; background:rgba(245,197,24,0.1); border:1px solid rgba(245,197,24,0.3); color:var(--gold); border-radius:20px; padding:4px 12px; font-size:0.78rem; }
      .active-tag button { background:none; border:none; color:var(--gold); cursor:pointer; font-size:0.85rem; padding:0; line-height:1; }
      .clear-all { margin-left:auto; background:none; border:none; color:var(--muted); font-size:0.78rem; cursor:pointer; text-decoration:underline; }
      .clear-all:hover { color:var(--text); }

      /* MAIN */
      .main { max-width:1400px; margin:0 auto; padding:28px 32px; }
      .results-count { color:var(--muted); font-size:0.9rem; margin-bottom:20px; }
      .results-count strong { color:var(--text); }

      /* CARDS */
      .biz-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
      .biz-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
      .biz-card:hover { transform:translateY(-3px); border-color:var(--gold); box-shadow:0 8px 32px rgba(245,197,24,0.08); }
      .card-top { padding:20px 20px 14px; }
      .card-header { display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; }
      .biz-logo { width:52px; height:52px; border-radius:12px; background:rgba(245,197,24,0.12); border:1px solid rgba(245,197,24,0.25); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
      .biz-name { font-size:1rem; font-weight:700; margin-bottom:3px; }
      .biz-location { font-size:0.75rem; color:var(--muted); }
      .biz-desc { font-size:0.82rem; color:var(--muted); line-height:1.6; margin-bottom:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
      .type-pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
      .type-pill { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:500; background:var(--accent-dim); color:var(--accent); border:1px solid rgba(245,200,66,0.25); }
      .pill-franchise { background:rgba(245,197,24,0.15); color:var(--gold); }
      .pill-license { background:rgba(96,165,250,0.15); color:#60a5fa; }
      .pill-joint_venture { background:rgba(110,231,183,0.15); color:#6ee7b7; }
      .pill-distribution { background:rgba(251,146,60,0.15); color:#fb923c; }
      .pill-white_label { background:rgba(167,139,250,0.15); color:#a78bfa; }
      .cat-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:500; background:rgba(255,255,255,0.06); color:var(--muted); border:1px solid var(--border); }
      .biz-meta-row { display:flex; gap:12px; flex-wrap:wrap; }
      .biz-meta-row span { font-size:0.75rem; color:var(--muted); }
      .card-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
      .investment { font-size:1.1rem; font-weight:800; color:var(--gold); }
      .apps-count { font-size:0.78rem; color:var(--muted); }
      .btn-view { background:var(--gold); color:#000; border:none; border-radius:6px; padding:7px 16px; font-size:0.82rem; font-weight:600; cursor:pointer; text-decoration:none; }
      .btn-view:hover { background:var(--gold-dim); }

      .loading { text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1; }
      .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 16px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      .empty { text-align:center; padding:80px 20px; color:var(--muted); grid-column:1/-1; }
      .empty h3 { font-size:1.1rem; margin-bottom:8px; color:var(--text); }

      .footer { border-top:1px solid var(--border); padding:24px 32px; text-align:center; color:var(--muted); font-size:0.82rem; margin-top:40px; }
      .footer a { color:var(--gold); text-decoration:none; }

      @media (max-width:768px) {
        .topnav { padding:0 12px; gap:8px; }
        .nav-links { display:none; }
        .hero { padding:24px 12px 20px; }
        .hero h1 { font-size:1.5rem; }
        .search-row { flex-direction:column; gap:8px; }
        .search-row input, .country-select, .search-row button { width:100%; }
        .hero-stats { gap:10px; flex-wrap:wrap; justify-content:center; }
        .hero-stat { font-size:0.8rem; }
        .adv-toggle-row { flex-wrap:wrap; gap:8px; }
        .adv-panel { margin:0 12px 16px; }
        .active-bar { padding:8px 12px; }
        .main { padding:16px 12px; }
        .biz-grid { grid-template-columns:1fr; gap:14px; }
        .card-top { padding:16px 16px 12px; }
        .card-footer { padding:10px 16px; }
        .footer { padding:16px; }
      }
    </style>
  </head>
  <body>

<header id="siteNav" data-extra="list-business"></header><script src="/site-nav.js"></script>

  <section class="hero">
    <h1>Business <span>Expansion</span></h1>
    <p>Franchise, merge, invest, supply or distribute: find verified businesses to grow with</p>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search by business name or category…" />
      <select id="countryFilter" class="country-select">
        <option value="">All Countries</option>
        <option>Sri Lanka</option>
        <option>United States</option>
        <option>United Kingdom</option>
        <option>India</option>
        <option>Australia</option>
        <option>Singapore</option>
        <option>UAE</option>
        <option>Canada</option>
        <option>Germany</option>
        <option>France</option>
        <option>Japan</option>
        <option>South Africa</option>
      </select>
      <button onclick="applyFilters()">Search</button>
    </div>

    <!-- Advanced Filters Toggle -->
    <div class="adv-toggle-row">
      <button class="adv-toggle-btn" id="advToggleBtn" onclick="toggleAdvanced()">
        <span>Advanced Filters</span>
        <i class="arrow">▼</i>
      </button>
      <span class="active-filters-count" id="activeFiltersCount">0</span>
    </div>

    <!-- Advanced Panel -->
    <div class="adv-panel" id="advPanel">
      <div class="adv-panel-inner">
        <!-- Business Category -->
        <div>
          <div class="filter-group-label">Business Category</div>
          <div class="chips-wrap" id="catChips">
            <button class="chip active" data-cat="all">All</button>
            <button class="chip" data-cat="Food & Beverage">Food &amp; Beverage</button>
            <button class="chip" data-cat="Retail">Retail</button>
            <button class="chip" data-cat="Technology">Technology</button>
            <button class="chip" data-cat="Health & Wellness">Health &amp; Wellness</button>
            <button class="chip" data-cat="Education">Education</button>
            <button class="chip" data-cat="Finance">Finance</button>
            <button class="chip" data-cat="Real Estate">Real Estate</button>
            <button class="chip" data-cat="Entertainment">Entertainment</button>
            <button class="chip" data-cat="Logistics">Logistics</button>
            <button class="chip" data-cat="Manufacturing">Manufacturing</button>
            <button class="chip" data-cat="Other">Other</button>
          </div>
        </div>
        <!-- Expansion Type -->
        <div>
          <div class="filter-group-label">Expansion Route</div>
          <div class="chips-wrap" id="typeChips">
            <button class="chip active" data-type="all">All routes</button>
            <button class="chip" data-type="markets">New markets</button>
            <button class="chip" data-type="horizontal">Horizontal</button>
            <button class="chip" data-type="backward">Towards supply</button>
            <button class="chip" data-type="forward">Towards customers</button>
            <button class="chip" data-type="brand">Brand extension</button>
          </div>
        </div>
        <div class="adv-panel-footer">
          <button class="btn-clear" onclick="clearAdvanced()">Clear filters</button>
          <button class="btn-apply" onclick="toggleAdvanced(); applyFilters();">Apply Filters</button>
        </div>
      </div>
    </div>

    <div class="hero-stats">
      <div class="hero-stat"><strong id="statTotal">—</strong> businesses listed</div>
      <div class="hero-stat"><strong id="statCountries">—</strong> countries</div>
      <div class="hero-stat"><strong id="statCategories">—</strong> categories</div>
    </div>
  </section>

  <!-- Active filters summary bar -->
  <div class="route-bar">
    <div class="dir-tabs" id="dirTabs"><button class="dt on" data-d="all">All</button><button class="dt" data-d="offer">Opportunities offered</button><button class="dt" data-d="seek">Businesses looking for partners</button></div>
    <div class="route-row" id="routeRow"></div>
  </div>
  <div class="active-bar" id="activeBar"></div>

  <main class="main">
    <div class="results-count" id="resultsCount">Loading businesses…</div>
    <div class="biz-grid" id="bizGrid">
      <div class="loading"><div class="spinner"></div><p>Loading businesses…</p></div>
    </div>
  </main>

  <script src="/expansion-routes.js"></script>
  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

    let allBusinesses = [], activeCategory = 'all', activeType = 'all', activeDir = 'all';
    let advOpen = false;

    const typeConfig = {
      franchise:     { label:'Franchise',     emoji:'', cls:'pill-franchise' },
      license:       { label:'License',       emoji:'', cls:'pill-license' },
      joint_venture: { label:'Joint Venture', emoji:'', cls:'pill-joint_venture' },
      distribution:  { label:'Distribution',  emoji:'', cls:'pill-distribution' },
      white_label:   { label:'White Label',   emoji:'', cls:'pill-white_label' },
    };
    const catEmoji = {
'Food & Beverage':'', 'Retail':'', 'Technology':'', 'Health & Wellness':'', 'Education':'', 'Finance':'', 'Real Estate':'', 'Entertainment':'', 'Logistics':'', 'Manufacturing':'', 'Other':''
    };

    function toggleAdvanced() {
      advOpen = !advOpen;
      document.getElementById('advPanel').classList.toggle('open', advOpen);
      document.getElementById('advToggleBtn').classList.toggle('open', advOpen);
    }

    function clearAdvanced() {
      activeCategory = 'all';
      activeType = 'all'; if (typeof drawRouteRow === 'function') drawRouteRow();
      document.querySelectorAll('#catChips .chip').forEach(b => b.classList.remove('active'));
      document.querySelector('#catChips .chip[data-cat="all"]').classList.add('active');
      document.querySelectorAll('#typeChips .chip').forEach(b => b.classList.remove('active'));
      document.querySelector('#typeChips .chip[data-type="all"]').classList.add('active');
      updateActiveBar();
      applyFilters();
    }

    function updateActiveBar() {
      const tags = [];
      const country = document.getElementById('countryFilter').value;
      if (activeCategory !== 'all') tags.push({ label: catEmoji[activeCategory] + ' ' + activeCategory, clear: () => { activeCategory='all'; document.querySelectorAll('#catChips .chip').forEach(b=>b.classList.remove('active')); document.querySelector('#catChips .chip[data-cat="all"]').classList.add('active'); } });
      if (activeType !== 'all') tags.push({ label: (Routes.GROUP[activeType]?.icon || '') + ' ' + (Routes.GROUP[activeType]?.short || activeType), clear: () => { activeType='all'; document.querySelectorAll('#typeChips .chip').forEach(b=>b.classList.remove('active')); document.querySelector('#typeChips .chip[data-type="all"]').classList.add('active'); } });
      if (country) tags.push({ label: country, clear: () => { document.getElementById('countryFilter').value = ''; } });

      const bar = document.getElementById('activeBar');
      const countEl = document.getElementById('activeFiltersCount');

      if (tags.length === 0) {
        bar.classList.remove('visible');
        countEl.classList.remove('visible');
        return;
      }

      countEl.textContent = tags.length;
      countEl.classList.add('visible');
      bar.classList.add('visible');
      bar.innerHTML = tags.map((t, i) =>
        `<span class="active-tag">${escB(t.label)} <button onclick="clearTag(${i})" aria-label="Remove filter">✕</button></span>`
      ).join('') + `<button class="clear-all" onclick="clearAdvanced(); document.getElementById('countryFilter').value=''; applyFilters();">Clear all</button>`;

      // store clearers
      bar._clearers = tags.map(t => t.clear);
    }

    window.clearTag = function(i) {
      const bar = document.getElementById('activeBar');
      if (bar._clearers && bar._clearers[i]) bar._clearers[i]();
      updateActiveBar();
      applyFilters();
    };

    // NAV
    function initNav() {
      const token = localStorage.getItem('token') || localStorage.getItem('ih_token');
      const user = JSON.parse(localStorage.getItem('user') || localStorage.getItem('ih_user') || 'null');
      if (!token || !user) return;
      document.getElementById('guestNav').style.display = 'none';
      document.getElementById('userNav').classList.add('visible');
      const roleLinks = {
        idea_creator:'/dashboard', patent_seller:'/dashboard',
        investor:'/buyer-dashboard', corporate_services:'/support-dashboard',
        virtual_manager:'/support-dashboard', chartered_accountant:'/support-dashboard', patent_attorney:'/support-dashboard',
        business_owner:'/business-dashboard', admin:'/admin'
      };
      document.getElementById('dashboardLink').href = roleLinks[user.role] || '/dashboard';
      if (['business_owner','admin'].includes(user.role)) {
        document.getElementById('listBizBtn').classList.add('visible');
      }
      const avatarEl = document.getElementById('navAvatar');
      const avatarUrl = user.avatar_url || user.avatarUrl;
      if (avatarUrl) avatarEl.innerHTML = `<img src="${escB(avatarUrl)}" alt="">`;
      else avatarEl.textContent = (user.name || user.first_name || user.email || 'U')[0].toUpperCase();
    }

    async function loadBusinesses() {
      try {
        const res = await fetch(`${API_URL}/api/businesses`);
        allBusinesses = await res.json();
        if (!Array.isArray(allBusinesses)) allBusinesses = allBusinesses.businesses || [];
        document.getElementById('statTotal').textContent = allBusinesses.length;
        document.getElementById('statCountries').textContent = new Set(allBusinesses.map(b => b.country).filter(Boolean)).size || '—';
        document.getElementById('statCategories').textContent = new Set(allBusinesses.map(b => b.industry).filter(Boolean)).size || '—';
        applyFilters();
      } catch(e) {
        document.getElementById('bizGrid').innerHTML = '<div class="empty"><h3>Failed to load</h3><p>Please refresh the page</p></div>';
      }
    }

    function applyFilters() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const country = document.getElementById('countryFilter').value;
      updateActiveBar();

      const filtered = allBusinesses.filter(b => {
        const types = b.expansion_types || [];
        const matchType = activeType === 'all' || b.route === activeType;
        const matchDir = activeDir === 'all' || (b.direction || 'offer') === activeDir;
        const matchCat = activeCategory === 'all' || b.industry === activeCategory;
        const matchCountry = !country || b.country === country;
        const matchQ = !q ||
          (b.business_name||'').toLowerCase().includes(q) ||
          (b.title||'').toLowerCase().includes(q) || (b.teaser||'').toLowerCase().includes(q) ||
          (b.tagline||'').toLowerCase().includes(q) ||
          (b.description||'').toLowerCase().includes(q) ||
          (b.category||'').toLowerCase().includes(q) ||
          (b.industry||'').toLowerCase().includes(q);
        return matchType && matchDir && matchCat && matchCountry && matchQ;
      });

      document.getElementById('resultsCount').innerHTML = filtered.length
        ? `Showing <strong>${filtered.length}</strong> of <strong>${allBusinesses.length}</strong> businesses`
        : '';
      document.getElementById('bizGrid').innerHTML = filtered.length
        ? filtered.map(cardHTML).join('')
        : '<div class="empty"><h3>No businesses found</h3><p>Try adjusting your filters</p></div>';
    }

  function escB(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function formatInvestment(min, max) {
      if (!min && !max) return 'Negotiable';
      const fmt = n => n >= 1000000 ? '$'+(n/1000000).toFixed(1)+'M' : n >= 1000 ? '$'+(n/1000).toFixed(0)+'k' : '$'+n;
      if (min && max) return `${fmt(min)} – ${fmt(max)}`;
      if (min) return `From ${fmt(min)}`;
      return `Up to ${fmt(max)}`;
    }

    function cardHTML(b) {
      const title = b.title || b.business_name || 'Business';
      const g = Routes.GROUP[b.route] || {};
      const logoContent = b.masked ? '' : (catEmoji[b.industry] || escB(String(title).split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)));
      const types = (b.expansion_types||[]).slice(0,3);
      const d = b.details || {};
      const facts = [d.revenue_range ? `Revenue ${d.revenue_range}` : '', d.profit_range ? `Profit ${d.profit_range}` : '', d.stake_pct ? `${d.stake_pct}% stake` : '',
        d.royalty_pct ? `${d.royalty_pct}% royalty` : '', d.exclusivity || '', d.capacity ? `${d.capacity}` : '', d.min_order ? `MOQ ${d.min_order}` : ''].filter(Boolean).slice(0, 3);
      const blurb = b.masked ? b.teaser : (b.description || b.tagline || d.products || d.products_wanted || d.criteria || d.inputs_needed || '');
      return `
        <a class="biz-card" href="/business/${encodeURIComponent(b.id)}">
          <div class="card-top">
            <div class="dir-label">${b.direction === 'seek' ? 'Looking for a partner' : 'Opportunity'} · ${escB(g.short || '')}</div>
            <div class="card-header">
              <div class="biz-logo">${logoContent}</div>
              <div style="flex:1;min-width:0">
                <div class="biz-name">${escB(title)}</div>
                <div class="biz-location">${b.city ? escB(b.city)+', ' : ''}${escB(b.country||'')}</div>
              </div>
            </div>
            <div class="biz-desc">${escB(blurb)}</div>
            <div class="type-pills">
              ${b.masked ? `<span class="cat-badge conf-badge" title="Full details after you sign a confidentiality agreement">Confidential</span>` : ''}
              ${b.is_verified ? `<span class="cat-badge" style="color:#6ee7b7;border-color:rgba(110,231,183,0.35);background:rgba(110,231,183,0.08)" title="Company registration checked by Picela">Verified</span>` : ''}
              ${b.industry ? `<span class="cat-badge">${catEmoji[b.industry]||''} ${escB(b.industry)}</span>` : ''}
              ${types.map(t => `<span class="type-pill">${escB(Routes.typeLabel(t, b.direction))}</span>`).join('')}
            </div>
            <div class="biz-meta-row">${facts.map(f => `<span>${escB(f)}</span>`).join('')}</div>
          </div>
          <div class="card-footer">
            <div class="investment">${(b.investment_min || b.investment_max) ? (b.direction === 'seek' ? 'Budget ' : '') + escB(formatInvestment(b.investment_min, b.investment_max)) : (b.direction === 'seek' ? 'Budget open' : 'Terms negotiable')}</div>
            <div class="apps-count">${Number(b.application_count)||0} response${Number(b.application_count) === 1 ? '' : 's'}</div>
            <span class="btn-view">View →</span>
          </div>
        </a>`;
    }

    function drawRouteRow() {
      document.getElementById('routeRow').innerHTML = Routes.GROUPS.map(g => `<button class="rt ${activeType === g.key ? 'on' : ''}" data-rt="${g.key}"><b>${g.icon} ${escB(g.short)}</b><small>${escB(g.help.split(':')[0])}</small></button>`).join('');
    }
    function syncTypeChips() { document.querySelectorAll('#typeChips .chip').forEach(b => b.classList.toggle('active', b.dataset.type === activeType)); }
    document.getElementById('routeRow').addEventListener('click', e => { const b = e.target.closest('[data-rt]'); if (!b) return; activeType = activeType === b.dataset.rt ? 'all' : b.dataset.rt; drawRouteRow(); syncTypeChips(); applyFilters(); });
    document.getElementById('dirTabs').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; activeDir = b.dataset.d; document.querySelectorAll('#dirTabs .dt').forEach(x => x.classList.toggle('on', x === b)); applyFilters(); });
    const qp = new URLSearchParams(location.search);
    if (Routes.GROUP[qp.get('route')]) activeType = qp.get('route');
    if (['offer', 'seek'].includes(qp.get('direction'))) { activeDir = qp.get('direction'); document.querySelectorAll('#dirTabs .dt').forEach(x => x.classList.toggle('on', x.dataset.d === activeDir)); }
    drawRouteRow(); syncTypeChips();

    // Chip listeners
    document.getElementById('catChips').addEventListener('click', e => {
      const btn = e.target.closest('.chip[data-cat]');
      if (!btn) return;
      document.querySelectorAll('#catChips .chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      applyFilters();
    });

    document.getElementById('typeChips').addEventListener('click', e => {
      const btn = e.target.closest('.chip[data-type]');
      if (!btn) return;
      document.querySelectorAll('#typeChips .chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.type;
      drawRouteRow();
      applyFilters();
    });

    document.getElementById('countryFilter').addEventListener('change', applyFilters);
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });

    initNav();
    loadBusinesses();
  </script>
  <script src="/chat-widget.js" defer></script></body>
  </html>
