<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Profile — IdeaHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24;
    --border: rgba(255,255,255,0.08); --accent: #f5c842;
    --accent-dim: rgba(245,200,66,0.12); --text: #f0ede8;
    --muted: #6e6b65; --success: #6ee7b7;
  }
  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); }
  .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.9rem; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }
  .logo-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-left: auto; }

  .main { max-width: 800px; margin: 0 auto; padding: 2rem; }

  .profile-hero { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; }
  .big-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--accent-dim); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: var(--accent); flex-shrink: 0; overflow: hidden; }
  .big-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .hero-info { flex: 1; }
  .hero-name { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .hero-role { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .hero-tagline { font-size: 14px; color: var(--muted); }
  .hero-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .verified-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(110,231,183,0.1); border: 1px solid rgba(110,231,183,0.3); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--success); margin-top: 8px; }

  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .section-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }

  .spec-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .spec-tag { background: var(--accent-dim); border: 1px solid rgba(245,200,66,0.2); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--accent); }

  .idea-list { display: flex; flex-direction: column; gap: 10px; }
  .idea-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; text-decoration: none; transition: border-color 0.2s; }
  .idea-item:hover { border-color: var(--accent); }
  .idea-item-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .idea-item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .idea-price { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--accent); }

  .empty { color: var(--muted); font-size: 14px; }

  .msg-btn { width: 100%; background: var(--accent); color: #0d0d0f; border: none; border-radius: 10px; padding: 0.85rem; font-size: 15px; font-weight: 600; font-family: 'Syne', sans-serif; cursor: pointer; margin-top: 1rem; transition: opacity 0.2s; }
  .msg-btn:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" onclick="history.back()">← Back</a>
  <span class="logo-text"><a href="/" style="text-decoration:none;color:inherit;">IdeaHub</a></span>
</div>

<div class="main">
  <div id="profileContent">
    <div style="text-align:center;padding:3rem;color:var(--muted)">Loading profile...</div>
  </div>
</div>

<script>
  const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

  // ── SHARED SIDEBAR NAV ──
  function renderSidebar() {
    const path = window.location.pathname;
    const nav = document.querySelector('.nav');
    if (!nav) return;
    const newIdeaBtn = document.getElementById('newIdeaBtn');
    if (newIdeaBtn && user && ['idea_creator','patent_seller'].includes(user.role)) newIdeaBtn.style.display = 'block';
    nav.innerHTML = `
      <div class="nav-section-label">My Account</div>
      <a class="nav-item ${path === '/dashboard' || path === '/buyer-dashboard' || path === '/business-dashboard' || path === '/support-dashboard' ? 'active' : ''}" href="${user && ['investor','corporate_services'].includes(user.role) ? '/buyer-dashboard' : user && ['virtual_manager','patent_attorney'].includes(user.role) ? '/support-dashboard' : user && user.role === 'business_owner' ? '/business-dashboard' : '/dashboard'}"><span class="nav-icon">⚡</span><span>Dashboard</span></a>
      <a class="nav-item ${path === '/profile' ? 'active' : ''}" href="/profile"><span class="nav-icon">👤</span><span>My Profile</span></a>
      <div class="nav-section-label">Marketplace</div>
      <a class="nav-item ${path === '/browse' ? 'active' : ''}" href="/browse"><span class="nav-icon">🔍</span><span>Marketplace</span></a>
      <a class="nav-item ${path === '/idea-requests' ? 'active' : ''}" href="/idea-requests"><span class="nav-icon">🎯</span><span>Request an Idea</span></a>
      <div class="nav-section-label">Support</div>
      <a class="nav-item" href="/find-support?type=patent_attorney"><span class="nav-icon">⚖️</span><span>Find an Attorney</span></a>
      <a class="nav-item" href="/find-support?type=virtual_manager"><span class="nav-icon">🧑‍💼</span><span>Virtual Manager</span></a>
      <a class="nav-item ${path === '/find-support' ? 'active' : ''}" href="/find-support"><span class="nav-icon">🤝</span><span>Support Services</span></a>
      <div class="nav-section-label">Activity</div>
      <a class="nav-item ${path === '/messages' ? 'active' : ''}" href="/messages"><span class="nav-icon">💬</span><span>Messages</span></a>
      <a class="nav-item ${path === '/transactions' ? 'active' : ''}" href="/transactions"><span class="nav-icon">💰</span><span>Wallet</span></a>
    `;
  }
  renderSidebar();
  const userId = new URLSearchParams(window.location.search).get('id');

  if (!userId) window.location.href = '/';

  fetch(`${API_URL}/api/users/${userId}/public`)
    .then(r => r.json())
    .then(user => {
      const initials = ((user.first_name?.[0] || '') + (user.last_name?.[0] || '')).toUpperCase() || '?';
      const joinYear = new Date(user.created_at).getFullYear();
      const roleLabel = (user.role || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

      const specs = user.specializations || [];
      const ideas = user.ideas || [];

      const currentUser = JSON.parse(localStorage.getItem('ih_user') || 'null');
      const isOwnProfile = currentUser && String(currentUser.id) === String(userId);

      document.getElementById('profileContent').innerHTML = `
        <div class="profile-hero">
          <div class="big-avatar">
            ${user.avatar_url ? `<img src="${user.avatar_url}" alt="avatar" />` : initials}
          </div>
          <div class="hero-info">
            <div class="hero-name">${user.first_name || ''} ${user.last_name || ''}</div>
            <div class="hero-role">${roleLabel}</div>
            ${user.tagline ? `<div class="hero-tagline">"${user.tagline}"</div>` : ''}
            <div class="hero-meta">📍 ${[user.city, user.state, user.country].filter(Boolean).join(', ') || 'Location not set'} &nbsp;·&nbsp; Member since ${joinYear}</div>
            <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
              ${user.is_verified ? '<div class="verified-badge">✅ Verified User</div>' : '<div style="display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)">⏳ Unverified</div>'}
              ${user.expert_area ? `<div style="display:inline-flex;align-items:center;gap:4px;background:var(--accent-dim);border:1px solid rgba(245,200,66,0.2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--accent)">🎯 ${user.expert_area}</div>` : ''}
              ${user.qualification ? `<div style="display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)">🎓 ${user.qualification}</div>` : ''}
            </div>
          </div>
        </div>

        ${specs.length > 0 ? `
        <div class="section">
          <div class="section-title">🎯 Specializations</div>
          <div class="spec-grid">
            ${specs.map(s => `<span class="spec-tag">${s.specialization}</span>`).join('')}
          </div>
        </div>` : ''}

        <div class="section">
          <div class="section-title">💡 Listed Ideas (${ideas.length})</div>
          ${ideas.length === 0 ? '<div class="empty">No public ideas yet.</div>' : `
          <div class="idea-list">
            ${ideas.map(i => `
              <a class="idea-item" href="/idea?id=${i.id}">
                <div>
                  <div class="idea-item-title">${i.title}</div>
                  <div class="idea-item-meta">👁 ${i.views || 0} views</div>
                </div>
                <div class="idea-price">$${parseInt(i.price).toLocaleString()}</div>
              </a>
            `).join('')}
          </div>`}
        </div>

        ${!isOwnProfile ? `
        <button class="msg-btn" onclick="window.location.href='/messages'">💬 Message ${user.first_name || 'Creator'}</button>
        ` : ''}
      `;
    })
    .catch(() => {
      document.getElementById('profileContent').innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted)">Profile not found.</div>';
    });
</script>
</body>
</html>
