<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Listings — Picela</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site.css" />
<link rel="stylesheet" href="/patents.css" />
<style>
.top { margin: 0.75rem 0 1.25rem; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.top h1 { font-size: 28px; line-height: 1.25; margin: 8px 0 6px; }
.app-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.15rem; margin-bottom: 10px; }
.app-row h3 { font-size: 16px; margin-bottom: 4px; overflow-wrap: anywhere; }
.app-row h3 a { color: inherit; text-decoration: none; }
.app-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.log div { font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--border); }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .top h1 { font-size: 23px; } .app-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header id="siteNav"></header><script src="/site-nav.js"></script>
<main class="wrap"><div id="root"><div class="loading">Loading…</div></div></main>

<script>
  const token = (() => { try { return localStorage.getItem('ih_token'); } catch (e) { return null; } })();
  if (!token) location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
  const H = () => ({ Authorization: 'Bearer ' + token });
  const owner = parseInt(new URLSearchParams(location.search).get('owner'), 10);
  const $ = x => document.getElementById(x);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  const day = d => d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const when = d => new Date(d).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  const money = n => n ? '$' + Number(n).toLocaleString('en-US') : '';
  const STATUS = { active: 'Live', under_review: 'Under review', draft: 'Draft', rejected: 'Not approved', sold: 'Sold' };

  async function main() {
    if (!owner) return clients();
    const r = await fetch(`/api/delegations/owner/${owner}/ideas`, { headers: H() });
    if (!r.ok) { $('root').innerHTML = `<div class="empty"><div class="icon"></div>You don't have access to manage this person's listings. They may have removed it.<br><a class="btn btn-ghost btn-sm" style="margin-top:1rem" href="/manage">Your clients</a></div>`; return; }
    const d = await r.json();
    const del = await fetch('/api/delegations', { headers: H() }).then(x => x.ok ? x.json() : { managing: [] }).catch(() => ({ managing: [] }));
    const mine = (del.managing || []).find(m => m.user_id === owner);
    const log = mine ? await fetch(`/api/delegations/${mine.id}/log`, { headers: H() }).then(x => x.ok ? x.json() : []).catch(() => []) : [];
    document.title = `${d.owner.name}'s listings — Picela`;
    $('root').innerHTML = `
      <div class="top"><div><a href="/manage" class="muted" style="font-size:13px;text-decoration:none">← Your clients</a>
        <h1>${esc(d.owner.name)}'s listings</h1>
        <div class="muted" style="font-size:13.5px">You can add and edit listings for this client. Each change is logged and they're notified.</div></div>
        <a class="btn btn-gold" href="/submit?for=${owner}">+ New listing for ${esc(d.owner.name.split(' ')[0])}</a></div>
      <div class="grid"><div>
        ${d.ideas.length ? d.ideas.map(i => `<div class="app-row"><div><h3><a href="/idea?id=${Number(i.id)}">${esc(i.title)}</a></h3>
          <div class="app-meta"><span>${esc(STATUS[i.status] || i.status || '')}</span>${i.price ? `<span>${money(i.price)}</span>` : ''}<span>${Number(i.views || 0)} views</span><span>Added ${day(i.created_at)}</span></div></div>
          <a class="btn btn-ghost btn-sm" href="/submit?edit=${Number(i.id)}&for=${owner}">Edit</a></div>`).join('')
          : '<div class="empty"><div class="icon"></div>No listings yet. Create the first one.</div>'}
      </div>
      <aside><div class="panel"><div class="panel-title">Your changes</div><div class="log">
        ${log.length ? log.slice(0, 15).map(x => `<div>${x.action === 'create' ? 'Added' : 'Edited'} ${esc(x.detail || 'a listing')}<br><span class="muted">${when(x.created_at)}</span></div>`).join('') : '<div class="muted" style="border:0">Nothing yet.</div>'}
      </div></div>
      <div class="note" style="font-size:12.5px">Listings are published under your client's name and go through the same quality and originality checks.</div></aside></div>`;
  }

  async function clients() {
    const d = await fetch('/api/delegations', { headers: H() }).then(x => x.ok ? x.json() : { managing: [] }).catch(() => ({ managing: [] }));
    const m = d.managing || [];
    $('root').innerHTML = `<div class="top"><div><div class="kicker">Virtual manager</div><h1>Clients whose listings you manage</h1></div></div>
      ${m.length ? m.map(c => `<div class="app-row"><div><h3>${esc(c.name)}</h3><div class="app-meta"><span>Access since ${day(c.since)}</span></div></div><a class="btn btn-gold btn-sm" href="/manage?owner=${Number(c.user_id)}">Open →</a></div>`).join('')
        : '<div class="empty"><div class="icon"></div>No clients yet. When a client hires you, they can give you listing access from the hire page.</div>'}`;
  }

  main().catch(() => { $('root').innerHTML = '<div class="empty">Could not load. Check your connection and refresh.</div>'; });
</script>
<script src="/chat-widget.js" defer></script>
</body>
</html>
