<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deal room — IdeaHub</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site.css" />
<link rel="stylesheet" href="/patents.css" />
<style>
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.top { margin: 0.75rem 0 1.25rem; }
.top h1 { font-size: 28px; line-height: 1.25; margin: 8px 0 10px; overflow-wrap: anywhere; }
.meta { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.meta a { color: var(--accent); text-decoration: none; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin: -0.4rem 0 1rem; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 0.7rem 0.9rem; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: -1px; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.tab.private.on { border-bottom-color: var(--purple); }
.chan-note { font-size: 12.5px; color: var(--muted); margin-bottom: .8rem; line-height: 1.5; }
.chan-note.private { color: #c4b5fd; }
.thread { display: flex; flex-direction: column; gap: 10px; min-height: 160px; max-height: 520px; overflow-y: auto; margin-bottom: 12px; }
.msg { max-width: 82%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.8rem; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent-dim); border-color: rgba(245,200,66,0.3); }
.msg.priv { border-color: rgba(167,139,250,0.35); }
.msg small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
.sys { align-self: center; font-size: 12px; color: var(--muted); text-align: center; max-width: 90%; }
.compose { display: flex; gap: 8px; }
.compose .textarea { min-height: 46px; height: 46px; }
.side-h { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; display: flex; justify-content: space-between; align-items: center; }
.side-h + .side-h, .pp + .side-h { margin-top: 1.1rem; }
.pp { display: flex; flex-direction: column; gap: 8px; }
.pp .person { justify-content: space-between; }
.pp .rm { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; }
.role-tag { font-size: 11px; border-radius: 999px; padding: 1px 8px; margin-left: 4px; background: var(--surface2); color: var(--soft); }
.role-tag.attorney { background: rgba(96,165,250,0.12); color: var(--blue); } .role-tag.accountant { background: rgba(45,212,191,0.12); color: #2dd4bf; }
.role-tag.pending { background: rgba(251,146,60,0.12); color: var(--orange); }
.flist { display: flex; flex-direction: column; gap: 6px; }
.frow { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.75rem; font-size: 13px; }
.frow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .lock { font-size: 11px; color: var(--purple); margin-left: 6px; }
.job { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: .8rem .9rem; font-size: 13.5px; }
.job + .job { margin-top: 8px; }
.job b { display: block; font-size: 14px; }
.job .sc { color: var(--muted); font-size: 12.5px; margin: 4px 0 8px; line-height: 1.5; white-space: pre-wrap; }
.job .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.job .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ov { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1100; display: none; align-items: flex-start; justify-content: center; padding: 8vh 1rem; overflow-y: auto; }
.ov.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; max-width: 520px; width: 100%; padding: 1.5rem; }
.modal h3 { font-size: 20px; margin-bottom: 6px; }
.modal p { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin-bottom: 12px; }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { background: none; border: 0; color: var(--muted); font-family: inherit; font-size: 13px; padding: 0.45rem 0.8rem; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #080809; font-weight: 700; }
.results { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; margin-top: 8px; }
.res { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: .55rem .7rem; cursor: pointer; text-align: left; color: var(--text); font-family: inherit; }
.res.on { border-color: var(--accent); background: var(--accent-dim); }
.res small { display: block; color: var(--muted); font-size: 12px; }
.list .app-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.15rem; text-decoration: none; margin-bottom: 10px; }
.list .app-row:hover { border-color: rgba(245,200,66,0.35); }
.list h3 { font-size: 16px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .top h1 { font-size: 23px; } .msg { max-width: 92%; } }
</style>
</head>
<body>
<header id="siteNav"></header><script src="/site-nav.js"></script>
<main class="wrap"><div id="root"><div class="loading">Loading…</div></div></main>

<div class="ov" id="invOv"><div class="modal">
  <h3>Invite an adviser to your side</h3>
  <p>They'll see this deal room and can talk privately with your side. Only you and the other party act on the deal itself.</p>
  <div class="seg" id="invMode"><button type="button" data-v="ideahub" class="on">IdeaHub professional</button><button type="button" data-v="email">By email</button></div>
  <div id="invHub"><input class="input" id="invQ" placeholder="Search attorneys, accountants…" /><div class="results" id="invRes"></div></div>
  <div id="invMail" class="hidden"><input class="input" id="invEmail" type="email" placeholder="adviser@firm.com" /></div>
  <div class="row2" style="margin-top:10px">
    <select class="select" id="invRole"><option value="attorney">Attorney</option><option value="accountant">Accountant</option><option value="virtual_manager">Virtual manager</option><option value="other">Other adviser</option></select>
    <input class="input" id="invLabel" maxlength="60" placeholder="Label (optional), e.g. Tax adviser" />
  </div>
  <div class="error-box hidden" id="invErr" style="margin-top:10px"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px"><button class="btn btn-ghost btn-sm" id="invCancel">Cancel</button><button class="btn btn-gold btn-sm" id="invSend">Send invitation</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
  const token = (() => { try { return localStorage.getItem('ih_token'); } catch (e) { return null; } })();
  const me = (() => { try { return JSON.parse(localStorage.getItem('ih_user') || 'null'); } catch (e) { return null; } })();
  if (!token) location.href = '/signup?next=' + encodeURIComponent(location.pathname + location.search);
  const H = () => ({ Authorization: 'Bearer ' + token });
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'), 10);
  const $ = x => document.getElementById(x);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  const money = n => '$' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const when = d => new Date(d).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }
  function initials(n) { return esc(String(n || '?').split(' ').map(w => w[0] || '').join('').slice(0, 2).toUpperCase()); }
  let R = null, chan = 'shared', busy = false, invPick = null, invMode = 'ideahub';

  async function api(path, body, method) {
    const r = await fetch(`/api/rooms${path}`, { method: method || 'POST', headers: { ...H(), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Something went wrong.');
    return d;
  }

  // ── List of my rooms ──
  async function renderList() {
    const rooms = await api('', null, 'GET').catch(() => []);
    $('root').innerHTML = `<div class="top"><div class="kicker">Deal rooms</div><h1>Your deal rooms</h1><p class="muted" style="font-size:14px;line-height:1.6;max-width:640px">A deal room brings both sides of a deal together with their own attorneys, accountants and other advisers. Each side also has a private channel.</p></div>
      <div class="list">${rooms.length ? rooms.map(r => `<a class="app-row" href="/deal-room?id=${Number(r.id)}"><div><h3>${esc(r.title)}</h3><div class="app-meta" style="font-size:12.5px;color:var(--muted);margin-top:4px">${r.kind === 'licence' ? 'Licence deal' : r.kind === 'business' ? 'Business expansion deal' : 'Listing deal'} · ${r.my_role === 'party' ? 'You are a party' : 'You are an adviser'}</div></div>
        <span class="pill ${r.my_status === 'invited' ? 'st-requested' : 'st-in_progress'}">${r.my_status === 'invited' ? 'Invitation' : 'Open'}</span></a>`).join('')
        : '<div class="empty"><div class="icon">🤝</div>No deal rooms yet. Open one from a listing or a licence deal.</div>'}</div>`;
  }

  // ── Invitation (not yet accepted) ──
  function renderInvitation(d) {
    $('root').innerHTML = `<div class="panel" style="max-width:560px;margin:2rem auto;text-align:center">
      <div style="font-size:40px">🤝</div><h2 style="margin:.6rem 0">You're invited to a deal room</h2>
      <p class="muted" style="font-size:14px;line-height:1.6">You've been asked to join <b style="color:var(--text)">"${esc(d.room?.title)}"</b> as ${esc(d.invitation.label || d.invitation.role_label)}.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:1.2rem"><button class="btn btn-gold" data-act="accept">Accept</button><button class="btn btn-ghost" data-act="decline-inv">Decline</button></div></div>`;
  }

  function personRow(p, d) {
    const canRemove = p.role !== 'party' && p.status !== 'removed' && ((d.me.role === 'party' && p.side === d.me.side) || p.user_id === me?.id);
    return `<div class="person"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="av">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : initials(p.name)}</div>
      <div style="min-width:0"><b>${esc(p.name)}${p.user_id === me?.id ? ' (you)' : ''}</b><small>${p.role === 'party' ? 'Party' : `<span class="role-tag ${esc(p.role)}">${esc(p.role_label)}</span>`}${p.status === 'invited' ? ' <span class="role-tag pending">Invited</span>' : ''}</small></div></div>
      ${canRemove ? `<button class="rm" data-rm="${p.id}">${p.user_id === me?.id ? 'Leave' : 'Remove'}</button>` : ''}</div>`;
  }

  function jobCard(j, d) {
    const iAmClient = j.client_id === me?.id, iAmAdviser = j.adviser_id === me?.id;
    const st = { quoted: 'Quote', in_progress: 'Paid, in progress', delivered: 'Delivered', completed: 'Completed', cancelled: 'Cancelled', disputed: 'Under review', refunded: 'Refunded' }[j.status] || j.status;
    let btns = '';
    if (j.status === 'quoted' && iAmClient) btns = d.payments_open ? `<button class="btn btn-gold btn-sm" data-job="${j.id}" data-a="pay">Accept and pay ${money(Number(j.amount) + Math.round(j.amount * d.fee_rate * 100) / 100)}</button><button class="btn btn-ghost btn-sm" data-job="${j.id}" data-a="decline">Decline</button>` : '<span class="muted" style="font-size:12px">Online payments launching soon</span>';
    if (j.status === 'quoted' && iAmAdviser) btns = `<button class="btn btn-ghost btn-sm" data-job="${j.id}" data-a="withdraw">Withdraw</button>`;
    if (j.status === 'in_progress' && iAmAdviser) btns = `<button class="btn btn-gold btn-sm" data-job="${j.id}" data-a="deliver">Mark delivered</button>`;
    if (j.status === 'in_progress' && iAmClient) btns = `<button class="btn btn-danger btn-sm" data-job="${j.id}" data-a="dispute">Report a problem</button>`;
    if (j.status === 'delivered' && iAmClient) btns = `<button class="btn btn-gold btn-sm" data-job="${j.id}" data-a="confirm">Confirm and release</button><button class="btn btn-danger btn-sm" data-job="${j.id}" data-a="dispute">Report a problem</button>`;
    return `<div class="job"><div class="row"><b>${esc(j.title)}</b><span class="pill ${j.status === 'completed' ? 'st-completed' : j.status === 'disputed' ? 'st-disputed' : j.status === 'quoted' ? 'st-quoted' : 'st-in_progress'}">${esc(st)}</span></div>
      <div class="sc">${esc(j.scope)}</div>
      <div class="row" style="font-size:12.5px;color:var(--muted)"><span>${esc(j.adviser_name)} → ${esc(j.client_name)}</span><span>${money(j.amount)} · ${Number(j.days)} days</span></div>
      ${j.delivery_note ? `<div class="sc" style="margin-top:6px">Delivery note: ${esc(j.delivery_note)}</div>` : ''}
      ${btns ? `<div class="btns">${btns}</div>` : ''}</div>`;
  }

  function render(d) {
    const priv = d.me.admin ? null : d.me.side;
    const sideName = s => d.side_names[s];
    const visible = d.messages.filter(m => chan === 'shared' ? m.channel === 'shared' : m.channel !== 'shared');
    const msgs = visible.map(m => m.system ? `<div class="sys">${esc(m.text)} · ${when(m.created_at)}</div>`
      : `<div class="msg ${m.from_id === me?.id ? 'me' : ''} ${m.channel !== 'shared' ? 'priv' : ''}">${esc(m.text)}<small>${esc(m.from)} · ${when(m.created_at)}</small></div>`).join('');
    const files = d.files.filter(f => chan === 'shared' ? f.channel === 'shared' : f.channel !== 'shared');
    const people = s => d.people.filter(p => p.side === s);
    const isParty = d.me.role === 'party', isAdviser = d.me.role && d.me.role !== 'party';
    $('root').innerHTML = `
      <div class="top"><a href="/deal-room" class="muted" style="font-size:13px;text-decoration:none">← Deal rooms</a>
        <h1>${esc(d.room.title)}</h1>
        <div class="meta"><span class="pill st-in_progress">Deal room</span>${d.me.admin ? '<span>Admin view: all channels</span>' : `<span>You're on the <b style="color:var(--text)">${esc(sideName(d.me.side))}</b> side${isAdviser ? ' as an adviser' : ''}</span>`}<a href="${esc(d.deal.link)}">${esc(d.deal.label)} →</a></div></div>
      <div class="grid"><div>
        <div class="panel">
          <div class="tabs"><button class="tab ${chan === 'shared' ? 'on' : ''}" data-chan="shared">Everyone</button>${priv ? `<button class="tab private ${chan !== 'shared' ? 'on' : ''}" data-chan="side">🔒 ${esc(sideName(priv))} side only</button>` : d.me.admin ? `<button class="tab private ${chan !== 'shared' ? 'on' : ''}" data-chan="side">🔒 Private channels</button>` : ''}</div>
          <div class="chan-note ${chan !== 'shared' ? 'private' : ''}">${chan === 'shared' ? 'Everyone in the room sees this: both sides and all advisers.' : d.me.admin ? 'Both sides\' private channels.' : `Only you and your side's advisers see this. ${esc(sideName(priv === 'a' ? 'b' : 'a'))} and their advisers never do.`}</div>
          <div class="thread" id="thread">${msgs || '<div class="sys">No messages yet.</div>'}</div>
          ${d.me.admin ? '' : `<div class="compose"><textarea class="textarea" id="msgIn" placeholder="${chan === 'shared' ? 'Message everyone…' : 'Private message to your side…'}" maxlength="4000"></textarea><button class="btn btn-gold" id="sendBtn">Send</button></div>`}
        </div>
        <div class="panel"><div class="panel-title">Files ${chan === 'shared' ? '(everyone)' : '(private)'} ${d.me.admin ? '' : `<label class="btn btn-ghost btn-sm" for="fileIn" style="text-transform:none;letter-spacing:0">📎 Add file</label><input type="file" id="fileIn" class="hidden" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,image/*" />`}</div>
          <div class="flist">${files.length ? files.map(f => `<div class="frow"><span class="nm">📄 ${esc(f.name)}${f.channel !== 'shared' ? '<span class="lock">🔒 private</span>' : ''} <span class="muted" style="font-size:11.5px">· ${esc(f.uploaded_by)}</span></span><button class="btn btn-ghost btn-sm" data-file="${f.index}">Open</button></div>`).join('') : '<div class="muted" style="font-size:13px">No files here yet.</div>'}</div></div>
        ${!d.me.admin ? `<div class="panel"><div class="panel-title">Adviser work (your side, private)</div>
          ${d.jobs.length ? d.jobs.map(j => jobCard(j, d)).join('') : `<div class="muted" style="font-size:13px;line-height:1.6">${isAdviser ? 'Send your client a fixed quote. They pay into IdeaHub escrow, and the fee is released when they confirm your work.' : 'Your advisers can send you fixed quotes here. You pay into escrow and release the fee when the work is done.'}</div>`}
          ${isAdviser ? `<details style="margin-top:1rem"><summary class="btn btn-gold btn-sm" style="list-style:none;display:inline-flex">+ Send a quote to your client</summary>
            <div style="margin-top:.9rem"><div class="field"><label for="jTitle">Work</label><input class="input" id="jTitle" maxlength="120" placeholder="e.g. Draft and negotiate the licence agreement" /></div>
            <div class="field"><label for="jScope">What the fee covers</label><textarea class="textarea" id="jScope" style="min-height:80px"></textarea></div>
            <div class="row2"><div class="field"><label for="jAmt">Fee (USD)</label><input class="input" id="jAmt" type="number" min="1" /></div><div class="field"><label for="jDays">Days</label><input class="input" id="jDays" type="number" min="1" max="365" /></div></div>
            <p class="muted" style="font-size:12px;margin-bottom:8px">IdeaHub adds 8% on top, paid by your client. You receive your full fee.</p>
            <button class="btn btn-gold btn-sm" data-act="quote">Send quote</button></div></details>` : ''}
        </div>` : ''}
      </div>
      <aside class="side">
        <div class="panel">
          <div class="side-h">${esc(sideName('a'))} side ${isParty && d.me.side === 'a' ? '<button class="btn btn-ghost btn-sm" data-act="invite">+ Adviser</button>' : ''}</div>
          <div class="pp">${people('a').map(p => personRow(p, d)).join('')}</div>
          <div class="side-h">${esc(sideName('b'))} side ${isParty && d.me.side === 'b' ? '<button class="btn btn-ghost btn-sm" data-act="invite">+ Adviser</button>' : ''}</div>
          <div class="pp">${people('b').map(p => personRow(p, d)).join('')}</div>
          ${d.me.admin ? '' : `<a class="btn btn-ghost btn-sm" style="width:100%;margin-top:14px" href="/call?type=room&id=${d.room.id}" target="_blank" rel="noopener">📹 Start a video call with the room</a>`}
        </div>
        <div class="note" style="font-size:12.5px">Advisers can talk, share files and join calls. Only the two parties act on the deal itself. IdeaHub hosts the room but is not a party to the deal or to any adviser's work.</div>
      </aside></div>`;
    const t = $('thread'); if (t) t.scrollTop = t.scrollHeight;
  }

  async function load() {
    try {
      const r = await fetch(`/api/rooms/${id}`, { headers: H() });
      if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
      const d = await r.json();
      if (!r.ok) { $('root').innerHTML = `<div class="empty"><div class="icon">🔒</div>${esc(d.error || 'Not found')}<br><a class="btn btn-ghost btn-sm" style="margin-top:1rem" href="/deal-room">Your deal rooms</a></div>`; return; }
      if (d.invitation) return renderInvitation(d);
      const keep = {}; ['msgIn', 'jTitle', 'jScope', 'jAmt', 'jDays'].forEach(k => { const el = $(k); if (el && el.value) keep[k] = el.value; });
      R = d; document.title = `${d.room.title} — Deal room — IdeaHub`; render(d);
      Object.entries(keep).forEach(([k, v]) => { const el = $(k); if (el) el.value = v; });
    } catch (e) { $('root').innerHTML = '<div class="empty">Could not load. Check your connection and refresh.</div>'; }
  }

  // Invite modal
  async function searchAdvisers() {
    const q = $('invQ').value.trim();
    const list = await api('/advisers/search?q=' + encodeURIComponent(q), null, 'GET').catch(() => []);
    $('invRes').innerHTML = list.length ? list.map(a => `<button type="button" class="res ${invPick?.id === a.id ? 'on' : ''}" data-uid="${a.id}" data-role="${esc(a.role)}"><div class="av">${a.avatar_url ? `<img src="${esc(a.avatar_url)}" alt="">` : initials(a.name)}</div><div><b>${esc(a.name)}</b><small>${esc(a.role_label)}${a.country ? ' · ' + esc(a.country) : ''}${a.tagline ? ' · ' + esc(a.tagline) : ''}</small></div></button>`).join('') : '<div class="muted" style="font-size:13px">No professionals found. Invite them by email instead.</div>';
  }
  let sTimer; $('invQ').addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(searchAdvisers, 250); });
  $('invRes').addEventListener('click', e => { const b = e.target.closest('[data-uid]'); if (!b) return; invPick = { id: +b.dataset.uid }; $('invRole').value = b.dataset.role; document.querySelectorAll('#invRes .res').forEach(x => x.classList.toggle('on', x === b)); });
  $('invMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; invMode = b.dataset.v; $('invMode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('invHub').classList.toggle('hidden', invMode !== 'ideahub'); $('invMail').classList.toggle('hidden', invMode !== 'email'); });
  $('invCancel').onclick = () => $('invOv').classList.remove('open');
  $('invSend').onclick = async () => {
    $('invErr').classList.add('hidden');
    try {
      await api(`/${id}/invite`, { user_id: invMode === 'ideahub' ? invPick?.id : undefined, email: invMode === 'email' ? $('invEmail').value : undefined, role: $('invRole').value, label: $('invLabel').value });
      $('invOv').classList.remove('open'); toast('Invitation sent.'); load();
    } catch (err) { $('invErr').textContent = err.message; $('invErr').classList.remove('hidden'); }
  };

  document.addEventListener('change', async e => {
    if (e.target.id !== 'fileIn' || !e.target.files[0]) return;
    const f = e.target.files[0]; if (f.size > 10 * 1048576) return toast('Files must be 10 MB or smaller.');
    const fd = new FormData(); fd.append('channel', chan === 'shared' ? 'shared' : 'side'); fd.append('file', f); toast('Uploading…');
    const r = await fetch(`/api/rooms/${id}/files`, { method: 'POST', headers: H(), body: fd });
    const d = await r.json().catch(() => ({})); if (!r.ok) return toast(d.error || 'Upload failed.');
    toast('File added.'); load();
  });

  document.addEventListener('click', async e => {
    const tab = e.target.closest('[data-chan]'); if (tab) { chan = tab.dataset.chan; render(R); return; }
    const f = e.target.closest('[data-file]');
    if (f) { const w = window.open('', '_blank'); try { const d = await api(`/${id}/files/${f.dataset.file}`, null, 'GET'); if (w) w.location = d.url; else location.href = d.url; } catch (err) { if (w) w.close(); toast(err.message); } return; }
    if (e.target.id === 'sendBtn') {
      const box = $('msgIn'), text = box.value.trim(); if (!text || busy) return;
      busy = true; try { await api(`/${id}/messages`, { text, channel: chan === 'shared' ? 'shared' : 'side' }); box.value = ''; await load(); } catch (err) { toast(err.message); } busy = false; return;
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) { if (!confirm(rm.textContent === 'Leave' ? 'Leave this deal room?' : 'Remove this adviser from your side?')) return; try { await api(`/${id}/members/${rm.dataset.rm}/remove`); if (rm.textContent === 'Leave') { location.href = '/deal-room'; return; } load(); } catch (err) { toast(err.message); } return; }
    const jb = e.target.closest('[data-job]');
    if (jb) {
      const a = jb.dataset.a; let body = {};
      if (a === 'dispute') { const reason = prompt('What went wrong? IdeaHub will review it. The fee stays in escrow.'); if (!reason) return; body = { reason }; }
      if (a === 'deliver') { const note = prompt('Optional note for your client (e.g. where the documents are):', ''); if (note === null) return; body = { note }; }
      if (a === 'confirm' && !confirm('Confirm the work is done and release the fee? This cannot be undone.')) return;
      try { await api(`/${id}/jobs/${jb.dataset.job}/${a}`, body); toast('Done.'); load(); } catch (err) { toast(err.message); }
      return;
    }
    const b = e.target.closest('[data-act]'); if (!b || busy) return;
    const act = b.dataset.act;
    try {
      if (act === 'accept') { await api(`/${id}/accept`, {}); toast('Welcome to the deal room.'); load(); }
      else if (act === 'decline-inv') { await api(`/${id}/decline-invite`, {}); location.href = '/deal-room'; }
      else if (act === 'invite') { invPick = null; $('invQ').value = ''; $('invEmail').value = ''; $('invLabel').value = ''; $('invErr').classList.add('hidden'); $('invOv').classList.add('open'); searchAdvisers(); }
      else if (act === 'quote') { await api(`/${id}/jobs`, { title: $('jTitle').value, scope: $('jScope').value, amount: $('jAmt').value, days: $('jDays').value }); $('jTitle').value = $('jScope').value = $('jAmt').value = $('jDays').value = ''; toast('Quote sent to your client.'); load(); }
    } catch (err) { toast(err.message); }
  });

  (async () => {
    if (!id) return renderList();
    const inv = params.get('invite');
    if (inv) {
      try { await api(`/${id}/accept`, { token: inv }); toast('You joined the deal room.'); }
      catch (e) { toast(e.message); }
      history.replaceState(null, '', location.pathname + '?id=' + id);
    }
    load();
    setInterval(() => { if (!document.hidden && !$('invOv').classList.contains('open') && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) load(); }, 20000);
  })();
</script>
<script src="/chat-widget.js" defer></script>
</body>
</html>
