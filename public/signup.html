<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Picela — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24;
    --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.18);
    --accent: #f5c842; --accent-dim: rgba(245,200,66,0.12);
    --text: #f0ede8; --muted: #6e6b65; --error: #ff6b6b; --success: #6ee7b7;
  }
  body {
    background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem 1rem; position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: -30%; right: -20%; width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(245,200,66,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: ''; position: fixed; bottom: -30%; left: -20%; width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(110,231,183,0.04) 0%, transparent 70%);
    pointer-events: none;
  }
  .grid-bg {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    padding: 2.5rem 2.5rem 2rem; width: 100%; max-width: 520px;
    position: relative; animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
  .logo-icon { width: 36px; height: 36px; background:#1d1d22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 30px; height: 30px; fill: #0d0d0f; }
  .logo-text { font-family: 'Cabinet Grotesk', sans-serif; font-size: 20px; font-weight: 700; }
  h1 { font-family: 'Cabinet Grotesk', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.3rem; }
  .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 1.75rem; }
  .field { margin-bottom: 1rem; }
  label.field-label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.4px; text-transform: uppercase; }
  input {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.75rem 1rem; font-size: 15px;
    font-family: 'DM Sans', sans-serif; color: var(--text); outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  input:focus { border-color: var(--accent); background: var(--accent-dim); }
  input::placeholder { color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .password-wrap { position: relative; }
  .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex; align-items: center; transition: color 0.2s; }
  .toggle-pw:hover { color: var(--text); }

  /* ROLE CARDS */
  .role-section-label { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.4px; }
  .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .role-card {
    border: 1px solid var(--border); border-radius: 14px; padding: 1rem 0.75rem;
    cursor: pointer; transition: all 0.2s; text-align: center; position: relative; overflow: hidden;
  }
  .role-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  .role-card input[type=radio] { display: none; }
  .role-check {
    position: absolute; top: 7px; right: 7px; width: 16px; height: 16px;
    background: var(--accent); border-radius: 50%; display: flex; align-items: center;
    justify-content: center; opacity: 0; transition: opacity 0.2s;
    font-size: 9px; color: #0d0d0f; font-weight: 700;
  }
  .role-card.selected .role-check { opacity: 1; }
  .role-emoji { display: block; margin-bottom: 0.5rem; color: var(--accent, #f5c842); }
  .role-name { font-size: 12px; font-weight: 600; display: block; color: var(--text); line-height: 1.3; }
  .role-desc { font-size: 10px; color: var(--muted); display: block; margin-top: 3px; }

  /* per-role colors */
  .role-card[data-role="idea_creator"].selected    { border-color:#f5c842; background:rgba(245,200,66,0.1); }
  .role-card[data-role="idea_creator"].selected .role-check { background:#f5c842; }
  .role-card[data-role="investor"].selected         { border-color:#6ee7b7; background:rgba(110,231,183,0.1); }
  .role-card[data-role="investor"].selected .role-check { background:#6ee7b7; }
  .role-card[data-role="virtual_manager"].selected  { border-color:#a78bfa; background:rgba(167,139,250,0.1); }
  .role-card[data-role="virtual_manager"].selected .role-check { background:#a78bfa; }
  .role-card[data-role="patent_attorney"].selected  { border-color:#60a5fa; background:rgba(96,165,250,0.1); }
  .role-card[data-role="patent_attorney"].selected .role-check { background:#60a5fa; }
  .role-card[data-role="chartered_accountant"].selected { border-color:#2dd4bf; background:rgba(45,212,191,0.1); }
  .role-card[data-role="chartered_accountant"].selected .role-check { background:#2dd4bf; }
  .role-card[data-role="patent_seller"].selected    { border-color:#fb923c; background:rgba(251,146,60,0.1); }
  .role-card[data-role="patent_seller"].selected .role-check { background:#fb923c; }
  .role-card[data-role="corporate_services"].selected { border-color:#f472b6; background:rgba(244,114,182,0.1); }
  .role-card[data-role="corporate_services"].selected .role-check { background:#f472b6; }
  .role-card[data-role="business_owner"].selected { border-color:#fb923c; background:rgba(251,146,60,0.1); }
  .role-card[data-role="business_owner"].selected .role-check { background:#fb923c; }

  .error-msg { background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3); border-radius:8px; padding:0.6rem 0.9rem; font-size:13px; color:var(--error); margin-bottom:1rem; display:none; }
  .error-msg.show { display:block; }
  .success-msg { background:rgba(110,231,183,0.1); border:1px solid rgba(110,231,183,0.3); border-radius:8px; padding:0.6rem 0.9rem; font-size:13px; color:var(--success); margin-bottom:1rem; text-align:center; display:none; }
  .success-msg.show { display:block; }

  .btn {
    width:100%; background:var(--accent); color:#0d0d0f; border:none; border-radius:10px;
    padding:0.9rem; font-size:15px; font-weight:700; font-family:'Cabinet Grotesk',sans-serif;
    cursor:pointer; margin-top:0.25rem; transition:opacity 0.2s, transform 0.15s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover { opacity:0.9; transform:translateY(-1px); }
  .btn:active { transform:scale(0.98); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .spinner { width:16px; height:16px; border:2px solid rgba(0,0,0,0.2); border-top-color:#0d0d0f; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .terms { font-size:12px; color:var(--muted); text-align:center; margin-top:1rem; line-height:1.5; }
  .terms a { color:var(--muted); text-decoration:underline; }
  .divider { display:flex; align-items:center; gap:12px; margin:1.25rem 0 1rem; color:var(--muted); font-size:12px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
  .login-link { text-align:center; font-size:14px; color:var(--muted); }
  .login-link a { color:var(--accent); text-decoration:none; font-weight:500; }
  .login-link a:hover { text-decoration:underline; }

  @media (max-width: 480px) {
    .card { padding: 1.75rem 1.25rem 1.5rem; border-radius: 16px; }
    h1 { font-size: 22px; }
    .row { grid-template-columns: 1fr; gap: 0; }
    .role-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .role-emoji { font-size: 22px; }
    .role-name { font-size: 11px; }
    .role-desc { font-size: 9px; }
  }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<div class="grid-bg"></div>
<div class="card">
  <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;" class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 100 100"><path d="M31.4 38A24 24 0 0 1 76.6 38Z" fill="#f5c842"/><path d="M76.6 38A24 24 0 0 1 31.4 38Z" fill="#e8862a"/><path d="M31 38H77" stroke="#1d1d22" stroke-width="3" fill="none"/><rect x="24" y="14" width="16" height="76" rx="8" fill="#f0ede8"/></svg>
    </div>
    <span class="logo-text" style="display:inline-flex;flex-direction:column;line-height:1">Picela<small style="display:block;font:600 9.5px/1 'DM Sans',system-ui,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#f5c842;margin-top:4px">the idea hub</small></span>
  </a>

  <h1>Join Picela</h1>
  <p class="subtitle">Create your free account and start today</p>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg">Account created! Redirecting...</div>

  <div class="row">
    <div class="field">
      <label class="field-label">First name</label>
      <input type="text" id="firstName" placeholder="John" autocomplete="given-name" />
    </div>
    <div class="field">
      <label class="field-label">Last name</label>
      <input type="text" id="lastName" placeholder="Doe" autocomplete="family-name" />
    </div>
  </div>

  <div class="field">
    <label class="field-label">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
  </div>

  <div class="field">
    <label class="field-label">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="At least 8 characters" style="padding-right:42px;" autocomplete="new-password" />
      <button class="toggle-pw" id="togglePw" type="button" aria-label="Toggle password">
        <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="role-section-label">I am joining as</div>
  <div class="role-grid">
    <label class="role-card selected" data-role="idea_creator" onclick="selectRole(this)">
      <input type="radio" name="role" value="idea_creator" checked />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span>
      <span class="role-name">Idea Creator</span>
      <span class="role-desc">Post & sell ideas</span>
    </label>
    <label class="role-card" data-role="investor" onclick="selectRole(this)">
      <input type="radio" name="role" value="investor" />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>
      <span class="role-name">Investor</span>
      <span class="role-desc">Discover & fund</span>
    </label>
    <label class="role-card" data-role="virtual_manager" onclick="selectRole(this)">
      <input type="radio" name="role" value="virtual_manager" />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></span>
      <span class="role-name">Virtual Manager</span>
      <span class="role-desc">Manage & grow</span>
    </label>
    <label class="role-card" data-role="patent_attorney" onclick="selectRole(this)">
      <input type="radio" name="role" value="patent_attorney" />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M5 7h14"/><path d="m5 7-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg></span>
      <span class="role-name">Patent Attorney / Agent</span>
      <span class="role-desc">Patent filing &amp; advice</span>
    </label>
    <label class="role-card" data-role="chartered_accountant" onclick="selectRole(this)">
      <input type="radio" name="role" value="chartered_accountant" />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg></span>
      <span class="role-name">Chartered Accountant</span>
      <span class="role-desc">Finance & tax services</span>
    </label>
    <label class="role-card" data-role="patent_seller" onclick="selectRole(this)">
      <input type="radio" name="role" value="patent_seller" />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg></span>
      <span class="role-name">Patent Seller</span>
      <span class="role-desc">Sell patents</span>
    </label>
    <label class="role-card" data-role="corporate_services" onclick="selectRole(this)">
      <input type="radio" name="role" value="corporate_services" />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg></span>
      <span class="role-name">Company Secretary</span>
      <span class="role-desc">Company setup &amp; compliance</span>
    </label>
    <label class="role-card" data-role="business_owner" onclick="selectRole(this)">
      <input type="radio" name="role" value="business_owner" />
      <div class="role-check">✓</div>
      <span class="role-emoji"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18M9 20v-6h6v6"/></svg></span>
      <span class="role-name">Business Owner</span>
      <span class="role-desc">Expand your business</span>
    </label>
  </div>

  <a href="/auth/google" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#0d0d0f;border:none;border-radius:10px;padding:0.85rem;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;margin-bottom:0.75rem;">
    <img src="https://www.google.com/favicon.ico" width="18" height="18" /> Continue with Google
  </a>

  <div class="divider">or</div>

  <div class="cf-turnstile" data-sitekey="0x4AAAAAAFE9paUQCecOa3fg" data-theme="dark" style="display:flex;justify-content:center;margin-bottom:0.75rem;"></div>

  <button class="btn" id="signupBtn" onclick="handleSignup()">
    <div class="spinner" id="spinner"></div>
    <span id="btnText">Create account</span>
  </button>

  <p class="terms">By signing up you agree to our <a href="/terms">Terms of Service</a>, <a href="/privacy">Privacy Policy</a> and <a href="/cookies">Cookie Policy</a></p>
  <div class="divider">or</div>
  <div class="login-link">Already have an account? <a href="/login">Sign in</a></div>
</div>

<script>
  function selectRole(el) {
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input[type=radio]').checked = true;
  }

  const togglePw = document.getElementById('togglePw');
  let pwVisible = false;
  togglePw.addEventListener('click', () => {
    pwVisible = !pwVisible;
    document.getElementById('password').type = pwVisible ? 'text' : 'password';
    document.getElementById('eyeIcon').innerHTML = pwVisible
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  const CREATOR_ROLES = ['idea_creator', 'patent_seller'];
      const BUSINESS_ROLES = ['business_owner'];

  async function handleSignup() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    // Auto-select role from URL param
    const urlRole = new URLSearchParams(window.location.search).get('role');
    if (urlRole) {
      document.querySelectorAll('.role-card').forEach(c => {
        c.classList.remove('selected');
        if (c.dataset.role === urlRole) {
          c.classList.add('selected');
          c.querySelector('input[type=radio]').checked = true;
        }
      });
    }

    // Read selected role
    const selectedCard = document.querySelector('.role-card.selected');
    const role = selectedCard ? selectedCard.dataset.role : null;

    if (!role) { errorMsg.textContent = 'Please select a role.'; errorMsg.classList.add('show'); return; }

    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');

    if (!firstName) { errorMsg.textContent = 'Please enter your first name.'; errorMsg.classList.add('show'); return; }
    if (!email) { errorMsg.textContent = 'Please enter your email.'; errorMsg.classList.add('show'); return; }
    if (!password || password.length < 8) { errorMsg.textContent = 'Password must be at least 8 characters.'; errorMsg.classList.add('show'); return; }

    const btn = document.getElementById('signupBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled = true; spinner.style.display = 'block'; btnText.textContent = 'Creating account...';

    try {
      const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

  
      const res = await fetch(`${API_URL}/api/auth/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName, lastName, email, password, role, turnstileToken: document.querySelector('[name="cf-turnstile-response"]')?.value || '' }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Signup failed');

      localStorage.setItem('ih_token', data.token);
      localStorage.setItem('ih_user', JSON.stringify(data.user));

      successMsg.classList.add('show');
      btnText.textContent = 'Success!';

      const dashMap = {
        idea_creator: '/dashboard',
        patent_seller: '/dashboard',
        investor: '/buyer-dashboard',
        corporate_services: '/support-dashboard',
        virtual_manager: '/support-dashboard', chartered_accountant:'/support-dashboard',
        patent_attorney: '/support-dashboard',
        business_owner: '/business-dashboard',
        admin: '/admin'
      };
      setTimeout(() => {
        const next = new URLSearchParams(location.search).get('next') || '';
        window.location.href = /^\/(?![\/\\])/.test(next) ? next : (dashMap[role] || '/dashboard');
      }, 1000);

    } catch (err) {
      errorMsg.textContent = err.message || 'Something went wrong.';
      if (window.turnstile) turnstile.reset();
      errorMsg.classList.add('show');
      btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Create account';
    }
  }
</script>
<script src="/chat-widget.js" defer></script></body>
</html>
