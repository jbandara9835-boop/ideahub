<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request — IdeaHub</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c;
      --border:#2a2a2a; --gold:#f5c518; --gold-dim:#c49a10;
      --text:#f0f0f0; --muted:#888; --radius:12px;
      --green:#4ade80; --blue:#60a5fa; --purple:#a78bfa; --error:#ff6b6b;
    }
    body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }

    /* NAV */
    .topnav { position:sticky; top:0; z-index:100; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 32px; height:60px; display:flex; align-items:center; gap:16px; }
    .nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-size:1.15rem; font-weight:700; flex-shrink:0; }
    .nav-logo .logo-icon { width:32px; height:32px; background:var(--gold); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .nav-right { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .nav-right a { color:var(--muted); text-decoration:none; font-size:0.875rem; padding:6px 14px; border-radius:6px; transition:color 0.2s; }
    .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:0.875rem; padding:6px 14px; border:1px solid var(--border); border-radius:6px; transition:all 0.2s; }
    .back-link:hover { border-color:var(--gold); color:var(--text); }
    .nav-avatar { width:34px; height:34px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; color:#000; overflow:hidden; text-decoration:none; flex-shrink:0; }
    .nav-avatar img { width:100%; height:100%; object-fit:cover; }
    .btn-gold { background:var(--gold) !important; color:#000 !important; font-weight:600 !important; border-radius:6px; }
    .btn-outline { border:1px solid var(--border) !important; color:var(--text) !important; border-radius:6px; }
    .nav-user { display:none; align-items:center; gap:8px; }
    .nav-user.visible { display:flex; }

    /* LAYOUT */
    .main { max-width:1100px; margin:0 auto; padding:28px 32px; }
    .detail-grid { display:grid; grid-template-columns:1fr 340px; gap:24px; align-items:start; }

    /* CARDS */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
    .card-title { font-size:0.85rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }

    /* REQUEST HEADER */
    .req-title { font-size:1.6rem; font-weight:800; line-height:1.3; margin-bottom:12px; }
    .meta-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .meta-pill { display:inline-flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:0.78rem; color:var(--muted); }
    .req-problem { font-size:0.9rem; line-height:1.8; color:var(--text); margin-bottom:14px; }
    .req-requirements { font-size:0.85rem; line-height:1.7; color:var(--muted); background:var(--surface2); border-radius:10px; padding:14px; border-left:3px solid var(--gold); }

    /* STATUS BADGES */
    .status-badge { display:inline-flex; align-items:center; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
    .s-open { background:rgba(74,222,128,0.15); color:var(--green); }
    .s-proposals_received { background:rgba(245,197,24,0.15); color:var(--gold); }
    .s-shortlisting { background:rgba(96,165,250,0.15); color:var(--blue); }
    .s-pitching { background:rgba(167,139,250,0.15); color:var(--purple); }
    .s-in_escrow { background:rgba(245,197,24,0.15); color:var(--gold); }
    .s-delivered { background:rgba(96,165,250,0.15); color:var(--blue); }
    .s-completed { background:rgba(74,222,128,0.15); color:var(--green); }
    .s-disputed { background:rgba(255,107,107,0.15); color:var(--error); }

    /* PROPOSALS */
    .proposal-item { padding:16px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; transition:border-color 0.2s; }
    .proposal-item:hover { border-color:#3a3a3a; }
    .proposal-item.shortlisted { border-color:rgba(245,197,24,0.4); background:rgba(245,197,24,0.04); }
    .proposal-item.selected { border-color:rgba(74,222,128,0.4); background:rgba(74,222,128,0.04); }
    .prop-header { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .prop-creator { display:flex; align-items:center; gap:10px; }
    .prop-av { width:36px; height:36px; border-radius:50%; background:rgba(245,197,24,0.12); border:1px solid rgba(245,197,24,0.25); display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:700; color:var(--gold); flex-shrink:0; }
    .prop-name { font-weight:600; font-size:0.875rem; }
    .prop-sub { font-size:0.75rem; color:var(--muted); margin-top:2px; }
    .prop-title { font-weight:600; font-size:0.9rem; margin-bottom:6px; }
    .prop-summary { font-size:0.82rem; color:var(--muted); line-height:1.6; margin-bottom:10px; }
    .prop-footer { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .prop-price { font-size:1rem; font-weight:800; color:var(--gold); }
    .prop-days { font-size:0.78rem; color:var(--muted); }
    .prop-actions { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
    .btn-sm { border-radius:6px; padding:5px 12px; font-size:0.75rem; cursor:pointer; border:1px solid; transition:all 0.15s; background:none; }
    .btn-shortlist { border-color:rgba(245,197,24,0.4); color:var(--gold); }
    .btn-shortlist:hover { background:var(--gold); color:#000; }
    .btn-invite { border-color:rgba(96,165,250,0.4); color:var(--blue); }
    .btn-invite:hover { background:rgba(96,165,250,0.15); }
    .btn-select { border-color:rgba(74,222,128,0.4); color:var(--green); }
    .btn-select:hover { background:rgba(74,222,128,0.15); }
    .btn-reject { border-color:rgba(255,107,107,0.3); color:var(--error); }
    .btn-reject:hover { background:rgba(255,107,107,0.1); }
    .btn-chat { border-color:var(--border); color:var(--text); }
    .btn-chat:hover { border-color:var(--gold); color:var(--gold); }

    /* CHAT */
    .chat-area { display:flex; flex-direction:column; height:360px; }
    .chat-msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .msg-bubble { max-width:75%; }
    .msg-bubble.me { align-self:flex-end; }
    .msg-bubble.them { align-self:flex-start; }
    .bubble { padding:8px 12px; border-radius:14px; font-size:0.85rem; line-height:1.5; word-break:break-word; }
    .me .bubble { background:var(--gold); color:#000; border-bottom-right-radius:4px; }
    .them .bubble { background:var(--surface2); color:var(--text); border-bottom-left-radius:4px; }
    .bubble-time { font-size:0.65rem; color:var(--muted); margin-top:3px; text-align:right; }
    .chat-input-row { padding:10px; border-top:1px solid var(--border); display:flex; gap:8px; }
    .chat-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 14px; font-size:0.875rem; color:var(--text); outline:none; }
    .chat-input:focus { border-color:var(--gold); }
    .chat-send { background:var(--gold); color:#000; border:none; border-radius:8px; padding:0 14px; cursor:pointer; font-size:1.1rem; }

    /* ESCROW */
    .escrow-box { background:rgba(245,197,24,0.08); border:1px solid rgba(245,197,24,0.25); border-radius:10px; padding:16px; margin-bottom:14px; }
    .escrow-amount { font-size:1.8rem; font-weight:800; color:var(--gold); margin-bottom:4px; }
    .escrow-note { font-size:0.8rem; color:var(--muted); }

    /* RIGHT SIDEBAR CARDS */
    .budget-display { font-size:1.8rem; font-weight:800; color:var(--gold); margin-bottom:4px; }
    .budget-sub { font-size:0.78rem; color:var(--muted); }

    /* FORM */
    .field { margin-bottom:14px; }
    .lbl { display:block; font-size:0.72rem; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
    input[type=text], input[type=number], textarea {
      width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      padding:10px 14px; font-size:0.875rem; color:var(--text); outline:none; transition:border-color 0.2s;
      font-family:inherit;
    }
    textarea { resize:vertical; min-height:80px; line-height:1.6; }
    input:focus, textarea:focus { border-color:var(--gold); }
    input::placeholder, textarea::placeholder { color:var(--muted); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn-primary { background:var(--gold); color:#000; border:none; border-radius:8px; padding:11px; font-size:0.875rem; font-weight:700; cursor:pointer; width:100%; transition:background 0.15s; }
    .btn-primary:hover { background:var(--gold-dim); }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-secondary { background:none; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:0.875rem; color:var(--text); cursor:pointer; width:100%; margin-top:8px; transition:border-color 0.2s; }
    .btn-secondary:hover { border-color:var(--gold); }

    /* ALERT BOXES */
    .info-box { border-radius:8px; padding:12px 14px; font-size:0.82rem; line-height:1.5; margin-bottom:12px; }
    .info-blue { background:rgba(96,165,250,0.1); border:1px solid rgba(96,165,250,0.3); color:var(--blue); }
    .info-green { background:rgba(74,222,128,0.1); border:1px solid rgba(74,222,128,0.3); color:var(--green); }
    .info-gold { background:rgba(245,197,24,0.1); border:1px solid rgba(245,197,24,0.3); color:var(--gold); }
    .info-red { background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3); color:var(--error); }

    .loading-page { display:flex; align-items:center; justify-content:center; min-height:60vh; gap:12px; color:var(--muted); }
    .spinner { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .footer { border-top:1px solid var(--border); padding:24px 32px; text-align:center; color:var(--muted); font-size:0.82rem; margin-top:20px; }
    .footer a { color:var(--gold); text-decoration:none; }

    @media (max-width:900px) {
      .topnav { padding:0 16px; }
      .main { padding:16px; }
      .detail-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a href="/" class="nav-logo"><div class="logo-icon">💡</div><span>IdeaHub</span></a>
  <a href="/idea-requests" class="back-link">← Back to Requests</a>
  <div class="nav-right">
    <div id="guestNav" style="display:flex;align-items:center;gap:8px;">
      <a href="/login">Sign in</a>
      <a href="/signup" class="btn-gold">Join free</a>
    </div>
    <div class="nav-user" id="userNav">
      <a href="/dashboard" class="btn-outline" id="dashboardLink" style="padding:6px 14px;text-decoration:none;font-size:0.875rem;">My Dashboard</a>
      <a href="/profile" class="nav-avatar" id="navAvatar"></a>
    </div>
  </div>
</nav>

<main class="main">
  <div id="pageContent">
    <div class="loading-page"><div class="spinner"></div> Loading request…</div>
  </div>
</main>

<footer class="footer">
  © 2026 <a href="https://picela.co" target="_blank">Picela</a>. All rights reserved. IdeaHub is a product by <a href="https://picela.co" target="_blank">Picela</a>.
</footer>

<script>
  const API_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://ideahub.it.com';

  const token = localStorage.getItem('token') || localStorage.getItem('ih_token');
  const user = JSON.parse(localStorage.getItem('user') || localStorage.getItem('ih_user') || 'null');
  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('id') || window.location.pathname.split('/').pop();

  const creatorRoles = ['idea_creator','patent_seller'];
  const investorRoles = ['investor','corporate_services','admin'];
  let currentRequest = null;
  let activeChatCreatorId = null;

  function initNav() {
    if (!token || !user) return;
    document.getElementById('guestNav').style.display = 'none';
    document.getElementById('userNav').classList.add('visible');
    const roleLinks = { idea_creator:'/dashboard', patent_seller:'/dashboard', investor:'/buyer-dashboard', corporate_services:'/buyer-dashboard', virtual_manager:'/support-dashboard', patent_attorney:'/support-dashboard', business_owner:'/business-dashboard', admin:'/admin' };
    document.getElementById('dashboardLink').href = roleLinks[user.role] || '/dashboard';
    const avatarEl = document.getElementById('navAvatar');
    const avatarUrl = user.avatar_url || user.avatarUrl;
    if (avatarUrl) avatarEl.innerHTML = `<img src="${avatarUrl}" alt="">`;
    else avatarEl.textContent = (user.name || user.first_name || user.email || 'U')[0].toUpperCase();
  }

  function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }
  function timeAgo(d) {
    const diff = Date.now()-new Date(d);
    if (diff<3600000) return Math.floor(diff/60000)+'m ago';
    if (diff<86400000) return Math.floor(diff/3600000)+'h ago';
    return Math.floor(diff/86400000)+'d ago';
  }
  function formatTime(d) {
    const diff = Date.now()-new Date(d);
    if (diff<60000) return 'just now';
    if (diff<3600000) return Math.floor(diff/60000)+'m ago';
    return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }

  const statusMap = { open:'Open', proposals_received:'Proposals In', shortlisting:'Shortlisting', pitching:'Pitching', agreed:'Agreed', in_escrow:'In Escrow 🔒', delivered:'Delivered', completed:'Completed ✅', disputed:'Disputed ⚠️' };

  async function updateProposalStatus(proposalId, status) {
    const msgs = { shortlisted:'Shortlist this proposal?', invited_to_pitch:'Invite to pitch?', selected:'Select this creator?', rejected:'Reject this proposal?' };
    if (!confirm(msgs[status]||'Update?')) return;
    try {
      const res = await fetch(`${API_URL}/api/proposals/${proposalId}/status`, {
        method:'PUT', headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({status})
      });
      if (res.ok) loadPage();
    } catch(e) { alert('Failed to update.'); }
  }

  async function lockEscrow(proposalId, creatorId, amount) {
    if (!confirm(`Lock $${amount} in escrow?`)) return;
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/escrow`, {
        method:'POST', headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({amount, proposal_id:proposalId, creator_id:creatorId})
      });
      if (res.ok) loadPage();
    } catch(e) { alert('Failed.'); }
  }

  async function markDelivered() {
    if (!confirm('Mark as delivered?')) return;
    try { const res = await fetch(`${API_URL}/api/requests/${requestId}/deliver`,{method:'POST',headers:{Authorization:`Bearer ${token}`}}); if(res.ok) loadPage(); } catch(e) { alert('Failed.'); }
  }

  async function confirmDelivery() {
    if (!confirm('Confirm delivery and release payment?')) return;
    try { const res = await fetch(`${API_URL}/api/requests/${requestId}/confirm`,{method:'POST',headers:{Authorization:`Bearer ${token}`}}); if(res.ok) { alert('Payment released! 🎉'); loadPage(); } } catch(e) { alert('Failed.'); }
  }

  async function raiseDispute() {
    const reason = prompt('Describe the issue:');
    if (!reason) return;
    try { const res = await fetch(`${API_URL}/api/requests/${requestId}/dispute`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({reason})}); if(res.ok) loadPage(); } catch(e) { alert('Failed.'); }
  }

  async function openChat(creatorId, creatorName) {
    activeChatCreatorId = creatorId;
    document.getElementById('chatSection').style.display = 'block';
    document.getElementById('chatHeading').textContent = `💬 Pitch Chat with ${creatorName}`;
    loadChat();
    setTimeout(() => document.getElementById('chatSection').scrollIntoView({behavior:'smooth'}), 100);
  }

  async function loadChat() {
    if (!activeChatCreatorId) return;
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/messages/${activeChatCreatorId}`,{headers:{Authorization:`Bearer ${token}`}});
      const msgs = await res.json();
      const el = document.getElementById('chatMsgs');
      if (!msgs.length) { el.innerHTML='<div style="text-align:center;color:var(--muted);padding:2rem;font-size:0.82rem;">No messages yet. Start the pitch!</div>'; return; }
      el.innerHTML = msgs.map(m => {
        const isMe = m.from_id === user?.id;
        return `<div class="msg-bubble ${isMe?'me':'them'}"><div class="bubble">${m.text}</div><div class="bubble-time">${formatTime(m.created_at)}</div></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    } catch(e) {}
  }

  function handleChatKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();} }

  async function sendChat() {
    const input = document.getElementById('chatInputField');
    const text = input.value.trim();
    if (!text||!activeChatCreatorId) return;
    input.value='';
    try {
      await fetch(`${API_URL}/api/requests/${requestId}/messages`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({to_id:activeChatCreatorId,text})});
      loadChat();
    } catch(e) {}
  }

  async function submitProposal() {
    const title = document.getElementById('propTitle')?.value.trim();
    const summary = document.getElementById('propSummary')?.value.trim();
    const approach = document.getElementById('propApproach')?.value.trim();
    const proposed_price = parseFloat(document.getElementById('propPrice')?.value)||null;
    const delivery_days = parseInt(document.getElementById('propDays')?.value)||null;
    if (!title||!summary) { alert('Please fill in title and summary.'); return; }
    const btn = document.getElementById('propBtn');
    btn.disabled=true; btn.textContent='Submitting…';
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/proposals`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({title,summary,approach,proposed_price,delivery_days})});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Failed');
      alert('Proposal submitted! 🎉');
      loadPage();
    } catch(err) { alert(err.message||'Something went wrong.'); btn.disabled=false; btn.textContent='Submit Proposal'; }
  }

  async function loadPage() {
    try {
      const reqRes = await fetch(`${API_URL}/api/requests/${requestId}`);
      if (!reqRes.ok) throw new Error('Not found');
      currentRequest = await reqRes.json();
      const r = currentRequest;

      const isOwner = user && r.investor_id === user.id;
      const isCreator = user && creatorRoles.includes(user.role);
      const isSelectedCreator = user && r.selected_creator_id === user.id;

      let proposals = [], myProposal = null;
      if (isOwner && token) {
        const pRes = await fetch(`${API_URL}/api/requests/${requestId}/proposals`,{headers:{Authorization:`Bearer ${token}`}});
        if (pRes.ok) proposals = await pRes.json();
      }
      if (isCreator && token) {
        const mpRes = await fetch(`${API_URL}/api/requests/${requestId}/my-proposal`,{headers:{Authorization:`Bearer ${token}`}});
        if (mpRes.ok) myProposal = await mpRes.json();
      }

      const budget = r.budget_min&&r.budget_max ? `$${r.budget_min.toLocaleString()} – $${r.budget_max.toLocaleString()}` : r.budget_max ? `Up to $${r.budget_max.toLocaleString()}` : r.budget_min ? `From $${r.budget_min.toLocaleString()}` : 'Budget open';

      document.getElementById('pageContent').innerHTML = `
        <div class="detail-grid">
          <!-- LEFT -->
          <div>
            <!-- REQUEST CARD -->
            <div class="card">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;">
                <div class="req-title">${r.title}</div>
                <span class="status-badge s-${r.status||'open'}">${statusMap[r.status]||'Open'}</span>
              </div>
              <div class="meta-pills">
                ${r.industry?`<span class="meta-pill">🏭 ${r.industry}</span>`:''}
                <span class="meta-pill">👤 ${r.investor_name||'Anonymous'}</span>
                <span class="meta-pill">🕐 ${timeAgo(r.created_at)}</span>
                ${r.deadline?`<span class="meta-pill">📅 Deadline: ${formatDate(r.deadline)}</span>`:''}
                <span class="meta-pill">📝 ${r.proposal_count||0} proposals</span>
              </div>
              <div class="req-problem">${r.problem}</div>
              ${r.requirements?`<div class="req-requirements"><strong style="color:var(--gold);font-size:0.75rem;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;">📋 Requirements</strong>${r.requirements}</div>`:''}
            </div>

            <!-- ESCROW -->
            ${['in_escrow','delivered','completed'].includes(r.status)?`
            <div class="card">
              <div class="card-title">🔒 Escrow Status</div>
              <div class="escrow-box">
                <div class="escrow-amount">$${(r.escrow_amount||0).toLocaleString()}</div>
                <div class="escrow-note">${r.status==='in_escrow'?'Locked — waiting for delivery':r.status==='delivered'?'Delivered — investor reviewing':'Payment released ✅'}</div>
              </div>
              ${r.status==='in_escrow'&&isSelectedCreator?`<button class="btn-primary" onclick="markDelivered()">📦 Mark as Delivered</button>`:''}
              ${r.status==='delivered'&&isOwner?`<div style="display:flex;gap:10px;"><button class="btn-primary" style="background:var(--green);color:#000;" onclick="confirmDelivery()">✅ Confirm & Release Payment</button><button class="btn-secondary" style="color:var(--error);border-color:var(--error);" onclick="raiseDispute()">⚠️ Dispute</button></div>`:''}
            </div>`:''}

            <!-- PROPOSALS (investor view) -->
            ${isOwner&&proposals.length>0?`
            <div class="card">
              <div class="card-title">📝 Proposals <span style="background:var(--gold);color:#000;border-radius:20px;padding:2px 8px;font-size:0.72rem;font-weight:700;">${proposals.length}</span></div>
              ${proposals.map(p=>{
                const name = `${p.creator?.first_name||''} ${p.creator?.last_name||''}`.trim()||p.creator_name||'Creator';
                const init = name[0]?.toUpperCase()||'?';
                return `<div class="proposal-item ${p.status==='shortlisted'?'shortlisted':''} ${p.status==='selected'?'selected':''}">
                  <div class="prop-header">
                    <div class="prop-creator">
                      <div class="prop-av">${init}</div>
                      <div><div class="prop-name">${name}</div><div class="prop-sub">${timeAgo(p.created_at)} · ${p.status}</div></div>
                    </div>
                  </div>
                  <div class="prop-title">${p.title}</div>
                  <div class="prop-summary">${p.summary}</div>
                  ${p.approach?`<div style="font-size:0.78rem;color:var(--muted);margin-bottom:10px;line-height:1.6;">${p.approach}</div>`:''}
                  <div class="prop-footer">
                    ${p.proposed_price?`<span class="prop-price">$${p.proposed_price.toLocaleString()}</span>`:''}
                    ${p.delivery_days?`<span class="prop-days">⏱ ${p.delivery_days}d delivery</span>`:''}
                    <div class="prop-actions">
                      ${p.status==='pending'?`<button class="btn-sm btn-shortlist" onclick="updateProposalStatus(${p.id},'shortlisted')">⭐ Shortlist</button>`:''}
                      ${['pending','shortlisted'].includes(p.status)?`<button class="btn-sm btn-invite" onclick="updateProposalStatus(${p.id},'invited_to_pitch')">🎤 Invite to Pitch</button>`:''}
                      ${['shortlisted','invited_to_pitch'].includes(p.status)?`<button class="btn-sm btn-select" onclick="updateProposalStatus(${p.id},'selected')">🏆 Select</button>`:''}
                      ${p.status==='selected'&&r.status==='agreed'?`<button class="btn-sm btn-select" onclick="lockEscrow(${p.id},${p.creator_id},${p.proposed_price||r.budget_max||0})">🔒 Lock Escrow</button>`:''}
                      ${!['rejected','selected'].includes(p.status)?`<button class="btn-sm btn-reject" onclick="updateProposalStatus(${p.id},'rejected')">✕ Reject</button>`:''}
                      <button class="btn-sm btn-chat" onclick="openChat(${p.creator_id},'${name}')">💬 Chat</button>
                    </div>
                  </div>
                </div>`;
              }).join('')}
            </div>`:''}

            ${isOwner&&proposals.length===0?`
            <div class="card" style="text-align:center;padding:3rem;">
              <div style="font-size:2.5rem;margin-bottom:12px;">📭</div>
              <div style="color:var(--muted);font-size:0.875rem;">No proposals yet — creators will be notified shortly.</div>
            </div>`:''}

            <!-- CHAT -->
            <div class="card" id="chatSection" style="display:none;">
              <div class="card-title" id="chatHeading">💬 Pitch Chat</div>
              <div class="chat-area">
                <div class="chat-msgs" id="chatMsgs"></div>
                <div class="chat-input-row">
                  <input class="chat-input" id="chatInputField" placeholder="Type your message…" onkeydown="handleChatKey(event)" />
                  <button class="chat-send" onclick="sendChat()">➤</button>
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT -->
          <div>
            <!-- BUDGET -->
            <div class="card">
              <div class="card-title">💰 Budget</div>
              <div class="budget-display">${budget}</div>
              <div class="budget-sub">Offered by investor</div>
            </div>

            <!-- CREATOR: SUBMIT PROPOSAL -->
            ${isCreator&&!isOwner?`
            <div class="card">
              ${myProposal?`
                <div class="card-title">Your Proposal</div>
                <div style="background:var(--surface2);border-radius:8px;padding:12px;margin-bottom:12px;">
                  <div style="font-weight:600;font-size:0.875rem;margin-bottom:4px;">${myProposal.title}</div>
                  <div style="font-size:0.82rem;color:var(--muted);">${myProposal.summary}</div>
                  <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
                    <span class="status-badge s-${myProposal.status}" style="font-size:0.7rem;">${myProposal.status}</span>
                    ${myProposal.proposed_price?`<span style="font-weight:700;color:var(--gold);">$${myProposal.proposed_price.toLocaleString()}</span>`:''}
                  </div>
                </div>
                ${myProposal.status==='invited_to_pitch'?`<div class="info-box info-blue">🎤 You've been invited to pitch! Send a message to the investor.</div><button class="btn-primary" onclick="openChat(${r.investor_id},'Investor')">💬 Start Pitch Chat</button>`:''}
                ${myProposal.status==='selected'?`<div class="info-box info-green">🏆 Your proposal was selected! Waiting for investor to lock escrow.</div>`:''}
                ${r.status==='in_escrow'&&isSelectedCreator?`<div class="info-box info-gold">🔒 $${(r.escrow_amount||0).toLocaleString()} locked. Deliver your idea then mark as delivered.</div>`:''}
              `:`
                <div class="card-title">Submit a Proposal</div>
                ${['open','proposals_received'].includes(r.status)?`
                  <div class="field"><label class="lbl">Proposal Title *</label><input type="text" id="propTitle" placeholder="Your solution title" /></div>
                  <div class="field"><label class="lbl">Your Approach *</label><textarea id="propSummary" placeholder="Briefly explain your idea and why it works…"></textarea></div>
                  <div class="field"><label class="lbl">Detailed Plan</label><textarea id="propApproach" placeholder="Go deeper — how would this work?"></textarea></div>
                  <div class="form-row">
                    <div class="field"><label class="lbl">Your Price ($)</label><input type="number" id="propPrice" placeholder="1000" min="0" /></div>
                    <div class="field"><label class="lbl">Delivery (days)</label><input type="number" id="propDays" placeholder="7" min="1" /></div>
                  </div>
                  ${!token?`<a href="/login" class="btn-primary" style="text-align:center;display:block;text-decoration:none;">Sign in to Submit</a>`:`<button class="btn-primary" id="propBtn" onclick="submitProposal()">Submit Proposal →</button>`}
                `:`<div style="text-align:center;padding:1rem;color:var(--muted);font-size:0.875rem;">This request is no longer accepting proposals.</div>`}
              `}
            </div>`:''}

            <!-- NOT LOGGED IN -->
            ${!user?`
            <div class="card" style="text-align:center;">
              <div style="font-size:2.5rem;margin-bottom:12px;">💡</div>
              <div style="font-size:0.875rem;margin-bottom:14px;color:var(--muted);">Sign in to submit a proposal for this request.</div>
              <a href="/login" class="btn-primary" style="text-align:center;display:block;text-decoration:none;">Sign In →</a>
              <a href="/signup" style="display:block;margin-top:8px;text-align:center;color:var(--muted);font-size:0.82rem;">Don't have an account? Join free</a>
            </div>`:''}
          </div>
        </div>`;

      if (isCreator && myProposal?.status==='invited_to_pitch') openChat(r.investor_id,'Investor');

    } catch(err) {
      document.getElementById('pageContent').innerHTML = `
        <div style="text-align:center;padding:4rem;color:var(--muted);">
          <div style="font-size:3rem;margin-bottom:12px;">😕</div>
          <div style="font-size:1rem;margin-bottom:16px;">Request not found.</div>
          <a href="/idea-requests" style="color:var(--gold);">← Back to Requests</a>
        </div>`;
    }
  }

  initNav();
  loadPage();
  setInterval(() => { if (activeChatCreatorId) loadChat(); }, 10000);
</script>
</body>
</html>
