<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request — IdeaHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site.css" />
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#080809; --surface:#141414; --surface2:#1c1c1c;
      --border:#2a2a2a; --gold:#f5c842; --gold-dim:#c49a10;
      --text:#f0f0f0; --muted:#888; --radius:12px;
      --green:#4ade80; --blue:#60a5fa; --purple:#a78bfa; --error:#ff6b6b;
    }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; min-height:100vh; }

    /* NAV */
    .topnav { position:sticky; top:0; z-index:100; background:rgba(8,8,9,0.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 32px; height:60px; display:flex; align-items:center; gap:16px; }
    .nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-size:1.15rem; font-weight:700; flex-shrink:0; }
    .nav-logo .logo-icon { width:32px; height:32px; background:var(--gold); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .nav-right { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .nav-right a { color:var(--muted); text-decoration:none; font-size:0.875rem; padding:6px 14px; border-radius:6px; transition:color 0.2s; }
    .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:0.875rem; padding:6px 14px; border:1px solid var(--border); border-radius:6px; transition:all 0.2s; }
    .back-link:hover { border-color:var(--gold); color:var(--text); }
    .nav-avatar { width:34px; height:34px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; color:#000; overflow:hidden; text-decoration:none; flex-shrink:0; }
    .nav-avatar img { width:100%; height:100%; object-fit:cover; }
    .btn-gold { background:var(--gold) !important; color:#000 !important; font-weight:600 !important; border-radius:6px; }
    .btn-outline { border:1px solid var(--border) !important; color:var(--text) !important; border-radius:6px; }
    .nav-user { display:none; align-items:center; gap:8px; }
    .nav-user.visible { display:flex; }

    /* LAYOUT */
    .main { max-width:1100px; margin:0 auto; padding:28px 32px; }
    .detail-grid { display:grid; grid-template-columns:1fr 340px; gap:24px; align-items:start; }

    /* CARDS */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
    .card-title { font-size:0.85rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }

    /* REQUEST HEADER */
    .req-title { font-size:1.6rem; font-weight:800; line-height:1.3; margin-bottom:12px; }
    .meta-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .meta-pill { display:inline-flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:0.78rem; color:var(--muted); }
    .req-problem { font-size:0.9rem; line-height:1.8; color:var(--text); margin-bottom:14px; }
    .req-requirements { font-size:0.85rem; line-height:1.7; color:var(--muted); background:var(--surface2); border-radius:10px; padding:14px; border-left:3px solid var(--gold); }

    /* STATUS BADGES */
    .status-badge { display:inline-flex; align-items:center; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
    .s-open { background:rgba(74,222,128,0.15); color:var(--green); }
    .s-proposals_received { background:rgba(245,197,24,0.15); color:var(--gold); }
    .s-shortlisting { background:rgba(96,165,250,0.15); color:var(--blue); }
    .s-pitching { background:rgba(167,139,250,0.15); color:var(--purple); }
    .s-in_escrow { background:rgba(245,197,24,0.15); color:var(--gold); }
    .s-delivered { background:rgba(96,165,250,0.15); color:var(--blue); }
    .s-completed { background:rgba(74,222,128,0.15); color:var(--green); }
    .s-disputed { background:rgba(255,107,107,0.15); color:var(--error); }

    /* PROPOSALS */
    .proposal-item { padding:16px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; transition:border-color 0.2s; }
    .proposal-item:hover { border-color:#3a3a3a; }
    .proposal-item.shortlisted { border-color:rgba(245,197,24,0.4); background:rgba(245,197,24,0.04); }
    .proposal-item.selected { border-color:rgba(74,222,128,0.4); background:rgba(74,222,128,0.04); }
    .prop-header { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .prop-creator { display:flex; align-items:center; gap:10px; }
    .prop-av { width:36px; height:36px; border-radius:50%; background:rgba(245,197,24,0.12); border:1px solid rgba(245,197,24,0.25); display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:700; color:var(--gold); flex-shrink:0; }
    .prop-name { font-weight:600; font-size:0.875rem; }
    .prop-sub { font-size:0.75rem; color:var(--muted); margin-top:2px; }
    .prop-title { font-weight:600; font-size:0.9rem; margin-bottom:6px; }
    .prop-summary { font-size:0.82rem; color:var(--muted); line-height:1.6; margin-bottom:10px; }
    .prop-footer { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .prop-price { font-size:1rem; font-weight:800; color:var(--gold); }
    .prop-days { font-size:0.78rem; color:var(--muted); }
    .prop-actions { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
    .btn-sm { border-radius:6px; padding:5px 12px; font-size:0.75rem; cursor:pointer; border:1px solid; transition:all 0.15s; background:none; }
    .btn-shortlist { border-color:rgba(245,197,24,0.4); color:var(--gold); }
    .btn-shortlist:hover { background:var(--gold); color:#000; }
    .btn-invite { border-color:rgba(96,165,250,0.4); color:var(--blue); }
    .btn-invite:hover { background:rgba(96,165,250,0.15); }
    .btn-select { border-color:rgba(74,222,128,0.4); color:var(--green); }
    .btn-select:hover { background:rgba(74,222,128,0.15); }
    .btn-reject { border-color:rgba(255,107,107,0.3); color:var(--error); }
    .btn-reject:hover { background:rgba(255,107,107,0.1); }
    .btn-chat { border-color:var(--border); color:var(--text); }
    .btn-chat:hover { border-color:var(--gold); color:var(--gold); }

    /* CHAT */
    .chat-area { display:flex; flex-direction:column; height:360px; }
    .chat-msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .msg-bubble { max-width:75%; }
    .msg-bubble.me { align-self:flex-end; }
    .msg-bubble.them { align-self:flex-start; }
    .bubble { padding:8px 12px; border-radius:14px; font-size:0.85rem; line-height:1.5; word-break:break-word; }
    .me .bubble { background:var(--gold); color:#000; border-bottom-right-radius:4px; }
    .them .bubble { background:var(--surface2); color:var(--text); border-bottom-left-radius:4px; }
    .bubble-time { font-size:0.65rem; color:var(--muted); margin-top:3px; text-align:right; }
    .chat-input-row { padding:10px; border-top:1px solid var(--border); display:flex; gap:8px; }
    .chat-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 14px; font-size:0.875rem; color:var(--text); outline:none; }
    .chat-input:focus { border-color:var(--gold); }
    .chat-send { background:var(--gold); color:#000; border:none; border-radius:8px; padding:0 14px; cursor:pointer; font-size:1.1rem; }

    /* ESCROW */
    .escrow-box { background:rgba(245,197,24,0.08); border:1px solid rgba(245,197,24,0.25); border-radius:10px; padding:16px; margin-bottom:14px; }
    .escrow-amount { font-size:1.8rem; font-weight:800; color:var(--gold); margin-bottom:4px; }
    .escrow-note { font-size:0.8rem; color:var(--muted); }

    .deal-sum { width:100%; border-collapse:collapse; font-size:0.85rem; margin:10px 0 12px; }
    .deal-sum td { padding:7px 0; border-bottom:1px solid var(--border); }
    .deal-sum td:last-child { text-align:right; font-weight:600; }
    .deal-sum tr.tot td { border-bottom:0; color:var(--gold); font-weight:800; font-size:0.95rem; }
    .deal-p { font-size:0.85rem; color:var(--muted); line-height:1.65; margin-bottom:10px; }
    .deal-scope { background:var(--surface2); border-radius:8px; padding:10px 12px; font-size:0.83rem; line-height:1.6; white-space:pre-wrap; margin-bottom:10px; }
    .file-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.83rem; }
    .file-row button { background:none; border:0; color:var(--gold); cursor:pointer; font-size:0.83rem; padding:0; text-align:left; flex:1; overflow-wrap:anywhere; }
    .file-row .rm { color:var(--muted); flex:0; }
    .deal-steps { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; }
    .deal-steps div { border-top:3px solid var(--surface2); padding-top:6px; font-size:0.68rem; color:var(--muted); font-weight:600; }
    .deal-steps div.done { border-top-color:rgba(74,222,128,0.6); color:var(--text); }
    .deal-steps div.now { border-top-color:var(--gold); color:var(--text); }

    /* RIGHT SIDEBAR CARDS */
    .budget-display { font-size:1.8rem; font-weight:800; color:var(--gold); margin-bottom:4px; }
    .budget-sub { font-size:0.78rem; color:var(--muted); }

    /* FORM */
    .field { margin-bottom:14px; }
    .lbl { display:block; font-size:0.72rem; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
    input[type=text], input[type=number], textarea {
      width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      padding:10px 14px; font-size:0.875rem; color:var(--text); outline:none; transition:border-color 0.2s;
      font-family:inherit;
    }
    textarea { resize:vertical; min-height:80px; line-height:1.6; }
    input:focus, textarea:focus { border-color:var(--gold); }
    input::placeholder, textarea::placeholder { color:var(--muted); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn-primary { background:var(--gold); color:#000; border:none; border-radius:8px; padding:11px; font-size:0.875rem; font-weight:700; cursor:pointer; width:100%; transition:background 0.15s; }
    .btn-primary:hover { background:var(--gold-dim); }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-secondary { background:none; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:0.875rem; color:var(--text); cursor:pointer; width:100%; margin-top:8px; transition:border-color 0.2s; }
    .btn-secondary:hover { border-color:var(--gold); }

    /* ALERT BOXES */
    .m-idea { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--border); text-decoration:none; color:var(--text); }
    .m-idea:first-of-type { border-top:0; padding-top:0; }
    .m-idea:hover .m-title { color:var(--gold); }
    .m-title { font-weight:600; font-size:0.9rem; }
    .m-sub { font-size:0.78rem; color:var(--muted); margin-top:3px; line-height:1.5; }
    .m-right { text-align:right; flex-shrink:0; }
    .m-price { font-weight:700; color:var(--gold); font-size:0.9rem; }
    .m-fit { font-size:0.72rem; color:var(--green); margin-top:3px; }
    .m-creator { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--border); }
    .m-creator:first-of-type { border-top:0; padding-top:0; }
    .m-av { width:36px; height:36px; border-radius:50%; background:rgba(245,200,66,0.12); border:1px solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; overflow:hidden; flex-shrink:0; }
    .m-av img { width:100%; height:100%; object-fit:cover; }
    .m-reasons { font-size:0.76rem; color:var(--muted); line-height:1.55; margin-top:3px; }
    .m-invite { margin-left:auto; flex-shrink:0; border-color:var(--gold) !important; color:var(--gold); }
    .m-invite[disabled] { opacity:.6; cursor:default; border-color:var(--border) !important; color:var(--muted); }
    .info-box { border-radius:8px; padding:12px 14px; font-size:0.82rem; line-height:1.5; margin-bottom:12px; }
    .info-blue { background:rgba(96,165,250,0.1); border:1px solid rgba(96,165,250,0.3); color:var(--blue); }
    .info-green { background:rgba(74,222,128,0.1); border:1px solid rgba(74,222,128,0.3); color:var(--green); }
    .info-gold { background:rgba(245,197,24,0.1); border:1px solid rgba(245,197,24,0.3); color:var(--gold); }
    .info-red { background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3); color:var(--error); }

    .loading-page { display:flex; align-items:center; justify-content:center; min-height:60vh; gap:12px; color:var(--muted); }
    .spinner { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .footer { border-top:1px solid var(--border); padding:24px 32px; text-align:center; color:var(--muted); font-size:0.82rem; margin-top:20px; }
    .footer a { color:var(--gold); text-decoration:none; }

    @media (max-width:900px) {
      .topnav { padding:0 16px; }
      .main { padding:16px; }
      .detail-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<header id="siteNav"></header><script src="/site-nav.js"></script>
<a href="/idea-requests" class="back-link" style="display:inline-block;margin:1.25rem 0 0 2rem;">← Back to Requests</a>

<main class="main">
  <div id="pageContent">
    <div class="loading-page"><div class="spinner"></div> Loading request…</div>
  </div>
</main>

<footer class="footer">
  © 2026 <a href="https://picela.co" target="_blank">Picela</a>. All rights reserved. IdeaHub is a product by <a href="https://picela.co" target="_blank">Picela</a>.
</footer>

<script>
  const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

  const token = localStorage.getItem('token') || localStorage.getItem('ih_token');
  const user = JSON.parse(localStorage.getItem('user') || localStorage.getItem('ih_user') || 'null');
  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('id') || window.location.pathname.split('/').pop();

  const creatorRoles = ['idea_creator','patent_seller'];
  const investorRoles = ['investor','admin'];
  let currentRequest = null;
  let activeChatCreatorId = null;

  function initNav() {
    if (!token || !user) return;
    document.getElementById('guestNav').style.display = 'none';
    document.getElementById('userNav').classList.add('visible');
    const roleLinks = { idea_creator:'/dashboard', patent_seller:'/dashboard', investor:'/buyer-dashboard', corporate_services:'/support-dashboard', virtual_manager:'/support-dashboard', chartered_accountant:'/support-dashboard', patent_attorney:'/support-dashboard', business_owner:'/business-dashboard', admin:'/admin' };
    document.getElementById('dashboardLink').href = roleLinks[user.role] || '/dashboard';
    const avatarEl = document.getElementById('navAvatar');
    const avatarUrl = user.avatar_url || user.avatarUrl;
    if (avatarUrl) avatarEl.innerHTML = `<img src="${avatarUrl}" alt="">`;
    else avatarEl.textContent = (user.name || user.first_name || user.email || 'U')[0].toUpperCase();
  }

  function escR(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ── MATCHING ──
  async function loadMatches(isOwner) {
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/matches`, token ? { headers: { Authorization: `Bearer ${token}` } } : {});
      if (!res.ok) return;
      const m = await res.json();
      const ideasEl = document.getElementById('matchIdeas');
      if (ideasEl && m.ideas && m.ideas.length) {
        ideasEl.innerHTML = `<div class="card">
          <div class="card-title">💡 Ideas already for sale that fit</div>
          ${m.ideas.map(i => `<a class="m-idea" href="/idea?id=${encodeURIComponent(i.id)}">
            <div><div class="m-title">${escR(i.title)}</div><div class="m-sub">${escR(i.summary || '')}</div></div>
            <div class="m-right"><div class="m-price">$${Number(i.price || 0).toLocaleString()}</div><div class="m-fit">${Number(i.match)}% fit${i.originality_score != null ? ' · originality ' + Number(i.originality_score) : ''}</div></div>
          </a>`).join('')}
          ${isOwner ? '<div class="m-sub" style="margin-top:10px;">Buying an existing idea can be faster than waiting for proposals.</div>' : ''}
        </div>`;
      }
      const crEl = document.getElementById('matchCreators');
      if (crEl && m.creators) {
        crEl.innerHTML = `<div class="card">
          <div class="card-title">🎯 Creators who could help <span style="font-size:0.72rem;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500;">${m.creators.filter(c => c.alerted).length} alerted automatically</span></div>
          ${m.creators.length ? m.creators.map(c => `<div class="m-creator">
            <div class="m-av">${c.avatar_url ? `<img src="${escR(c.avatar_url)}" alt="">` : escR((c.name || '?')[0].toUpperCase())}</div>
            <div style="min-width:0;"><a href="/public-profile?id=${encodeURIComponent(c.id)}" style="color:var(--text);font-weight:600;font-size:0.88rem;text-decoration:none;">${escR(c.name)}</a>${c.stars ? ` <span style="color:var(--gold);font-size:0.72rem;">${'★'.repeat(Math.round(c.stars))}</span>` : ''}
              <div class="m-reasons">${c.reasons.map(escR).join(' · ')}</div></div>
            <button class="btn-sm m-invite" ${c.invited ? 'disabled' : ''} onclick="inviteCreator(${Number(c.id)}, this)">${c.invited ? '✓ Invited' : '✉️ Invite to pitch'}</button>
          </div>`).join('') : '<div class="m-sub">No close matches yet. Creators are still alerted, and new ideas that fit will be sent to you.</div>'}
        </div>`;
      }
      const meEl = document.getElementById('matchMe');
      if (meEl && m.me) {
        meEl.innerHTML = `<div class="info-box info-gold">✨ <strong>${m.me.invited ? 'The investor invited you to pitch.' : "You're a strong match for this request."}</strong>${m.me.reasons && m.me.reasons.length ? '<br>' + m.me.reasons.map(escR).join(' · ') : ''}</div>`;
      }
    } catch (e) {}
  }
  async function inviteCreator(id, btn) {
    btn.disabled = true; btn.textContent = 'Inviting…';
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/invite`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify({ creatorId: id }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Invite failed');
      btn.textContent = '✓ Invited';
    } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = '✉️ Invite to pitch'; }
  }

  function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }
  function timeAgo(d) {
    const diff = Date.now()-new Date(d);
    if (diff<3600000) return Math.floor(diff/60000)+'m ago';
    if (diff<86400000) return Math.floor(diff/3600000)+'h ago';
    return Math.floor(diff/86400000)+'d ago';
  }
  function formatTime(d) {
    const diff = Date.now()-new Date(d);
    if (diff<60000) return 'just now';
    if (diff<3600000) return Math.floor(diff/60000)+'m ago';
    return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }

  const statusMap = { open:'Open', proposals_received:'Proposals In', shortlisting:'Shortlisting', pitching:'Pitching', agreed:'Agreed', in_escrow:'In Escrow 🔒', delivered:'Delivered', completed:'Completed ✅', disputed:'Under review ⚠️', refunded:'Refunded', closed:'Closed' };

  async function updateProposalStatus(proposalId, status) {
    const msgs = { shortlisted:'Shortlist this proposal?', invited_to_pitch:'Invite to pitch?', selected:'Select this creator?', rejected:'Reject this proposal?' };
    if (!confirm(msgs[status]||'Update?')) return;
    try {
      const res = await fetch(`${API_URL}/api/proposals/${proposalId}/status`, {
        method:'PUT', headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({status})
      });
      if (res.ok) loadPage();
    } catch(e) { alert('Failed to update.'); }
  }

  // ── DEAL: price, escrow payment, delivery, confirmation ──
  const money = n => { const v = Number(n || 0); return '$' + v.toLocaleString('en-US', Number.isInteger(v) ? {} : { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  const dday = d => d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  let dealBusy = false;
  function filesList(r, canRemove) {
    const f = r.files || [];
    if (!f.length) return '<div class="deal-p" style="margin-bottom:0">No files yet.</div>';
    return f.map(x => `<div class="file-row">📎 <button onclick="openFile(${Number(x.id)})">${escR(x.file_name)}</button><span style="color:var(--muted);font-size:0.75rem">${x.size ? Math.max(1, Math.round(x.size / 1024)) + ' KB' : ''}</span>${canRemove ? `<button class="rm" title="Remove" onclick="removeFile(${Number(x.id)})">✕</button>` : ''}</div>`).join('');
  }
  function dealPanel(r) {
    const v = r.viewer, s = r.status;
    if (!v || !['agreed', 'in_escrow', 'delivered', 'completed', 'disputed', 'refunded'].includes(s)) return '';
    const idx = { agreed: 0, in_escrow: 1, delivered: 2, completed: 3, disputed: r.delivered_at ? 2 : 1, refunded: 1 }[s];
    const steps = `<div class="deal-steps">${['Price agreed', 'Paid into escrow', 'Delivered', 'Completed'].map((l, i) => `<div class="${i < idx || (s === 'completed') ? 'done' : i === idx ? 'now' : ''}">${l}</div>`).join('')}</div>`;
    const q = r.price_quote;
    const sum = q ? `<table class="deal-sum"><tr><td>Creator's price</td><td>${money(q.amount)}</td></tr><tr><td>IdeaHub fee (8%, includes escrow protection)</td><td>${money(q.fee)}</td></tr><tr class="tot"><td>Total</td><td>${money(q.total)}</td></tr></table>` : '';
    const scope = r.agreed_scope ? `<div class="deal-scope">${escR(r.agreed_scope)}</div>` : '';
    let body = '';
    if (s === 'agreed' && v === 'creator') body = `
      <div class="deal-p">${r.agreed_price ? `Your price is <b style="color:var(--text)">${money(r.agreed_price)}</b>${r.agreed_days ? ` within ${Number(r.agreed_days)} days` : ''}. Change it if you agreed something different with the investor; it's fixed once they pay.` : 'Set your final price so the investor can pay into escrow.'}</div>
      <div class="form-row"><div class="field"><label class="lbl" for="tAmt">Your price ($)</label><input type="number" id="tAmt" min="1" value="${r.agreed_price ? Number(r.agreed_price) : ''}" /></div>
      <div class="field"><label class="lbl" for="tDays">Days to deliver</label><input type="number" id="tDays" min="1" max="365" value="${r.agreed_days ? Number(r.agreed_days) : ''}" /></div></div>
      <div class="field"><label class="lbl" for="tScope">What you'll deliver</label><textarea id="tScope" placeholder="e.g. Full product concept, supplier list and cost sheet">${escR(r.agreed_scope || '')}</textarea></div>
      <div class="deal-p" style="font-size:0.75rem">IdeaHub adds 8% on top, paid by the investor. You receive your full price.</div>
      <button class="btn-primary" onclick="dealAct('terms')">${r.terms_at ? 'Update price' : 'Confirm price'}</button>`;
    else if (s === 'agreed' && v === 'investor') body = r.agreed_price ? `
      <div class="deal-p">Delivered within <b style="color:var(--text)">${Number(r.agreed_days || 0) || '—'} days</b> of payment.</div>${scope}${sum}
      <div class="deal-p">Your payment is held by IdeaHub and released only when you confirm the delivery (or ${7} days after delivery if you don't respond).</div>
      ${r.payments_open ? '' : '<div class="info-box info-gold">Online payments are launching soon. Message the creator in the meantime.</div>'}
      <button class="btn-primary" onclick="dealAct('pay')" ${r.payments_open ? '' : 'disabled'}>Pay ${money(q.total)} into escrow</button>
      <button class="btn-secondary" onclick="dealAct('reselect')">Choose a different proposal</button>`
      : `<div class="deal-p">Waiting for the creator to confirm their final price. You'll be notified.</div><button class="btn-secondary" onclick="dealAct('reselect')">Choose a different proposal</button>`;
    else if (s === 'in_escrow' && v === 'creator') body = `
      <div class="deal-p">${money(r.escrow_amount)} is held in escrow. Please deliver by <b style="color:var(--text)">${dday(new Date(new Date(r.paid_at).getTime() + Number(r.agreed_days || 7) * 86400000))}</b>.</div>${scope}
      <div class="lbl" style="margin-top:6px">Your files</div>${filesList(r, true)}
      <div class="field" style="margin-top:10px"><input type="file" id="dFile" style="font-size:0.8rem;color:var(--muted)" onchange="uploadFile()" /></div>
      <div class="field"><label class="lbl" for="dNote">Delivery note</label><textarea id="dNote" placeholder="What you delivered and how to use it"></textarea></div>
      <button class="btn-primary" onclick="dealAct('deliver')">📦 Mark as delivered</button>`;
    else if (s === 'in_escrow' && v === 'investor') body = `
      <div class="deal-p">${money(r.total)} is held safely in escrow. The creator should deliver by <b style="color:var(--text)">${dday(new Date(new Date(r.paid_at).getTime() + Number(r.agreed_days || 7) * 86400000))}</b>.</div>${scope}
      <button class="btn-secondary" style="color:var(--error);border-color:rgba(255,107,107,0.4)" onclick="dealAct('dispute')">Report a problem</button>`;
    else if (s === 'delivered' && v === 'investor') body = `
      <div class="deal-p">The creator delivered on ${dday(r.delivered_at)}. Check the work, then confirm to release ${money(r.escrow_amount)}. If you do nothing, it's released automatically on <b style="color:var(--text)">${dday(r.confirm_by)}</b>.</div>
      ${r.delivery_note ? `<div class="deal-scope">${escR(r.delivery_note)}</div>` : ''}<div class="lbl">Files</div>${filesList(r, false)}
      <button class="btn-primary" style="margin-top:12px;background:var(--green)" onclick="dealAct('confirm')">✅ Confirm and release payment</button>
      <button class="btn-secondary" style="color:var(--error);border-color:rgba(255,107,107,0.4)" onclick="dealAct('dispute')">Report a problem</button>`;
    else if (s === 'delivered' && v === 'creator') body = `<div class="deal-p">Waiting for the investor to confirm. Your ${money(r.escrow_amount)} is released when they do, or automatically on <b style="color:var(--text)">${dday(r.confirm_by)}</b>.</div><div class="lbl">Files</div>${filesList(r, false)}`;
    else if (s === 'disputed') body = `<div class="deal-p">A problem was reported: <i>${escR(r.dispute_reason || '')}</i><br>The money stays in escrow while IdeaHub reviews the messages and files.</div>${r.files?.length ? '<div class="lbl">Files</div>' + filesList(r, v === 'creator') : ''}`;
    else if (s === 'completed') body = `<div class="deal-p">✅ Completed${r.paid_at ? `: ${money(r.escrow_amount)} was released to the creator` : ''}.${r.resolution_note ? ' Note from IdeaHub: ' + escR(r.resolution_note) : ''}</div>${r.files?.length ? '<div class="lbl">Files</div>' + filesList(r, false) : ''}`;
    else if (s === 'refunded') body = `<div class="deal-p">↩️ IdeaHub refunded ${money(r.total)} to the investor.${r.resolution_note ? ' Note: ' + escR(r.resolution_note) : ''}</div>`;
    return `<div class="card"><div class="card-title">🤝 The deal</div>${steps}${body}</div>`;
  }
  async function dealAct(act) {
    if (dealBusy) return;
    const r = currentRequest; let path = act, body = {};
    if (act === 'terms') body = { amount: document.getElementById('tAmt').value, days: document.getElementById('tDays').value, scope: document.getElementById('tScope').value };
    else if (act === 'pay') { if (!confirm(`Pay ${money(r.price_quote.total)} into escrow? The creator is paid only when you confirm the delivery.`)) return; body = { expected_amount: r.agreed_price }; }
    else if (act === 'reselect') { if (!confirm('Go back and choose a different proposal? The creator will be told.')) return; }
    else if (act === 'deliver') { if (!confirm('Mark as delivered? The investor will be asked to confirm.')) return; body = { note: document.getElementById('dNote').value }; }
    else if (act === 'confirm') { if (!confirm(`Confirm the delivery and release ${money(r.escrow_amount)} to the creator? This can't be undone.`)) return; }
    else if (act === 'dispute') { const reason = prompt('What went wrong? The payment stays in escrow while IdeaHub reviews it.'); if (!reason) return; body = { reason }; }
    dealBusy = true;
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) alert(d.error || 'Something went wrong.');
      else if (act === 'confirm') alert('Thank you! The payment was released to the creator.');
    } catch (e) { alert('Something went wrong. Check your connection.'); }
    dealBusy = false; loadPage();
  }
  async function uploadFile() {
    const inp = document.getElementById('dFile'); const f = inp.files[0]; if (!f) return;
    if (f.size > 25 * 1024 * 1024) { alert('Files can be up to 25 MB.'); inp.value = ''; return; }
    const keepNote = document.getElementById('dNote')?.value || '';
    const fd = new FormData(); fd.append('file', f);
    inp.disabled = true;
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/files`, { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: fd });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) alert(d.error || 'Upload failed.');
    } catch (e) { alert('Upload failed.'); }
    await loadPage();
    const n = document.getElementById('dNote'); if (n) n.value = keepNote;
  }
  async function removeFile(fid) {
    if (!confirm('Remove this file?')) return;
    await fetch(`${API_URL}/api/requests/${requestId}/files/${fid}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
    loadPage();
  }
  async function openFile(fid) {
    const w = window.open('', '_blank');
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/files/${fid}`, { headers: { Authorization: `Bearer ${token}` } });
      const d = await res.json(); if (!res.ok) throw new Error(d.error || 'Could not open the file.');
      if (w) w.location = d.url; else location.href = d.url;
    } catch (e) { if (w) w.close(); alert(e.message); }
  }

  async function openChat(creatorId, creatorName) {
    activeChatCreatorId = creatorId;
    document.getElementById('chatSection').style.display = 'block';
    document.getElementById('chatHeading').textContent = `💬 Pitch Chat with ${creatorName}`;
    loadChat();
    setTimeout(() => document.getElementById('chatSection').scrollIntoView({behavior:'smooth'}), 100);
  }

  async function loadChat() {
    if (!activeChatCreatorId) return;
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/messages/${activeChatCreatorId}`,{headers:{Authorization:`Bearer ${token}`}});
      const msgs = await res.json();
      const el = document.getElementById('chatMsgs');
      if (!msgs.length) { el.innerHTML='<div style="text-align:center;color:var(--muted);padding:2rem;font-size:0.82rem;">No messages yet. Start the pitch!</div>'; return; }
      el.innerHTML = msgs.map(m => {
        const isMe = m.from_id === user?.id;
        return `<div class="msg-bubble ${isMe?'me':'them'}"><div class="bubble" style="white-space:pre-wrap;">${escR(m.text)}</div><div class="bubble-time">${formatTime(m.created_at)}</div></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    } catch(e) {}
  }

  function handleChatKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();} }

  async function sendChat() {
    const input = document.getElementById('chatInputField');
    const text = input.value.trim();
    if (!text||!activeChatCreatorId) return;
    input.value='';
    try {
      await fetch(`${API_URL}/api/requests/${requestId}/messages`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({to_id:activeChatCreatorId,text})});
      loadChat();
    } catch(e) {}
  }

  async function submitProposal() {
    const title = document.getElementById('propTitle')?.value.trim();
    const summary = document.getElementById('propSummary')?.value.trim();
    const approach = document.getElementById('propApproach')?.value.trim();
    const proposed_price = parseFloat(document.getElementById('propPrice')?.value)||null;
    const delivery_days = parseInt(document.getElementById('propDays')?.value)||null;
    if (!title||!summary) { alert('Please fill in title and summary.'); return; }
    const btn = document.getElementById('propBtn');
    btn.disabled=true; btn.textContent='Submitting…';
    try {
      const res = await fetch(`${API_URL}/api/requests/${requestId}/proposals`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({title,summary,approach,proposed_price,delivery_days})});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Failed');
      alert('Proposal submitted! 🎉');
      loadPage();
    } catch(err) { alert(err.message||'Something went wrong.'); btn.disabled=false; btn.textContent='Submit Proposal'; }
  }

  async function loadPage() {
    try {
      const reqRes = await fetch(`${API_URL}/api/requests/${requestId}`, token ? { headers: { Authorization: `Bearer ${token}` } } : {});
      if (!reqRes.ok) throw new Error('Not found');
      currentRequest = await reqRes.json();
      const r = currentRequest;

      const isOwner = user && r.investor_id === user.id;
      const isCreator = user && creatorRoles.includes(user.role);
      const isSelectedCreator = user && r.selected_creator_id === user.id;

      let proposals = [], myProposal = null;
      if (isOwner && token) {
        const pRes = await fetch(`${API_URL}/api/requests/${requestId}/proposals`,{headers:{Authorization:`Bearer ${token}`}});
        if (pRes.ok) proposals = await pRes.json();
      }
      if (isCreator && token) {
        const mpRes = await fetch(`${API_URL}/api/requests/${requestId}/my-proposal`,{headers:{Authorization:`Bearer ${token}`}});
        if (mpRes.ok) myProposal = await mpRes.json();
      }

      const budget = r.budget_min&&r.budget_max ? `$${r.budget_min.toLocaleString()} – $${r.budget_max.toLocaleString()}` : r.budget_max ? `Up to $${r.budget_max.toLocaleString()}` : r.budget_min ? `From $${r.budget_min.toLocaleString()}` : 'Budget open';

      document.getElementById('pageContent').innerHTML = `
        <div class="detail-grid">
          <!-- LEFT -->
          <div>
            <!-- REQUEST CARD -->
            <div class="card">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;">
                <div class="req-title">${escR(r.title)}</div>
                <span class="status-badge s-${r.status||'open'}">${statusMap[r.status]||'Open'}</span>
              </div>
              <div class="meta-pills">
                ${r.industry?`<span class="meta-pill">🏭 ${escR(r.industry)}</span>`:''}
                <span class="meta-pill">👤 ${escR(r.investor_name||'Anonymous')}</span>
                <span class="meta-pill">🕐 ${timeAgo(r.created_at)}</span>
                ${r.deadline?`<span class="meta-pill">📅 Deadline: ${formatDate(r.deadline)}</span>`:''}
                <span class="meta-pill">📝 ${r.proposal_count||0} proposals</span>
              </div>
              <div class="req-problem" style="white-space:pre-wrap;">${escR(r.problem)}</div>
              ${r.requirements?`<div class="req-requirements"><strong style="color:var(--gold);font-size:0.75rem;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;">📋 Requirements</strong><span style="white-space:pre-wrap;">${escR(r.requirements)}</span></div>`:''}
            </div>

            <div id="matchIdeas"></div>
            ${isOwner ? '<div id="matchCreators"></div>' : ''}

            ${dealPanel(r)}

            <!-- PROPOSALS (investor view) -->
            ${isOwner&&proposals.length>0?`
            <div class="card">
              <div class="card-title">📝 Proposals <span style="background:var(--gold);color:#000;border-radius:20px;padding:2px 8px;font-size:0.72rem;font-weight:700;">${proposals.length}</span></div>
              ${proposals.map(p=>{
                const name = `${p.creator?.first_name||''} ${p.creator?.last_name||''}`.trim()||p.creator_name||'Creator';
                const init = name[0]?.toUpperCase()||'?';
                return `<div class="proposal-item ${p.status==='shortlisted'?'shortlisted':''} ${p.status==='selected'?'selected':''}">
                  <div class="prop-header">
                    <div class="prop-creator">
                      <div class="prop-av">${escR(init)}</div>
                      <div><div class="prop-name">${escR(name)}</div><div class="prop-sub">${timeAgo(p.created_at)} · ${escR(p.status)}</div></div>
                    </div>
                  </div>
                  <div class="prop-title">${escR(p.title)}</div>
                  <div class="prop-summary">${escR(p.summary)}</div>
                  ${p.approach?`<div style="font-size:0.78rem;color:var(--muted);margin-bottom:10px;line-height:1.6;">${escR(p.approach)}</div>`:''}
                  <div class="prop-footer">
                    ${p.proposed_price?`<span class="prop-price">$${p.proposed_price.toLocaleString()}</span>`:''}
                    ${p.delivery_days?`<span class="prop-days">⏱ ${p.delivery_days}d delivery</span>`:''}
                    <div class="prop-actions">
                      ${p.status==='pending'?`<button class="btn-sm btn-shortlist" onclick="updateProposalStatus(${p.id},'shortlisted')">⭐ Shortlist</button>`:''}
                      ${['pending','shortlisted'].includes(p.status)?`<button class="btn-sm btn-invite" onclick="updateProposalStatus(${p.id},'invited_to_pitch')">🎤 Invite to Pitch</button>`:''}
                      ${['shortlisted','invited_to_pitch'].includes(p.status)?`<button class="btn-sm btn-select" onclick="updateProposalStatus(${p.id},'selected')">🏆 Select</button>`:''}
                      ${p.status==='selected'&&r.status==='agreed'?`<span style="font-size:0.75rem;color:var(--muted);">Selected · see the deal above</span>`:''}
                      ${!['rejected','selected'].includes(p.status)?`<button class="btn-sm btn-reject" onclick="updateProposalStatus(${p.id},'rejected')">✕ Reject</button>`:''}
                      <button class="btn-sm btn-chat" onclick="openChat(${Number(p.creator_id)}, this.dataset.n)" data-n="${escR(name)}">💬 Chat</button>
                    </div>
                  </div>
                </div>`;
              }).join('')}
            </div>`:''}

            ${isOwner&&proposals.length===0?`
            <div class="card" style="text-align:center;padding:3rem;">
              <div style="font-size:2.5rem;margin-bottom:12px;">📭</div>
              <div style="color:var(--muted);font-size:0.875rem;">No proposals yet. The best-matched creators have been alerted, and you can invite more below.</div>
            </div>`:''}

            <!-- CHAT -->
            <div class="card" id="chatSection" style="display:none;">
              <div class="card-title" id="chatHeading">💬 Pitch Chat</div>
              <div class="chat-area">
                <div class="chat-msgs" id="chatMsgs"></div>
                <div class="chat-input-row">
                  <input class="chat-input" id="chatInputField" placeholder="Type your message…" onkeydown="handleChatKey(event)" />
                  <button class="chat-send" onclick="sendChat()">➤</button>
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT -->
          <div>
            <div id="matchMe"></div>
            <!-- BUDGET -->
            <div class="card">
              <div class="card-title">💰 Budget</div>
              <div class="budget-display">${budget}</div>
              <div class="budget-sub">Offered by investor</div>
            </div>

            <!-- CREATOR: SUBMIT PROPOSAL -->
            ${isCreator&&!isOwner?`
            <div class="card">
              ${myProposal?`
                <div class="card-title">Your Proposal</div>
                <div style="background:var(--surface2);border-radius:8px;padding:12px;margin-bottom:12px;">
                  <div style="font-weight:600;font-size:0.875rem;margin-bottom:4px;">${escR(myProposal.title)}</div>
                  <div style="font-size:0.82rem;color:var(--muted);">${escR(myProposal.summary)}</div>
                  <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
                    <span class="status-badge s-${myProposal.status}" style="font-size:0.7rem;">${myProposal.status}</span>
                    ${myProposal.proposed_price?`<span style="font-weight:700;color:var(--gold);">$${myProposal.proposed_price.toLocaleString()}</span>`:''}
                  </div>
                </div>
                ${myProposal.status==='invited_to_pitch'?`<div class="info-box info-blue">🎤 You've been invited to pitch! Send a message to the investor.</div><button class="btn-primary" onclick="openChat(${r.investor_id},'Investor')">💬 Start Pitch Chat</button>`:''}
                ${myProposal.status==='selected'?`<div class="info-box info-green">🏆 Your proposal was selected! ${r.status==='agreed'?'Confirm your final price in the deal panel so the investor can pay into escrow.':''}</div><button class="btn-primary" onclick="openChat(${Number(r.investor_id)},'Investor')">💬 Message the investor</button>`:''}
              `:`
                <div class="card-title">Submit a Proposal</div>
                ${['open','proposals_received'].includes(r.status)?`
                  <div class="field"><label class="lbl">Proposal Title *</label><input type="text" id="propTitle" placeholder="Your solution title" /></div>
                  <div class="field"><label class="lbl">Your Approach *</label><textarea id="propSummary" placeholder="Briefly explain your idea and why it works…"></textarea></div>
                  <div class="field"><label class="lbl">Detailed Plan</label><textarea id="propApproach" placeholder="Go deeper — how would this work?"></textarea></div>
                  <div class="form-row">
                    <div class="field"><label class="lbl">Your Price ($)</label><input type="number" id="propPrice" placeholder="1000" min="0" /></div>
                    <div class="field"><label class="lbl">Delivery (days)</label><input type="number" id="propDays" placeholder="7" min="1" /></div>
                  </div>
                  ${!token?`<a href="/login" class="btn-primary" style="text-align:center;display:block;text-decoration:none;">Sign in to Submit</a>`:`<button class="btn-primary" id="propBtn" onclick="submitProposal()">Submit Proposal →</button>`}
                `:`<div style="text-align:center;padding:1rem;color:var(--muted);font-size:0.875rem;">This request is no longer accepting proposals.</div>`}
              `}
            </div>`:''}

            <!-- NOT LOGGED IN -->
            ${!user?`
            <div class="card" style="text-align:center;">
              <div style="font-size:2.5rem;margin-bottom:12px;">💡</div>
              <div style="font-size:0.875rem;margin-bottom:14px;color:var(--muted);">Sign in to submit a proposal for this request.</div>
              <a href="/login" class="btn-primary" style="text-align:center;display:block;text-decoration:none;">Sign In →</a>
              <a href="/signup" style="display:block;margin-top:8px;text-align:center;color:var(--muted);font-size:0.82rem;">Don't have an account? Join free</a>
            </div>`:''}
          </div>
        </div>`;

      loadMatches(isOwner);
      if (isCreator && myProposal?.status==='invited_to_pitch') openChat(r.investor_id,'Investor');

    } catch(err) {
      document.getElementById('pageContent').innerHTML = `
        <div style="text-align:center;padding:4rem;color:var(--muted);">
          <div style="font-size:3rem;margin-bottom:12px;">😕</div>
          <div style="font-size:1rem;margin-bottom:16px;">Request not found.</div>
          <a href="/idea-requests" style="color:var(--gold);">← Back to Requests</a>
        </div>`;
    }
  }

  initNav();
  loadPage();
  setInterval(() => { if (activeChatCreatorId) loadChat(); }, 10000);
</script>
<script src="/chat-widget.js" defer></script></body>
</html>
