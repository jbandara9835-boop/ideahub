<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — IdeaHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --accent: #f5c842;
    --accent-dim: rgba(245,200,66,0.12);
    --text: #f0ede8;
    --muted: #6e6b65;
    --error: #ff6b6b;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow: hidden;
  }

  @media (max-width: 480px) {
    .card { padding: 2rem 1.25rem 1.5rem; border-radius: 16px; }
    h1 { font-size: 22px; }
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 70vw;
    height: 70vw;
    background: radial-gradient(circle, rgba(245,200,66,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2.5rem 2rem;
    width: 100%;
    max-width: 420px;
    position: relative;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2rem;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 20px;
    height: 20px;
    fill: #0d0d0f;
  }

  .logo-text {
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  h1 {
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0.4rem;
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 0.4rem;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  input::placeholder { color: var(--muted); }

  .password-wrap {
    position: relative;
  }

  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    font-size: 18px;
    transition: color 0.2s;
  }

  .toggle-pw:hover { color: var(--text); }

  .forgot {
    text-align: right;
    margin-top: 0.4rem;
  }

  .forgot a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .forgot a:hover { color: var(--accent); }

  .error-msg {
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    font-size: 13px;
    color: var(--error);
    margin-bottom: 1rem;
    display: none;
  }

  .error-msg.show { display: block; }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: 10px;
    padding: 0.85rem;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Cabinet Grotesk', sans-serif;
    cursor: pointer;
    margin-top: 1.2rem;
    transition: opacity 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,0,0,0.2);
    border-top-color: #0d0d0f;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1.5rem 0;
    color: var(--muted);
    font-size: 12px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .signup-link {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }

  .signup-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .signup-link a:hover { text-decoration: underline; }

  .success-msg {
    text-align: center;
    padding: 1rem;
    font-size: 14px;
    color: #6ee7b7;
    display: none;
  }

  .success-msg.show { display: block; }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26C17.81 13.47 19 11.38 19 9c0-3.87-3.13-7-7-7zm0 2c2.76 0 5 2.24 5 5 0 1.9-1.06 3.54-2.6 4.4L14 14h-4l-.4-.6C8.06 12.54 7 10.9 7 9c0-2.76 2.24-5 5-5zm-1 13h2v1h-2v-1zm-1 2h4v1h-4v-1z"/>
      </svg>
    </div>
    <span class="logo-text"><a href="/" style="text-decoration:none;color:inherit;">IdeaHub</a></span>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your account to continue</p>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg">Login successful! Redirecting...</div>
  <div id="codeBox" hidden style="margin:0 0 1rem;padding:1rem;border:1px solid rgba(245,200,66,.35);border-radius:12px;background:rgba(245,200,66,.06);">
    <div style="font-weight:600;margin-bottom:4px;">Enter your sign-in code</div>
    <div id="codeNote" style="font-size:13px;color:#9a9080;margin-bottom:10px;">We emailed a 6-digit code to the admin address. Check Spam if it isn't in your inbox.</div>
    <input id="adminCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" aria-label="Sign-in code"
      style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#141417;color:#f0ede8;font-size:20px;letter-spacing:6px;text-align:center;" />
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right: 42px;" />
      <button class="toggle-pw" id="togglePw" type="button" aria-label="Toggle password visibility">
        <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="forgot"><a href="/forgot-password">Forgot password?</a></div>
  </div>

  <a href="/auth/google" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#0d0d0f;border:none;border-radius:10px;padding:0.85rem;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:1.2rem;">
    <img src="https://www.google.com/favicon.ico" width="18" height="18" /> Continue with Google
  </a>

  <div class="divider">or</div>

  <button class="btn" id="loginBtn" onclick="handleLogin()">
    <div class="spinner" id="spinner"></div>
    <span id="btnText">Sign in</span>
  </button>

  <div class="divider">or</div>

  <div class="signup-link">
    Don't have an account? <a href="/signup">Create one free</a>
  </div>
</div>

<script>
  const togglePw = document.getElementById('togglePw');
  const passwordInput = document.getElementById('password');
  let pwVisible = false;

  togglePw.addEventListener('click', () => {
    pwVisible = !pwVisible;
    passwordInput.type = pwVisible ? 'text' : 'password';
    document.getElementById('eyeIcon').innerHTML = pwVisible
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });

  let adminChallenge = null;
  const roleLinks = {
    idea_creator: '/dashboard', patent_seller: '/dashboard',
    investor: '/buyer-dashboard', corporate_services: '/support-dashboard',
    virtual_manager: '/support-dashboard', chartered_accountant:'/support-dashboard', patent_attorney: '/support-dashboard',
    business_owner: '/business-dashboard', admin: '/admin'
  };
  function showCodeBox(ch, note) {
    adminChallenge = ch;
    document.getElementById('codeBox').hidden = false;
    if (note) document.getElementById('codeNote').textContent = note + ' Check Spam if it isn\'t in your inbox.';
    document.getElementById('btnText').textContent = 'Confirm code';
    setTimeout(() => document.getElementById('adminCode').focus(), 50);
  }
  // Arrived from Google sign-in as admin, or after a blocked sign-in
  (function () {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('admin_challenge')) { showCodeBox(h.get('admin_challenge')); history.replaceState(null, '', '/login'); }
    const err = new URLSearchParams(location.search).get('error');
    const msgs = { suspended: 'This account is suspended. Contact support@ideahub.it.com if you think this is a mistake.', gone: 'That account no longer exists.', google: 'Google sign-in did not complete. Please try again.' };
    if (msgs[err]) { const e = document.getElementById('errorMsg'); e.textContent = msgs[err]; e.classList.add('show'); }
  })();
  async function verifyCode() {
    const errorMsg = document.getElementById('errorMsg'), btn = document.getElementById('loginBtn'), btnText = document.getElementById('btnText');
    errorMsg.classList.remove('show');
    const code = document.getElementById('adminCode').value.replace(/\D/g, '');
    if (code.length !== 6) { errorMsg.textContent = 'Enter the 6-digit code from the email.'; errorMsg.classList.add('show'); return; }
    btn.disabled = true; btnText.textContent = 'Checking...';
    try {
      const res = await fetch('/api/auth/admin-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ challenge: adminChallenge, code }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'That code did not work.');
      localStorage.setItem('ih_token', data.token);
      localStorage.setItem('ih_user', JSON.stringify(data.user));
      location.href = '/admin';
    } catch (err) {
      errorMsg.textContent = err.message; errorMsg.classList.add('show');
      btn.disabled = false; btnText.textContent = 'Confirm code';
    }
  }

  async function handleLogin() {
    if (adminChallenge) return verifyCode();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');

    if (!email || !password) {
      errorMsg.textContent = 'Please enter your email and password.';
      errorMsg.classList.add('show');
      return;
    }

    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Signing in...';

    try {
      const API_URL = window.location.hostname === 'localhost'
        ? 'http://localhost:3000'
        : '';

      const res = await fetch(`${API_URL}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Login failed');
      }
      if (data.needs_code) {
        btn.disabled = false; spinner.style.display = 'none';
        showCodeBox(data.challenge, data.message);
        return;
      }

      localStorage.setItem('ih_token', data.token);
      localStorage.setItem('ih_user', JSON.stringify(data.user));

      successMsg.classList.add('show');
      btnText.textContent = 'Success!';

      setTimeout(() => {
        // ?next=/some-page sends the user back where they started (same-site paths only)
        const next = new URLSearchParams(location.search).get('next') || '';
        window.location.href = /^\/(?![\/\\])/.test(next) ? next : (roleLinks[data.user.role] || '/dashboard');
      }, 1000);

    } catch (err) {
      errorMsg.textContent = err.message || 'Something went wrong. Please try again.';
      errorMsg.classList.add('show');
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = 'Sign in';
    }
  }
</script>
<script src="/chat-widget.js" defer></script></body>
</html>
