<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages — IdeaHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --accent: #f5c842;
    --accent-dim: rgba(245,200,66,0.12);
    --text: #f0ede8;
    --muted: #6e6b65;
    --error: #ff6b6b;
    --success: #6ee7b7;
  }

  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem 1rem; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2.5rem; padding: 0 0.5rem; }
  .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 18px; height: 18px; fill: #0d0d0f; }
  .logo-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
  .nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 0.6rem 0.75rem; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.15s; text-decoration: none; border: none; background: none; width: 100%; text-align: left; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-item.active { color: var(--accent); background: var(--accent-dim); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-divider { height: 1px; background: var(--border); margin: 0.75rem 0; }
  .nav-section-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 0.75rem 0.75rem 0.25rem; }
  .user-card { display: flex; align-items: center; gap: 10px; padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border); margin-top: auto; }
  .avatar-sm { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-dim); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-name-sb { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role-sb { font-size: 11px; color: var(--muted); }
  .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; font-size: 16px; transition: color 0.2s; }
  .logout-btn:hover { color: var(--error); }

  /* MAIN LAYOUT */
  .main { margin-left: 220px; height: 100vh; display: flex; flex-direction: column; }

  .topbar { padding: 1.5rem 2rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.9rem; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .back-btn:hover { color: var(--text); border-color: var(--border-hover); }
  .page-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

  /* CHAT LAYOUT */
  .chat-layout { display: flex; flex: 1; overflow: hidden; }

  /* CONVERSATIONS LIST */
  .conv-list { width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .conv-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .conv-items { flex: 1; overflow-y: auto; }
  .conv-item { display: flex; align-items: center; gap: 12px; padding: 1rem 1.25rem; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .conv-item:hover { background: rgba(255,255,255,0.03); }
  .conv-item.active { background: var(--accent-dim); border-left: 2px solid var(--accent); }
  .conv-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
  .conv-info { flex: 1; min-width: 0; }
  .conv-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv-time { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  /* CHAT AREA */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .chat-header-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); }
  .chat-header-name { font-size: 15px; font-weight: 600; }
  .chat-header-sub { font-size: 12px; color: var(--muted); }

  .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 12px; }

  .msg-bubble { max-width: 65%; display: flex; flex-direction: column; gap: 4px; }
  .msg-bubble.me { align-self: flex-end; align-items: flex-end; }
  .msg-bubble.them { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 0.65rem 1rem; border-radius: 16px; font-size: 14px; line-height: 1.5;
    word-break: break-word;
  }
  .me .bubble { background: var(--accent); color: #0d0d0f; border-bottom-right-radius: 4px; }
  .them .bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; }

  .bubble-time { font-size: 11px; color: var(--muted); padding: 0 4px; }

  /* IDEA REFERENCE */
  .idea-ref { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

  /* INPUT */
  .chat-input-area { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .chat-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; resize: none; max-height: 120px; transition: border-color 0.2s; line-height: 1.5; }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--muted); }
  .send-btn { width: 42px; height: 42px; background: var(--accent); border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s, transform 0.15s; flex-shrink: 0; }
  .send-btn:hover { opacity: 0.9; transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 18px; height: 18px; fill: #0d0d0f; }

  /* EMPTY STATES */
  .empty-conv { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--muted); gap: 10px; }
  .empty-icon { font-size: 40px; }
  .empty-text { font-size: 14px; }

  .no-chat-selected { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--muted); gap: 10px; }

  .spin { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 900px) {
    .sidebar { width: 60px; padding: 1rem 0.5rem; }
    .logo-text, .nav-item span:not(.nav-icon), .user-info, .logout-btn { display: none; }
    .logo { justify-content: center; }
    .nav-item { justify-content: center; padding: 0.6rem; }
    .user-card { justify-content: center; padding: 0.5rem; }
    .main { margin-left: 60px; }
    .conv-list { width: 240px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26C17.81 13.47 19 11.38 19 9c0-3.87-3.13-7-7-7zm0 2c2.76 0 5 2.24 5 5 0 1.9-1.06 3.54-2.6 4.4L14 14h-4l-.4-.6C8.06 12.54 7 10.9 7 9c0-2.76 2.24-5 5-5zm-1 13h2v1h-2v-1zm-1 2h4v1h-4v-1z"/></svg></div>
    <span class="logo-text"><a href="/" style="text-decoration:none;color:inherit;">IdeaHub</a></span>
  </div>
  <nav class="nav">
    <a class="nav-item" href="/dashboard"><span class="nav-icon">⚡</span><span>Dashboard</span></a>
    <a class="nav-item" href="/"><span class="nav-icon">💡</span><span>Browse Ideas</span></a>
    <a class="nav-item" href="/submit"><span class="nav-icon">✚</span><span>Submit Idea</span></a>
    <a class="nav-item" href="/profile"><span class="nav-icon">👤</span><span>Profile</span></a>
    <div class="nav-divider"></div>
    <a class="nav-item active" href="/messages"><span class="nav-icon">💬</span><span>Messages</span></a>
    <a class="nav-item" href="/transactions"><span class="nav-icon">💸</span><span>Transactions</span></a>
  </nav>
  <div class="user-card">
    <div class="avatar-sm" id="sidebarAvatar">?</div>
    <div class="user-info">
      <div class="user-name-sb" id="sidebarName">Loading...</div>
      <div class="user-role-sb" id="sidebarRole">—</div>
              <div id="sidebarStars" style="font-size:11px;margin-top:2px;letter-spacing:1px;"></div>
    </div>
    <button class="logout-btn" onclick="logout()" title="Logout">✕</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <a class="back-btn" href="/dashboard">← Back</a>
    <div class="page-title">Messages</div>
  </div>

  <div class="chat-layout">
    <!-- CONVERSATIONS -->
    <div class="conv-list">
      <div class="conv-header">Conversations</div>
      <div class="conv-items" id="convList">
        <div style="display:flex;align-items:center;justify-content:center;padding:2rem;gap:10px;color:var(--muted);font-size:13px;">
          <div class="spin"></div> Loading...
        </div>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
      <div class="no-chat-selected">
        <div class="empty-icon">💬</div>
        <div class="empty-text">Select a conversation to start chatting</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

  // ── SHARED SIDEBAR NAV ──
  function renderSidebar() {
    const path = window.location.pathname;
    const nav = document.querySelector('.nav');
    if (!nav) return;
    nav.innerHTML = `
      <div class="nav-section-label">My Account</div>
      <a class="nav-item ${path === '/dashboard' || path === '/buyer-dashboard' || path === '/business-dashboard' || path === '/support-dashboard' ? 'active' : ''}" href="${user && ['investor','corporate_services'].includes(user.role) ? '/buyer-dashboard' : user && ['virtual_manager','patent_attorney'].includes(user.role) ? '/support-dashboard' : user && user.role === 'business_owner' ? '/business-dashboard' : '/dashboard'}"><span class="nav-icon">⚡</span><span>Dashboard</span></a>
      <a class="nav-item ${path === '/profile' ? 'active' : ''}" href="/profile"><span class="nav-icon">👤</span><span>My Profile</span></a>
      <div class="nav-section-label">Marketplace</div>
      <a class="nav-item ${path === '/browse' ? 'active' : ''}" href="/browse"><span class="nav-icon">🔍</span><span>Browse Ideas</span></a>
      <a class="nav-item ${path === '/idea-requests' ? 'active' : ''}" href="/idea-requests"><span class="nav-icon">🎯</span><span>Investor Requests</span></a>
      <div class="nav-section-label">Support</div>
      <a class="nav-item" href="/find-support?type=patent_attorney"><span class="nav-icon">⚖️</span><span>Find an Attorney</span></a>
      <a class="nav-item" href="/find-support?type=virtual_manager"><span class="nav-icon">🧑‍💼</span><span>Virtual Manager</span></a>
      <a class="nav-item ${path === '/find-support' ? 'active' : ''}" href="/find-support"><span class="nav-icon">🤝</span><span>Find Support</span></a>
      <div class="nav-section-label">Activity</div>
      <a class="nav-item ${path === '/messages' ? 'active' : ''}" href="/messages"><span class="nav-icon">💬</span><span>Messages</span></a>
      <a class="nav-item ${path === '/transactions' ? 'active' : ''}" href="/transactions"><span class="nav-icon">💸</span><span>Transactions</span></a>
    `;
  }
  const token = localStorage.getItem('ih_token');
  const user = JSON.parse(localStorage.getItem('ih_user') || 'null');
  renderSidebar();

  if (!token || !user) window.location.href = '/login';

  const myId = user?.id;
  let allMessages = [];
  let conversations = [];
  let activeConv = null;

  if (user) {
    const initials = (user.first_name?.[0] || '') + (user.Last_name?.[0] || '');
    const avatarUrl = user.avatar_url || user.avatarUrl;
      const avatarEl = document.getElementById('sidebarAvatar');
      if (avatarEl) {
        if (avatarUrl) {
          avatarEl.innerHTML = `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
        } else {
          avatarEl.textContent = (user.first_name?.[0] || '?');
        }
      }
    const sbName = document.getElementById('sidebarName');
      if (sbName) sbName.textContent = `${user.first_name || ''} ${user.last_name || user.Last_name || ''}`.trim();
      const starEl = document.getElementById('sidebarStars');
      if (starEl) starEl.innerHTML = [1,2,3,4,5].map(i=>`<span style="color:${i<=(user.profile_stars||0)?'#f5c842':'#3a3a3a'}">★</span>`).join('');
    document.getElementById('sidebarRole').textContent = user.role === 'idea_creator' ? 'Idea Creator' : 'Investor';
  }

  function logout() {
    localStorage.removeItem('ih_token');
    localStorage.removeItem('ih_user');
    window.location.href = '/login';
  }

  function formatTime(d) {
    const date = new Date(d);
    const now = new Date();
    const diff = now - date;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function getInitials(name) {
    if (!name) return '?';
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  }

  async function loadMessages() {
    try {
      const res = await fetch(`${API_URL}/api/messages`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.status === 401) { logout(); return; }
      allMessages = await res.json();
      buildConversations();
    } catch (err) {
      document.getElementById('convList').innerHTML = `<div style="padding:1rem;color:var(--error);font-size:13px;">Failed to load messages.</div>`;
    }
  }

  function buildConversations() {
    const convMap = {};
    allMessages.forEach(msg => {
      const otherId = msg.from_id === myId ? msg.to_id : msg.from_id;
      const otherName = msg.from_id === myId ? (msg.to_name || `User ${msg.to_id}`) : (msg.from_name || `User ${msg.from_id}`);
      if (!convMap[otherId]) {
        convMap[otherId] = { id: otherId, name: otherName, messages: [], lastMsg: null };
      }
      convMap[otherId].messages.push(msg);
      if (!convMap[otherId].lastMsg || new Date(msg.created_at) > new Date(convMap[otherId].lastMsg.created_at)) {
        convMap[otherId].lastMsg = msg;
      }
    });

    conversations = Object.values(convMap).sort((a, b) => new Date(b.lastMsg.created_at) - new Date(a.lastMsg.created_at));
    renderConvList();
  }

  function renderConvList() {
    const el = document.getElementById('convList');
    if (conversations.length === 0) {
      el.innerHTML = `<div class="empty-conv" style="padding:2rem;text-align:center;"><div class="empty-icon">💬</div><div class="empty-text" style="font-size:13px;">No messages yet</div></div>`;
      return;
    }

    el.innerHTML = conversations.map(conv => `
      <div class="conv-item ${activeConv?.id === conv.id ? 'active' : ''}" onclick="openConv(${conv.id})">
        <div class="conv-avatar">${getInitials(conv.name)}</div>
        <div class="conv-info">
          <div class="conv-name">${conv.name}</div>
          <div class="conv-preview">${conv.lastMsg?.text || ''}</div>
        </div>
        <div class="conv-time">${formatTime(conv.lastMsg?.created_at)}</div>
      </div>
    `).join('');
  }

  function openConv(otherId) {
    activeConv = conversations.find(c => c.id === otherId);
    if (!activeConv) return;
    renderConvList();
    renderChatArea();
  }

  function renderChatArea() {
    if (!activeConv) return;
    const msgs = activeConv.messages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    document.getElementById('chatArea').innerHTML = `
      <div class="chat-header">
        <div class="chat-header-avatar">${getInitials(activeConv.name)}</div>
        <div>
          <div class="chat-header-name">${activeConv.name}</div>
          <div class="chat-header-sub">${msgs.length} message${msgs.length !== 1 ? 's' : ''}</div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        ${msgs.length === 0 ? `<div class="empty-conv"><div class="empty-icon">👋</div><div class="empty-text">Say hello!</div></div>` :
          msgs.map(msg => {
            const isMe = msg.from_id === myId;
            return `
              <div class="msg-bubble ${isMe ? 'me' : 'them'}">
                ${msg.idea_id ? `<div class="idea-ref">💡 Re: Idea #${msg.idea_id}</div>` : ''}
                <div class="bubble">${msg.text}</div>
                <div class="bubble-time">${formatTime(msg.created_at)}</div>
              </div>
            `;
          }).join('')
        }
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="msgInput" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    `;

    const chatMessages = document.getElementById('chatMessages');
    if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
    document.getElementById('msgInput')?.focus();
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    if (!input || !activeConv) return;
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';

    const tempMsg = {
      id: 'temp_' + Date.now(),
      from_id: myId,
      to_id: activeConv.id,
      text,
      created_at: new Date().toISOString(),
    };

    activeConv.messages.push(tempMsg);
    activeConv.lastMsg = tempMsg;
    renderChatArea();

    try {
      const res = await fetch(`${API_URL}/api/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ toId: activeConv.id, text })
      });

      if (res.ok) {
        const saved = await res.json();
        activeConv.messages = activeConv.messages.filter(m => m.id !== tempMsg.id);
        activeConv.messages.push(saved);
        activeConv.lastMsg = saved;
        renderConvList();
        renderChatArea();
      }
    } catch (err) {
      console.error('Send failed:', err);
    }
  }

  loadMessages();
  setInterval(loadMessages, 15000);
</script>
</body>
</html>
