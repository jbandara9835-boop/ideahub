<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — IdeaHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24;
  --border: rgba(255,255,255,0.08); --accent: #f5c842;
  --accent-dim: rgba(245,200,66,0.12); --text: #f0ede8;
  --muted: #6e6b65; --error: #ff6b6b; --success: #6ee7b7;
}
body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
.logo { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 2rem; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.logo-icon svg { width: 20px; height: 20px; fill: #0d0d0f; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; }
.card h1 { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.card p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 1.75rem; }
.field { margin-bottom: 1.1rem; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.field input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; transition: border-color 0.2s; }
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }
.btn { width: 100%; background: var(--accent); color: #0d0d0f; border: none; border-radius: 10px; padding: 0.9rem; font-size: 15px; font-weight: 700; font-family: 'Syne', sans-serif; cursor: pointer; transition: opacity 0.2s; margin-top: 0.5rem; }
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { border-radius: 8px; padding: 12px 16px; font-size: 13px; margin-top: 1rem; display: none; }
.msg.show { display: block; }
.msg.success { background: rgba(110,231,183,0.1); border: 1px solid rgba(110,231,183,0.3); color: var(--success); }
.msg.error { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: var(--error); }
.invalid-token { text-align: center; padding: 2rem 0; }
.invalid-token h2 { font-family: 'Syne', sans-serif; font-size: 20px; margin-bottom: 8px; color: var(--error); }
.invalid-token p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; }
.back-link { margin-top: 1.5rem; text-align: center; font-size: 13px; color: var(--muted); }
.back-link a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<a href="/" class="logo">
  <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26C17.81 13.47 19 11.38 19 9c0-3.87-3.13-7-7-7zm0 2c2.76 0 5 2.24 5 5 0 1.9-1.06 3.54-2.6 4.4L14 14h-4l-.4-.6C8.06 12.54 7 10.9 7 9c0-2.76 2.24-5 5-5zm-1 13h2v1h-2v-1zm-1 2h4v1h-4v-1z"/></svg></div>
  IdeaHub
</a>
<div class="card" id="cardContent">
  <div style="text-align:center;padding:2rem 0;">
    <div style="width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;"></div>
    <p style="color:var(--muted);">Verifying reset link…</p>
  </div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<script>
  const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    document.getElementById('cardContent').innerHTML = `
      <div class="invalid-token">
        <h2>Invalid Link</h2>
        <p>This reset link is invalid or has expired.</p>
        <a href="/forgot-password" style="display:inline-block;background:var(--accent);color:#0d0d0f;font-weight:700;padding:10px 24px;border-radius:8px;text-decoration:none;">Request New Link →</a>
      </div>`;
  } else {
    document.getElementById('cardContent').innerHTML = `
      <h1>Set New Password</h1>
      <p>Enter your new password below. Make it strong!</p>
      <div class="field">
        <label>New Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your new password" />
      </div>
      <button class="btn" id="submitBtn" onclick="submit()">Reset Password →</button>
      <div class="msg success" id="successMsg"></div>
      <div class="msg error" id="errorMsg"></div>
      <div class="back-link"><a href="/login">← Back to Sign In</a></div>
    `;
  }

  async function submit() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');
    successMsg.classList.remove('show');
    errorMsg.classList.remove('show');

    if (!password) { errorMsg.textContent = 'Please enter a new password.'; errorMsg.classList.add('show'); return; }
    if (password.length < 6) { errorMsg.textContent = 'Password must be at least 6 characters.'; errorMsg.classList.add('show'); return; }
    if (password !== confirmPassword) { errorMsg.textContent = 'Passwords do not match.'; errorMsg.classList.add('show'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Resetting…';

    try {
      const res = await fetch(`${API_URL}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      successMsg.textContent = '✅ Password reset successfully! Redirecting to login…';
      successMsg.classList.add('show');
      btn.textContent = '✓ Done!';
      setTimeout(() => window.location.href = '/login', 2500);
    } catch(err) {
      errorMsg.textContent = err.message || 'Something went wrong. Please try again.';
      errorMsg.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Reset Password →';
    }
  }
</script>
</body>
</html>
